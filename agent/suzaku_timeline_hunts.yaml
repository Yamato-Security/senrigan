# Built-in Hunt Queries for Suzaku `aws-ct-timeline` output
#
# Schema (identical to builtin_hunts.yaml so the sidebar and report code are shared):
#   category:    Sidebar grouping label
#   label:       Display name shown in the UI
#   description: One-line explanation of what this query surfaces and why it matters
#   severity:    P1..P4, as in builtin_hunts.yaml
#   techniques:  Optional Threat Technique Catalog / ATT&CK mappings
#   chart:       Optional chart config (type: bar|timeseries, x/y/bucket) — for a
#                bar chart `x` is the category column and `y` the measure(s)
#   min_level:   Declares a severity floor the SQL hardcodes. Severity otherwise
#                belongs to the sidebar filter, which has already narrowed the
#                rows; a second undeclared floor silently empties the hunt when
#                the analyst widens the selection.
#   prompt:      Natural language prompt sent to the AI agent (requires API key)
#   sql:         Pre-built DuckDB SQL for direct execution (no API key needed)
#
# SQL conventions for this dataset:
#   - Table: timeline — every row is one rule match against one CloudTrail event.
#   - ALL identifiers are double-quoted: the columns are PascalCase.
#   - "Timestamp" is a real TIMESTAMP — used directly, never CAST.
#   - "Level" is the ordered ENUM suzaku_level: ORDER BY "Level" DESC is severity
#     order, but a threshold needs the cast, "Level" >= 'high'::suzaku_level.
#   - Absent values are NULL, so absence is tested with IS NULL / IS NOT NULL.
#   - "Tactics" / "TechniqueIDs" / "OtherTags" are VARCHAR[] — unnest or list_contains.
#   - "EventID" is NOT unique (one event can match several rules).
#   - The table holds millions of rows: every query has both ORDER BY and LIMIT.

# ===========================================================================
# Triage
# ===========================================================================

- category: "\U0001f6a8 Triage"
  label: "\U0001f6a8 Critical & High Detections"
  description: "The shortest path to what matters: newest critical and high severity rule matches."
  severity: "P1"
  min_level: "high"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Show the most recent critical and high severity Suzaku detections with
    their rule title, event name, principal, source IP and event ID.
  sql: |
    SELECT
        "Timestamp",
        "Level",
        "RuleTitle",
        "EventName",
        "UserARN",
        "SrcIP",
        "AwsRegion",
        "ErrorCode",
        "EventID"
    FROM timeline
    WHERE "Level" >= 'high'::suzaku_level
    ORDER BY "Timestamp" DESC
    LIMIT 200

- category: "\U0001f6a8 Triage"
  label: "\U0001f4ca Detection Volume by Severity"
  description: "How the dataset is distributed across severities — sets expectations before drilling in."
  severity: "P4"
  chart:
    type: bar
    x: "Level"
    y: "detections"
  prompt: |
    Break down Suzaku detections by severity level, ordered from critical to
    informational, including how many distinct rules and events each covers.
  sql: |
    SELECT
        "Level",
        count(*)                     AS detections,
        count(DISTINCT "EventID")    AS distinct_events,
        count(DISTINCT "RuleTitle")  AS distinct_rules,
        min("Timestamp")             AS first_seen,
        max("Timestamp")             AS last_seen
    FROM timeline
    GROUP BY "Level"
    ORDER BY "Level" DESC
    LIMIT 10

- category: "\U0001f6a8 Triage"
  label: "\U0001f4c8 Detection Trend per Day"
  description: "Daily detection volume split by severity — spikes mark the days worth investigating."
  severity: "P4"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Show the daily count of Suzaku detections, separating medium and above from
    the rest, so I can see which days spiked.
  sql: |
    SELECT
        date_trunc('day', "Timestamp")                                 AS day,
        count(*)                                                       AS detections,
        count(*) FILTER (WHERE "Level" >= 'high'::suzaku_level)         AS high_plus,
        count(*) FILTER (WHERE "Level" = 'medium')                      AS medium,
        count(DISTINCT "UserARN")                                      AS principals
    FROM timeline
    GROUP BY day
    ORDER BY day DESC
    LIMIT 365

# ===========================================================================
# Tempo — when did this happen, and for how long
# ===========================================================================

- category: "⏱ Tempo"
  label: "\U0001f525 Detection Burst per Hour"
  description: "The hours the detections cluster in. Scoping an incident starts with its window, and a daily total is too coarse to collect evidence against."
  severity: "P2"
  chart:
    type: bar
    x: "hour"
    y: "detections"
  prompt: |
    Count Suzaku detections per hour, with the severe ones, the distinct
    principals, rules and source IPs involved, busiest hour first.
  sql: |
    SELECT
        date_trunc('hour', "Timestamp")                          AS hour,
        count(*)                                                 AS detections,
        count(*) FILTER (WHERE "Level" >= 'high'::suzaku_level)   AS severe,
        count(DISTINCT "UserARN")                                AS principals,
        count(DISTINCT "RuleTitle")                              AS rules,
        count(DISTINCT "SrcIP")                                  AS source_ips
    FROM timeline
    GROUP BY hour
    ORDER BY detections DESC, severe DESC
    LIMIT 100

- category: "⏱ Tempo"
  label: "\U0001f319 Off-Hours & Weekend Detections"
  description: "Detections outside 06:00-22:00 or on a weekend, per principal and hour. Hours are read in the timezone Suzaku wrote — suzaku_meta.timestamp_tz, UTC unless the run used --localtime — so check that before reading anything into them."
  severity: "P2"
  techniques:
    - tid: "T1078"
      name: "Valid Accounts"
      summary: "Stolen credentials are used on the operator's clock, not the owner's; activity outside a principal's normal hours is the cheapest signal of that."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1078.html"
  prompt: |
    Show Suzaku detections that happened outside working hours or at the
    weekend, grouped by principal and hour of day, with severity counts.
  sql: |
    SELECT
        "UserARN",
        hour("Timestamp")                                        AS hour_of_day,
        count(*)                                                 AS detections,
        count(*) FILTER (WHERE "Level" >= 'high'::suzaku_level)   AS severe,
        count(*) FILTER (WHERE isodow("Timestamp") >= 6)         AS on_weekend,
        count(DISTINCT "RuleTitle")                              AS rules,
        min("Timestamp")                                         AS first_seen,
        max("Timestamp")                                         AS last_seen
    FROM timeline
    WHERE hour("Timestamp") < 6
       OR hour("Timestamp") >= 22
       OR isodow("Timestamp") >= 6
    GROUP BY "UserARN", hour_of_day
    ORDER BY severe DESC, detections DESC
    LIMIT 100

- category: "⏱ Tempo"
  label: "⏳ Principal Dwell Time"
  description: "How long each principal stayed active, from its first detection to its last. The span is what an evidence-collection window has to cover."
  severity: "P2"
  chart:
    type: bar
    x: "UserARN"
    y: "active_minutes"
  prompt: |
    For each principal show the first and last Suzaku detection, the span
    between them in minutes, and how many days it was active on.
  sql: |
    SELECT
        "UserARN",
        min("Timestamp")                                         AS first_seen,
        max("Timestamp")                                         AS last_seen,
        date_diff('minute', min("Timestamp"), max("Timestamp"))  AS active_minutes,
        count(DISTINCT date_trunc('day', "Timestamp"))           AS active_days,
        count(*)                                                 AS detections,
        count(*) FILTER (WHERE "Level" >= 'high'::suzaku_level)   AS severe,
        count(DISTINCT "RuleTitle")                              AS rules
    FROM timeline
    WHERE "UserARN" IS NOT NULL
    GROUP BY "UserARN"
    ORDER BY severe DESC, detections DESC
    LIMIT 100

# ===========================================================================
# Rules
# ===========================================================================

- category: "\U0001f4dc Rules"
  label: "\U0001f3af Top Rules by Detection Volume"
  description: "Which detections dominate the signal at the severities you selected, and over how many principals they spread."
  severity: "P3"
  chart:
    type: bar
    x: "RuleTitle"
    y: "detections"
  prompt: |
    Rank Suzaku rules by how many detections they produced, including how many
    distinct principals and source IPs each one touched.
  sql: |
    SELECT
        "RuleTitle",
        "Level",
        count(*)                    AS detections,
        count(DISTINCT "UserARN")   AS principals,
        count(DISTINCT "SrcIP")     AS source_ips,
        min("Timestamp")            AS first_seen,
        max("Timestamp")            AS last_seen
    FROM timeline
    GROUP BY "RuleTitle", "Level"
    ORDER BY detections DESC
    LIMIT 50

- category: "\U0001f4dc Rules"
  label: "\U0001f48e Rare Rules (Fired Once)"
  description: "Rules that matched exactly once. Rarity is the cheapest anomaly signal in a large dataset."
  severity: "P3"
  prompt: |
    Find Suzaku rules that fired exactly once in the whole dataset, with the
    event and principal involved.
  sql: |
    SELECT
        "RuleTitle",
        "Level",
        min("Timestamp")            AS seen_at,
        min("EventName")            AS event_name,
        min("UserARN")              AS user_arn,
        min("SrcIP")                AS src_ip,
        min("EventID")              AS event_id
    FROM timeline
    GROUP BY "RuleTitle", "Level"
    HAVING count(*) = 1
    ORDER BY "Level" DESC, seen_at DESC
    LIMIT 200

- category: "\U0001f4dc Rules"
  label: "\U0001f195 Rule Onset (First / Last Seen)"
  description: "Rules that only started firing recently — a new detection appearing mid-timeline is a lead."
  severity: "P3"
  prompt: |
    For each Suzaku rule show when it was first and last seen and how long its
    activity window is, ordered by the most recent first appearance.
  sql: |
    SELECT
        "RuleTitle",
        "Level",
        min("Timestamp")  AS first_seen,
        max("Timestamp")  AS last_seen,
        date_diff('day', min("Timestamp"), max("Timestamp")) AS active_days,
        count(*)          AS detections
    FROM timeline
    GROUP BY "RuleTitle", "Level"
    ORDER BY first_seen DESC
    LIMIT 100

# ===========================================================================
# Identity
# ===========================================================================

- category: "\U0001f511 Identity"
  label: "\U0001f464 Top Principals by Severe Detections"
  description: "Which identities carry the most severe detections — the usual starting point of an investigation."
  severity: "P2"
  chart:
    type: bar
    x: "UserARN"
    y: "severe"
  techniques:
    - tid: "T1078"
      name: "Valid Accounts"
      summary: "Adversaries use legitimate credentials to blend into normal activity."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1078.html"
  prompt: |
    Rank principals (UserARN) by their number of critical and high severity
    Suzaku detections, showing distinct rules, source IPs and their activity window.
  sql: |
    SELECT
        "UserARN",
        "UserType",
        count(*) FILTER (WHERE "Level" >= 'high'::suzaku_level)  AS severe,
        count(*) FILTER (WHERE "Level" = 'medium')               AS medium,
        count(*)                                                 AS detections,
        count(DISTINCT "RuleTitle")                              AS rules,
        count(DISTINCT "SrcIP")                                  AS source_ips,
        min("Timestamp")                                         AS first_seen,
        max("Timestamp")                                         AS last_seen
    FROM timeline
    WHERE "UserARN" IS NOT NULL
    GROUP BY "UserARN", "UserType"
    ORDER BY severe DESC, detections DESC
    LIMIT 50

- category: "\U0001f511 Identity"
  label: "\U0001f451 Root Account Activity Profile"
  description: "What the root identity actually did, per day and API action. Root is over half of a real timeline, so a newest-first list of rows would be truncated noise; each group carries one event ID to cite."
  severity: "P1"
  techniques:
    - tid: "T1078.004"
      name: "Valid Accounts: Cloud Accounts"
      summary: "Use of the highly privileged root account bypasses IAM guardrails entirely."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1078.004.html"
  prompt: |
    Summarise Suzaku detections on the AWS root account by day and API action,
    with the rule, how many failed, and one event ID per group to cite.
  sql: |
    SELECT
        date_trunc('day', "Timestamp")                    AS day,
        "EventName",
        "RuleTitle",
        max("Level")                                      AS max_level,
        count(*)                                          AS detections,
        count(*) FILTER (WHERE "ErrorCode" IS NOT NULL)   AS failed,
        count(DISTINCT "SrcIP")                           AS source_ips,
        count(DISTINCT "AwsRegion")                       AS regions,
        arg_max("EventID", "Timestamp")                   AS sample_event_id
    FROM timeline
    WHERE lower("UserType") = 'root' OR "UserARN" LIKE '%:root'
    GROUP BY day, "EventName", "RuleTitle"
    ORDER BY day DESC, detections DESC
    LIMIT 200

- category: "\U0001f511 Identity"
  label: "\U0001f5dd Access Keys Behind Detections"
  description: "Long-lived access keys ranked by detections — a compromised key shows up here first."
  severity: "P2"
  techniques:
    - tid: "T1552.001"
      name: "Unsecured Credentials: Credentials In Files"
      summary: "Leaked long-lived access keys let an adversary call the API directly."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1552.001.html"
  prompt: |
    Group Suzaku detections by access key ID, ignoring calls with no key, and
    show the principal, source IP count and activity window for each.
  sql: |
    SELECT
        "UserAccessKeyID",
        min("UserARN")                                           AS user_arn,
        count(*)                                                 AS detections,
        count(*) FILTER (WHERE "Level" >= 'high'::suzaku_level)   AS severe,
        count(DISTINCT "SrcIP")                                  AS source_ips,
        count(DISTINCT "RuleTitle")                              AS rules,
        min("Timestamp")                                         AS first_seen,
        max("Timestamp")                                         AS last_seen
    FROM timeline
    WHERE "UserAccessKeyID" IS NOT NULL
    GROUP BY "UserAccessKeyID"
    ORDER BY severe DESC, detections DESC
    LIMIT 100

- category: "\U0001f511 Identity"
  label: "\U0001f47b Unattributed & Service-Principal Detections"
  description: "Detections carrying no principal ARN. AWS redacts the identity of a failed console login, and service-principal calls have none — every other identity hunt filters both away."
  severity: "P2"
  techniques:
    - tid: "T1078.004"
      name: "Valid Accounts: Cloud Accounts"
      summary: "A failed console login against an unknown identity is how credential stuffing looks in CloudTrail: AWS withholds the user name, so the attempt is attributable only by source IP."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1078.004.html"
  prompt: |
    Show Suzaku detections that have no principal ARN, or whose identity is an
    AWS service, with the rule, event name, user type, source IP and event ID.
  sql: |
    SELECT
        "Timestamp",
        "Level",
        "RuleTitle",
        "EventName",
        "EventSource",
        "UserType",
        "UserName",
        "SrcIP",
        "AwsRegion",
        "ErrorCode",
        "EventID"
    FROM timeline
    WHERE "UserARN" IS NULL OR "UserType" = 'AWSService'
    ORDER BY "Level" DESC, "Timestamp" DESC
    LIMIT 200

# ===========================================================================
# Origin
# ===========================================================================

- category: "\U0001f30d Origin"
  label: "\U0001f310 Top Source IPs by Distinct Rules"
  description: "An IP triggering many different rules is behaving unlike a normal client."
  severity: "P3"
  chart:
    type: bar
    x: "SrcIP"
    y: "rules"
  prompt: |
    Rank source IPs by the number of distinct Suzaku rules they triggered, with
    their principals and activity window.
  sql: |
    SELECT
        "SrcIP",
        count(DISTINCT "RuleTitle")                              AS rules,
        count(*)                                                 AS detections,
        count(*) FILTER (WHERE "Level" >= 'high'::suzaku_level)   AS severe,
        count(DISTINCT "UserARN")                                AS principals,
        min("Timestamp")                                         AS first_seen,
        max("Timestamp")                                         AS last_seen
    FROM timeline
    WHERE "SrcIP" IS NOT NULL
    GROUP BY "SrcIP"
    ORDER BY rules DESC, severe DESC
    LIMIT 100

- category: "\U0001f30d Origin"
  label: "\U0001f6e0 Top User Agents"
  description: "Hacking-distro and SDK user agents. An unexpected client string is a strong lead."
  severity: "P4"
  techniques:
    - tid: "T1078"
      name: "Valid Accounts"
      summary: "Credential use from an unusual client is often the first sign of misuse."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1078.html"
  prompt: |
    Rank user agent strings by Suzaku detections, showing how many principals
    and IPs used each one.
  sql: |
    SELECT
        "UserAgent",
        count(*)                                                 AS detections,
        count(*) FILTER (WHERE "Level" >= 'high'::suzaku_level)   AS severe,
        count(DISTINCT "UserARN")                                AS principals,
        count(DISTINCT "SrcIP")                                  AS source_ips
    FROM timeline
    WHERE "UserAgent" IS NOT NULL
    GROUP BY "UserAgent"
    ORDER BY severe DESC, detections DESC
    LIMIT 100

- category: "\U0001f30d Origin"
  label: "\U0001f5fa Multi-Region Activity per Principal"
  description: "A principal touching many regions in one day often means enumeration or resource abuse."
  severity: "P3"
  techniques:
    - tid: "T1580"
      name: "Cloud Infrastructure Discovery"
      summary: "Adversaries enumerate resources across regions to map the environment."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1580.html"
  prompt: |
    For each principal and day, count how many distinct AWS regions appear in
    Suzaku detections, showing only days with more than one region.
  sql: |
    SELECT
        date_trunc('day', "Timestamp")             AS day,
        "UserARN",
        count(DISTINCT "AwsRegion")                AS regions,
        count(*)                                   AS detections,
        string_agg(DISTINCT "AwsRegion", ', ')     AS region_list
    FROM timeline
    WHERE "UserARN" IS NOT NULL
    GROUP BY day, "UserARN"
    HAVING count(DISTINCT "AwsRegion") > 1
    ORDER BY regions DESC, day DESC
    LIMIT 100

# ===========================================================================
# Failures
# ===========================================================================

- category: "⚠ Failures"
  label: "\U0001f6ab Failed API Calls in Detections"
  description: "Detections that also failed at the API, classified by family. Repeated denials are probing or brute force; a missing configuration is the API answering a question."
  severity: "P3"
  techniques:
    - tid: "T1580"
      name: "Cloud Infrastructure Discovery"
      summary: "Permission probing produces bursts of AccessDenied while an adversary maps their access."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1580.html"
  prompt: |
    Group Suzaku detections that carry an AWS error code by error, family and
    principal, to reveal permission probing.
  sql: |
    SELECT
        "ErrorCode",
        CASE
            WHEN "ErrorCode" ILIKE '%AccessDenied%'
              OR "ErrorCode" ILIKE '%Unauthorized%'
              OR "ErrorCode" ILIKE '%Forbidden%'          THEN 'authorization'
            WHEN "ErrorCode" ILIKE '%Throttl%'
              OR "ErrorCode" ILIKE '%RequestLimit%'       THEN 'throttling'
            WHEN "ErrorCode" ILIKE '%NoSuch%'
              OR "ErrorCode" ILIKE '%NotFound%'           THEN 'absent-resource'
            WHEN "ErrorCode" ILIKE '%Invalid%'
              OR "ErrorCode" ILIKE '%Validation%'
              OR "ErrorCode" ILIKE 'Client.%'             THEN 'client'
            ELSE 'other'
        END                              AS error_family,
        "UserARN",
        count(*)                         AS failures,
        count(DISTINCT "EventName")      AS distinct_actions,
        count(DISTINCT "SrcIP")          AS source_ips,
        arg_max("EventName", "Timestamp") AS last_action,
        min("Timestamp")                 AS first_seen,
        max("Timestamp")                 AS last_seen
    FROM timeline
    WHERE "ErrorCode" IS NOT NULL
    GROUP BY "ErrorCode", error_family, "UserARN"
    ORDER BY failures DESC
    LIMIT 100

# ===========================================================================
# ATT&CK
# ===========================================================================

- category: "\U0001f9ec ATT&CK"
  label: "\U0001f9ec Technique Coverage"
  description: "Which ATT&CK techniques the detections map to — the coverage view for a report."
  severity: "P4"
  chart:
    type: bar
    x: "technique"
    y: "detections"
  prompt: |
    Count Suzaku detections per ATT&CK technique ID, showing the severities
    involved.
  sql: |
    SELECT
        technique,
        count(*)                                                 AS detections,
        count(*) FILTER (WHERE "Level" >= 'high'::suzaku_level)   AS severe,
        count(DISTINCT "RuleTitle")                              AS rules,
        count(DISTINCT "UserARN")                                AS principals
    FROM timeline, unnest("TechniqueIDs") AS t(technique)
    GROUP BY technique
    ORDER BY severe DESC, detections DESC
    LIMIT 100

- category: "\U0001f9ec ATT&CK"
  label: "\U0001f3f4 Tactic Breakdown"
  description: "Which ATT&CK tactics the detections cover — where in the kill chain this dataset sits."
  severity: "P4"
  chart:
    type: bar
    x: "tactic"
    y: "detections"
  prompt: |
    Count Suzaku detections per ATT&CK tactic, with the distinct rules and
    principals behind each one.
  sql: |
    SELECT
        tactic,
        count(*)                                                 AS detections,
        count(*) FILTER (WHERE "Level" >= 'high'::suzaku_level)   AS severe,
        count(DISTINCT "RuleTitle")                              AS rules,
        count(DISTINCT "UserARN")                                AS principals
    FROM timeline, unnest("Tactics") AS t(tactic)
    GROUP BY tactic
    ORDER BY severe DESC, detections DESC
    LIMIT 100

- category: "\U0001f9ec ATT&CK"
  label: "\U0001f5c2 Rule × Technique Matrix"
  description: "Which rules cover which techniques. Reveals coverage gaps and overlaps."
  severity: "P4"
  prompt: |
    List each Suzaku rule with the ATT&CK techniques it maps to and how often it
    fired.
  sql: |
    SELECT
        "RuleTitle",
        "Level",
        string_agg(DISTINCT technique, ', ')  AS techniques,
        count(*)                              AS detections
    FROM timeline, unnest("TechniqueIDs") AS t(technique)
    GROUP BY "RuleTitle", "Level"
    ORDER BY detections DESC
    LIMIT 100

# ===========================================================================
# Response — routing detections to the AWS incident response playbooks
# ===========================================================================

- category: "\U0001f4d5 Response"
  label: "\U0001f4d5 Impact Detections → Ransomware Playbook"
  description: "Detections mapped to the Impact tactic, ordered by severity. Every row here is an input to the ransomware containment procedure, not something to keep investigating."
  severity: "P1"
  playbook:
    name: "IRP-Ransomware"
    url: "https://github.com/aws-samples/aws-incident-response-playbooks/blob/main/playbooks/IRP-Ransomware.md"
  next_steps: >-
    Establish what recovery points survive before continuing the investigation. If backup deletion
    appears alongside these detections, treat the account as an active ransomware incident.
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Show Suzaku detections whose Tactics include Impact, with rule title,
    principal, event name and source IP, ordered by severity then time.
  sql: |
    SELECT
        "Timestamp",
        "Level",
        "RuleTitle",
        "EventName",
        "UserARN",
        "SrcIP",
        "AwsRegion",
        "ErrorCode",
        "EventID"
    FROM timeline
    WHERE list_contains("Tactics", 'Impact')
    ORDER BY "Level" DESC, "Timestamp" DESC
    LIMIT 200

- category: "\U0001f4d5 Response"
  label: "\U0001f4d5 Credential Access → Credential Compromise Playbook"
  description: "Detections mapped to Credential Access or Initial Access. These identify which credentials to rotate, which is the first containment step of the credential-compromise procedure."
  severity: "P1"
  playbook:
    name: "IRP-CredCompromise"
    url: "https://github.com/aws-samples/aws-incident-response-playbooks/blob/main/playbooks/IRP-CredCompromise.md"
  next_steps: >-
    Rotate or disable every access key and session listed here before eradication. A credential
    left live keeps the actor's foothold regardless of what else you remediate.
  chart:
    type: bar
    x: "UserAccessKeyID"
    y: "detections"
  prompt: |
    Show Suzaku detections whose Tactics include CredAccess or InitAccess
    (Suzaku's abbreviations for Credential Access and Initial Access), grouped
    by access key and principal, with the rules that fired.
  sql: |
    SELECT
        "UserAccessKeyID",
        "UserARN",
        count(*)                                AS detections,
        count(DISTINCT "RuleTitle")             AS distinct_rules,
        string_agg(DISTINCT "RuleTitle", ', ')  AS rules,
        max("Level")                            AS max_level,
        min("Timestamp")                        AS first_seen,
        max("Timestamp")                        AS last_seen
    FROM timeline
    WHERE list_contains("Tactics", 'CredAccess')
       OR list_contains("Tactics", 'InitAccess')
    GROUP BY "UserAccessKeyID", "UserARN"
    ORDER BY detections DESC
    LIMIT 100

- category: "\U0001f4d5 Response"
  label: "\U0001f4d5 Tactic Coverage by Playbook"
  description: "Every ATT&CK tactic present in the run, with detection and principal counts, so the responder can see at a glance which playbooks this dataset actually calls for."
  severity: "P3"
  chart:
    type: bar
    x: "tactic"
    y: "detections"
  prompt: |
    Break Suzaku detections down by ATT&CK tactic with counts of detections,
    distinct rules and distinct principals, so each tactic can be routed to the
    playbook that owns its response.
  sql: |
    SELECT
        tactic,
        count(*)                                                  AS detections,
        count(*) FILTER (WHERE "Level" >= 'high'::suzaku_level)   AS severe,
        count(DISTINCT "RuleTitle")                               AS distinct_rules,
        count(DISTINCT "UserARN")                                 AS distinct_principals,
        min("Timestamp")                                          AS first_seen,
        max("Timestamp")                                          AS last_seen
    FROM timeline, unnest("Tactics") AS t(tactic)
    GROUP BY tactic
    ORDER BY severe DESC, detections DESC
    LIMIT 100
