- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f310 CloudFront Distribution Tampering"
  description: "Detects CloudFront distribution creation and origin changes. Modifying origins redirects CDN traffic to attacker-controlled servers for MitM interception or data collection."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all CloudFront distribution modification events: CreateDistribution,
    UpdateDistribution (especially origin domain changes — redirects all CDN
    traffic to attacker server), DeleteDistribution, CreateCachePolicy,
    CreateOriginAccessControl / UpdateOriginAccessControl (loosening S3 origin
    access), AssociateAlias (hijacking a domain alias).
    An attacker who modifies a CloudFront origin to point to their own server
    intercepts all end-user traffic passing through the distribution in real time.
    Show distribution ID, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.id')               AS distribution_id,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'cloudfront.amazonaws.com'
      AND event_name IN (
          'CreateDistribution',       'UpdateDistribution',
          'DeleteDistribution',
          'CreateCachePolicy',        'UpdateCachePolicy',
          'CreateOriginAccessControl','UpdateOriginAccessControl',
          'AssociateAlias'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f6e1 Network Firewall / Shield Tampering"
  description: "Detects Network Firewall and Shield protection removal. Deleting network-layer defenses exposes VPCs to direct attack traffic."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AWS Network Firewall and Shield tampering events:
    DeleteFirewall, DeleteFirewallPolicy, DeleteRuleGroup (removing packet
    inspection rules), DisassociateSubnets (detaching firewall from protected
    subnets), UpdateFirewallPolicy / UpdateRuleGroup (weakening inspection rules),
    Shield DeleteProtection (removing DDoS protection from a resource),
    DisableProactiveEngagement (removing 24/7 Shield Response Team engagement),
    DeleteSubscription (cancelling Shield Advanced).
    Unlike WAF (covered separately), Network Firewall operates at the VPC
    level and its removal exposes entire subnet ranges to attack traffic.
    Show resource name, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.firewallName')          AS firewall_name,
        json_extract_string(request_parameters, '$.firewallPolicyArn')     AS firewall_policy_arn,
        json_extract_string(request_parameters, '$.ruleGroupArn')          AS rule_group_arn,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE (
        event_source = 'network-firewall.amazonaws.com'
        AND event_name IN (
            'DeleteFirewall',       'DeleteFirewallPolicy',
            'DeleteRuleGroup',      'DisassociateSubnets',
            'UpdateFirewallPolicy', 'UpdateRuleGroup'
        )
      ) OR (
        event_source = 'shield.amazonaws.com'
        AND event_name IN (
            'DeleteProtection',          'DisableProactiveEngagement',
            'DeleteSubscription',        'DisassociateDRTLogBucket',
            'DisassociateDRTRole'
        )
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f3f7 ACM Certificate Operations"
  description: "Detects ACM certificate requests and deletions. Attackers use compromised accounts to issue TLS certificates for attacker-controlled domains to build phishing infrastructure."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all ACM certificate lifecycle events: RequestCertificate (especially
    for domains not owned by the organization — phishing or impersonation
    infrastructure), DeleteCertificate (removing evidence or disrupting HTTPS
    services), ImportCertificate (importing attacker-controlled certificates),
    ExportCertificate (exfiltrating private key material).
    A compromised AWS account can issue TLS certificates for arbitrary domain
    names using DNS validation, creating legitimate-looking phishing sites
    backed by certificates from trusted CAs.
    Show domain name, SAN names, validation method, cert ARN, caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.domainName')              AS domain_name,
        json_extract_string(request_parameters, '$.subjectAlternativeNames') AS san_names,
        json_extract_string(request_parameters, '$.certificateArn')          AS cert_arn,
        json_extract_string(request_parameters, '$.validationMethod')        AS validation_method,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'acm.amazonaws.com'
      AND event_name IN (
          'RequestCertificate',
          'DeleteCertificate',
          'ImportCertificate',
          'ExportCertificate'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f9f1 VPN / Direct Connect / Transit Gateway"
  description: "Detects new VPN connections, Direct Connect, and Transit Gateway attachments. Attackers create covert network tunnels for persistent C2 or data exfiltration channels."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all VPN, Direct Connect, and Transit Gateway management events:
    CreateVpnConnection / CreateVpnGateway / CreateCustomerGateway (new
    encrypted tunnel to attacker-controlled network),
    CreateTransitGateway / CreateTransitGatewayAttachment /
    AcceptTransitGatewayVpcAttachment (connecting rogue VPC to organization
    network), DeleteVpnConnection / DeleteTransitGateway (removing evidence).
    These services create persistent Layer-3 network paths that survive
    instance termination and IAM key rotation, providing a durable
    exfiltration channel or C2 communication path.
    Show resource IDs, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.transitGatewayId')         AS tgw_id,
        json_extract_string(request_parameters, '$.vpnConnectionId')           AS vpn_id,
        json_extract_string(request_parameters, '$.connectionId')              AS dx_connection_id,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'ec2.amazonaws.com'
      AND event_name IN (
          'CreateTransitGateway',             'DeleteTransitGateway',
          'CreateTransitGatewayAttachment',   'DeleteTransitGatewayAttachment',
          'AcceptTransitGatewayVpcAttachment',
          'CreateVpnConnection',              'DeleteVpnConnection',
          'CreateVpnGateway',                 'DeleteVpnGateway',
          'CreateCustomerGateway',            'DeleteCustomerGateway'
      )
    ORDER BY event_time DESC
    LIMIT 100

# ===========================================================================
# Compute & Serverless — DFIR追加 (NEW-10, NEW-15)
# ===========================================================================

- category: "\u26a1 Compute & Serverless"
  label: "\U0001f4a5 EC2 Mass Stop / Terminate"
  description: "Detects high-volume EC2 StopInstances/TerminateInstances (>=5 in one hour). Indicates ransomware disruption or destructive attack."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find identities performing 5 or more EC2 StopInstances or TerminateInstances
    calls within a single hour. This pattern indicates a destructive attack:
    ransomware operators stop instances to safely encrypt attached EBS volumes,
    while wipers terminate instances to destroy running workloads.
    Show caller, region, hour bucket, total operation count, and breakdown
    between stop and terminate actions.
  sql: |
    SELECT
        user_identity_arn,
        source_ip_address,
        aws_region,
        DATE_TRUNC('hour', event_time)                                              AS hour_bucket,
        COUNT(*)                                                                     AS instance_ops_count,
        COUNT(*) FILTER (WHERE event_name = 'TerminateInstances')                   AS terminate_count,
        COUNT(*) FILTER (WHERE event_name = 'StopInstances')                        AS stop_count
    FROM cloudtrail_events
    WHERE event_source = 'ec2.amazonaws.com'
      AND event_name IN ('TerminateInstances', 'StopInstances')
    GROUP BY user_identity_arn, source_ip_address, aws_region, hour_bucket
    HAVING COUNT(*) >= 5
    ORDER BY instance_ops_count DESC
    LIMIT 50

- category: "\u26a1 Compute & Serverless"
  label: "\U0001f4b0 EC2 Spot Fleet / Reserved Instance Abuse"
  description: "Detects large Spot Fleet requests, Reserved Instance purchases, and Auto Scaling group creation with high capacity. Cryptomining financial-impact indicator."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find EC2 resource reservation and auto-scaling events that indicate
    resource hijacking for cryptomining: RequestSpotFleet (bulk cheap GPU/CPU
    capacity), PurchaseReservedInstancesOffering (committing org funds to
    long-term compute), RequestSpotInstances, CreateAutoScalingGroup with
    maxSize > 20 (auto-scaling cryptomining fleet), PutScalingPolicy /
    ExecutePolicy (triggering mass scale-out).
    Show target capacity, instance count, ASG max size, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.spotFleetRequestConfig.targetCapacity') AS spot_target_capacity,
        json_extract_string(request_parameters, '$.instanceCount')                          AS instance_count,
        json_extract_string(request_parameters, '$.autoScalingGroupName')                   AS asg_name,
        json_extract_string(request_parameters, '$.maxSize')                                AS asg_max_size,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'ec2.amazonaws.com'
      AND event_name IN (
          'RequestSpotFleet',                'CancelSpotFleetRequests',
          'RequestSpotInstances',
          'PurchaseReservedInstancesOffering',
          'ModifyReservedInstances',
          'CreateAutoScalingGroup',          'UpdateAutoScalingGroup',
          'PutScalingPolicy',                'ExecutePolicy'
      )
    ORDER BY event_time DESC
    LIMIT 100

