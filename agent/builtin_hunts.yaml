# Built-in Threat Hunting Queries — v2
#
# Schema:
#   category:    Sidebar grouping label
#   label:       Display name shown in the UI
#   description: One-line explanation of what this query detects and why it matters
#   prompt:      Natural language prompt sent to the AI agent (requires API key)
#   sql:         (optional) Pre-built DuckDB SQL for direct execution (no API key needed)
#
# SQL convention:
#   - Table: cloudtrail_events
#   - JSON extraction: json_extract_string(column, '$.field')
#   - All column names are snake_case (e.g. event_name, user_identity_arn)

# ===========================================================================
# Detection & Response
# ===========================================================================

- category: "\U0001f6e1 Detection & Response"
  label: "\U0001f6d1 CloudTrail Tampering"
  description: "Detects any attempt to stop or modify CloudTrail. The most critical alert — indicates cover-up."
  techniques:
    - tid: "T1562.008"
      name: "Impair Defenses: Disable Cloud Logs"
      summary: "Adversaries disable or reroute cloud logging to erase evidence of their activity."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.008.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Check for any attempts to disable or modify CloudTrail:
    StopLogging, DeleteTrail, UpdateTrail, PutEventSelectors.
    Also check for CloudWatch Logs deletion or GuardDuty DisableDetector.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.name')     AS trail_name,
        json_extract_string(request_parameters, '$.trailARN') AS trail_arn,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'CreateTrail', 'UpdateTrail', 'DeleteTrail',
        'StartLogging', 'StopLogging', 'PutEventSelectors',
        'DeleteLogGroup', 'DisableDetector'
    )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f6e1 Detection & Response"
  label: "\U0001f6e1\ufe0f GuardDuty Detector Tampering"
  description: "Detects GuardDuty disable, delete, and threat-intel manipulation. Any GuardDuty change mid-investigation is a critical indicator."
  techniques:
    - tid: "T1562.A001"
      name: "Impair Defenses: Disable or Modify GuardDuty"
      summary: "Adversaries disable or reconfigure GuardDuty so their activity stops generating findings."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.A001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find any GuardDuty tampering events: DisableDetector, DeleteDetector,
    UpdateDetector (suspicious state changes), DeletePublishingDestination,
    CreateIPSet / CreateThreatIntelSet (attacker whitelisting their own IPs),
    and DeleteIPSet / DeleteThreatIntelSet. GuardDuty changes during an
    incident are a strong defense evasion indicator. Show detector ID,
    caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.detectorId')    AS detector_id,
        json_extract_string(request_parameters, '$.destinationId') AS destination_id,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'guardduty.amazonaws.com'
      AND event_name IN (
          'DisableDetector',          'DeleteDetector',
          'DeletePublishingDestination',
          'CreateIPSet',              'DeleteIPSet',
          'CreateThreatIntelSet',     'DeleteThreatIntelSet',
          'ArchiveFindings',          'UpdateFilter'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f6e1 Detection & Response"
  label: "\u26d4 Security Hub Tampering"
  description: "Detects Security Hub disable, standard disable, and finding suppression. Silencing Security Hub removes the central aggregation point for all security findings."
  techniques:
    - tid: "T1562"
      name: "Impair Defenses"
      summary: "Adversaries disable or tamper with security services to avoid detection."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all Security Hub tampering events: DisableSecurityHub (complete
    shutdown), BatchDisableStandards (disabling CIS/FSBP benchmarks),
    DisableImportFindingsForProduct (severing 3rd-party integrations),
    BatchUpdateFindings (mass finding suppression), UpdateStandardsControl
    (disabling individual controls), DeleteInsight.
    Disabling Security Hub removes the single-pane view of all security findings
    across AWS services, masking active attacks. Show caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        source_ip_address,
        request_parameters,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'securityhub.amazonaws.com'
      AND event_name IN (
          'DisableSecurityHub',
          'BatchDisableStandards',
          'DisableImportFindingsForProduct',
          'BatchUpdateFindings',
          'UpdateStandardsControl',
          'DeleteInsight'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f6e1 Detection & Response"
  label: "\u2699\ufe0f AWS Config Tampering"
  description: "Detects AWS Config recorder/rule deletion. Stopping Config eliminates compliance evidence and change-tracking for an entire region."
  techniques:
    - tid: "T1562.008"
      name: "Impair Defenses: Disable Cloud Logs"
      summary: "Adversaries disable or reroute cloud logging to erase evidence of their activity."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.008.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AWS Config tampering events: StopConfigurationRecorder,
    DeleteConfigurationRecorder, DeleteDeliveryChannel, DeleteConfigRule,
    and PutConfigRule (for suspicious rule changes). Stopping the Config
    recorder eliminates compliance evidence and change-tracking for the
    entire region. Show recorder/rule name, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.configRuleName')              AS config_rule_name,
        json_extract_string(request_parameters, '$.configurationRecorderName')   AS recorder_name,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'config.amazonaws.com'
      AND event_name IN (
          'StopConfigurationRecorder',  'DeleteConfigurationRecorder',
          'DeleteDeliveryChannel',      'DeleteConfigRule',
          'PutConfigRule'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f6e1 Detection & Response"
  label: "\U0001f6e1 Organizations Service Control Policy (SCP) Changes"
  description: "Detects SCP creation, modification, and deletion. Removing a Deny SCP immediately eliminates guardrails across every account in the affected OU."
  techniques:
    - tid: "T1562"
      name: "Impair Defenses"
      summary: "Adversaries disable or tamper with security services to avoid detection."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.html"
    - tid: "T1666.A002"
      name: "Modify Cloud Resource Hierarchy: Leave AWS Organization"
      summary: "Adversaries detach accounts from the organization to escape guardrails."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1666.A002.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all Organizations Service Control Policy (SCP) management events:
    CreatePolicy / UpdatePolicy / DeletePolicy (modifying or removing SCPs —
    a DeletePolicy on an active SCP immediately removes that guardrail from
    every account in the affected OU), AttachPolicy / DetachPolicy (changing
    which OUs or accounts the SCP applies to), EnablePolicyType (enabling SCPs
    for the first time — or re-enabling after Disable), DisablePolicyType
    (disabling all SCPs for an entire root, removing all guardrails at once).
    Any SCP modification outside a Change Management window is critical.
    Show policy ID, policy type, target ID, caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.policyId')     AS policy_id,
        json_extract_string(request_parameters, '$.targetId')     AS target_id,
        json_extract_string(request_parameters, '$.type')         AS policy_type,
        json_extract_string(request_parameters, '$.name')         AS policy_name,
        json_extract_string(request_parameters, '$.content')      AS policy_content,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'organizations.amazonaws.com'
      AND event_name IN (
          'CreatePolicy',        'UpdatePolicy',        'DeletePolicy',
          'AttachPolicy',        'DetachPolicy',
          'EnablePolicyType',    'DisablePolicyType'
      )
      AND (
          json_extract_string(request_parameters, '$.type') = 'SERVICE_CONTROL_POLICY'
          OR json_extract_string(request_parameters, '$.type') IS NULL
          OR request_parameters LIKE '%SERVICE_CONTROL_POLICY%'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f6e1 Detection & Response"
  label: "\U0001f6ab AWS Macie Tampering"
  description: "Detects Macie disable and finding-filter creation. Attackers suppress Macie findings before exfiltrating sensitive data from S3."
  techniques:
    - tid: "T1562"
      name: "Impair Defenses"
      summary: "Adversaries disable or tamper with security services to avoid detection."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AWS Macie tampering events: DisableMacie (complete shutdown),
    CreateFindingsFilter / UpdateFindingsFilter (suppressing sensitive-data
    findings before exfiltration), DisableOrganizationAdminAccount,
    UpdateMacieSession (reducing scan scope), CreateClassificationJob
    (attacker-initiated data discovery on victim buckets).
    Macie is the primary sensitive-data detection layer; disabling it or
    creating suppression filters is a pre-exfiltration defense-evasion step.
    Show event name, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.id')               AS job_or_filter_id,
        json_extract_string(request_parameters, '$.name')             AS resource_name,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'macie2.amazonaws.com'
      AND event_name IN (
          'DisableMacie',
          'CreateFindingsFilter',         'UpdateFindingsFilter',
          'DeleteFindingsFilter',
          'DisableOrganizationAdminAccount',
          'UpdateMacieSession',
          'CreateClassificationJob',
          'UpdateClassificationJob'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f6e1 Detection & Response"
  label: "\U0001f6a8 CloudWatch Alarm Deletion / Disable"
  description: "Detects CloudWatch alarm deletion and disabling. Silencing alarms tied to GuardDuty, CloudTrail metric filters, or billing thresholds is a key defense-evasion indicator."
  techniques:
    - tid: "T1562"
      name: "Impair Defenses"
      summary: "Adversaries disable or tamper with security services to avoid detection."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all CloudWatch Alarm modification events: DeleteAlarms (removing
    security alerting), DisableAlarmActions (silencing alarm notifications
    without deleting the alarm — leaves no obvious trace), PutMetricAlarm
    (raising thresholds to suppress alerts), and DeleteDashboard (removing
    operational visibility). Security alarms tied to GuardDuty, CloudTrail
    metric filters, or billing are high-value targets for attackers.
    Show alarm names, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.alarmName')    AS alarm_name,
        json_extract_string(request_parameters, '$.alarmNames')   AS alarm_names,
        json_extract_string(request_parameters, '$.threshold')    AS threshold,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'monitoring.amazonaws.com'
      AND event_name IN (
          'DeleteAlarms',
          'DisableAlarmActions',
          'PutMetricAlarm',
          'DeleteDashboard'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f6e1 Detection & Response"
  label: "\U0001f4dc CloudWatch Logs Subscription Changes"
  description: "Detects CW Logs subscription filter creation/deletion and log group deletion. Attackers stream logs to an external destination or destroy evidence in place."
  techniques:
    - tid: "T1562.008"
      name: "Impair Defenses: Disable Cloud Logs"
      summary: "Adversaries disable or reroute cloud logging to erase evidence of their activity."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.008.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all CloudWatch Logs tampering events: PutSubscriptionFilter (log
    exfiltration to attacker-controlled Kinesis/Lambda), DeleteSubscriptionFilter,
    DeleteLogGroup, DeleteLogStream, and DeleteRetentionPolicy.
    PutSubscriptionFilter to an external account silently streams all log events
    to the attacker in real time. Show log group name, destination ARN,
    caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.logGroupName')    AS log_group_name,
        json_extract_string(request_parameters, '$.filterName')      AS filter_name,
        json_extract_string(request_parameters, '$.destinationArn')  AS destination_arn,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'logs.amazonaws.com'
      AND event_name IN (
          'PutSubscriptionFilter', 'DeleteSubscriptionFilter',
          'DeleteLogGroup',        'DeleteLogStream',
          'DeleteRetentionPolicy', 'DisassociateKmsKey'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f6e1 Detection & Response"
  label: "\U0001f3f9 WAF WebACL Changes"
  description: "Detects WAF WebACL creation, update, and deletion. Removing or weakening a WebACL disables protection against SQLi, XSS, and DDoS attacks."
  techniques:
    - tid: "T1562.007"
      name: "Impair Defenses: Disable or Modify Cloud Firewall"
      summary: "Adversaries open or remove cloud firewall rules to enable their own access."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.007.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all WAF WebACL modification events across WAFv2, WAF Classic, and
    WAF Regional: CreateWebACL, UpdateWebACL, DeleteWebACL (disabling web
    protection), AssociateWebACL, DisassociateWebACL.
    Deleting a WebACL instantly removes all managed and custom rules protecting
    an API Gateway, ALB, or CloudFront distribution.
    Show WebACL name, scope (REGIONAL/CLOUDFRONT), caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_arn,
        json_extract_string(request_parameters, '$.name')  AS waf_name,
        json_extract_string(request_parameters, '$.id')    AS waf_id,
        json_extract_string(request_parameters, '$.scope') AS scope,
        aws_region,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source IN (
        'wafv2.amazonaws.com', 'waf.amazonaws.com', 'waf-regional.amazonaws.com'
    )
      AND event_name IN (
          'CreateWebACL', 'UpdateWebACL', 'DeleteWebACL',
          'AssociateWebACL', 'DisassociateWebACL'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f6e1 Detection & Response"
  label: "\U0001f50d GuardDuty Findings Read"
  description: "Detects read-only GuardDuty API calls. Pacu's guardduty__list_findings module reads active findings to understand what the defender has already detected, allowing the attacker to adapt their tactics and avoid triggering new alerts."
  techniques:
    - tid: "T1562.A001"
      name: "Impair Defenses: Disable or Modify GuardDuty"
      summary: "Adversaries disable or reconfigure GuardDuty so their activity stops generating findings."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.A001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all GuardDuty read-only API calls that an attacker would use to
    understand the defender's detection posture:
    ListFindings / GetFindings (Pacu's guardduty__list_findings enumerates
    all active findings to see what the SOC has already detected — attackers
    use this to confirm whether their activity has been flagged),
    GetDetector / ListDetectors (checking which regions have GuardDuty enabled
    and what findings types are configured),
    ListIPSets / ListThreatIntelSets (reading the allowlist to understand
    which IPs are already trusted — enabling IP spoofing evasion),
    GetIPSet / GetThreatIntelSet (reading the actual allowlisted IPs).
    Any unexpected caller reading GuardDuty findings warrants investigation.
    Show caller, detector ID, finding IDs, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.detectorId')  AS detector_id,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'guardduty.amazonaws.com'
      AND event_name IN (
          'ListFindings',         'GetFindings',
          'GetDetector',          'ListDetectors',
          'ListIPSets',           'GetIPSet',
          'ListThreatIntelSets',  'GetThreatIntelSet',
          'GetMasterAccount',     'ListMembers'
      )
    ORDER BY event_time DESC
    LIMIT 200

- category: "\U0001f6e1 Detection & Response"
  label: "\U0001f4b0 Budget / Cost Anomaly Changes"
  description: "Detects deletion or modification of AWS Budgets and Cost Anomaly monitors. Attackers remove budget alerts to hide cryptomining or resource-intensive operations."
  techniques:
    - tid: "T1562"
      name: "Impair Defenses"
      summary: "Adversaries disable or tamper with security services to avoid detection."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.html"
    - tid: "T1496.001"
      name: "Resource Hijacking: Compute Hijacking"
      summary: "Adversaries run cryptomining or other workloads at the victim's expense."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all Budget and Cost Anomaly management events: DeleteBudget (hiding
    cryptomining costs), CreateBudget, UpdateBudget, CreateNotification,
    DeleteNotification, CreateBudgetAction, DeleteBudgetAction,
    DeleteAnomalyMonitor, CreateAnomalyMonitor, UpdateAnomalyMonitor,
    DeleteAnomalySubscription.
    Cryptominers routinely delete budget alerts to extend their operation window
    before the account owner notices unexpected charges. Show budget name,
    caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_arn,
        json_extract_string(request_parameters, '$.budgetName') AS budget_name,
        json_extract_string(request_parameters, '$.monitorArn') AS monitor_arn,
        aws_region,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source IN ('budgets.amazonaws.com', 'ce.amazonaws.com')
      AND event_name IN (
          'CreateBudget',              'DeleteBudget',              'UpdateBudget',
          'CreateNotification',        'DeleteNotification',
          'CreateBudgetAction',        'DeleteBudgetAction',
          'CreateAnomalyMonitor',      'DeleteAnomalyMonitor',      'UpdateAnomalyMonitor',
          'CreateAnomalySubscription', 'DeleteAnomalySubscription'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f6e1 Detection & Response"
  label: "\U0001f6ab Access Denied Errors"
  description: "Groups AccessDenied errors by identity and API. Top offenders may indicate credential misuse."
  techniques:
    - tid: "T1087.004"
      name: "Account Discovery: Cloud Account"
      summary: "Adversaries enumerate IAM users, roles, and policies to map the account."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1087.004.html"
    - tid: "T1078.A001"
      name: "Valid Accounts: IAM Users"
      summary: "Adversaries authenticate with compromised long-lived IAM user credentials."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1078.A001.html"
  chart:
    type: bar
    x: event_name
    y:
      - denied_count
  prompt: |
    Show all AccessDenied and UnauthorizedAccess errors in the logs.
    Group by user identity and event_name to find the top offenders.
    This can indicate credential misuse or privilege escalation attempts.
  sql: |
    SELECT
        user_identity_arn,
        event_name,
        event_source,
        COUNT(*)        AS denied_count,
        MIN(event_time) AS first_seen,
        MAX(event_time) AS last_seen
    FROM cloudtrail_events
    WHERE error_code IN ('AccessDenied', 'AccessDeniedException', 'UnauthorizedAccess')
    GROUP BY user_identity_arn, event_name, event_source
    ORDER BY denied_count DESC
    LIMIT 50

# ===========================================================================
# Identity & Access
# ===========================================================================

- category: "\U0001f511 Identity & Access"
  label: "\U0001f511 Root Account Activity"
  description: "Detects any API call made by the root account. Root should never be used in production."
  techniques:
    - tid: "T1078.A002"
      name: "Valid Accounts: Account Root User"
      summary: "Adversaries use compromised root credentials for unrestricted account access."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1078.A002.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    List all API calls made by the root account. Include event_time, event_name,
    source_ip_address, and aws_region. Order by most recent first.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE user_identity_type = 'Root'
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f513 Console Login without MFA"
  description: "Detects console logins where MFA was not used. High-risk indicator of account compromise."
  techniques:
    - tid: "T1078.A001"
      name: "Valid Accounts: IAM Users"
      summary: "Adversaries authenticate with compromised long-lived IAM user credentials."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1078.A001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all ConsoleLogin events where MFA was not used. Include user identity,
    source IP, region, and the MFAUsed flag from additionalEventData.
    MFA-less logins are a high-priority alert.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        source_ip_address,
        aws_region,
        json_extract_string(additional_event_data, '$.MFAUsed') AS mfa_used,
        json_extract_string(additional_event_data, '$.LoginTo')  AS login_to
    FROM cloudtrail_events
    WHERE event_source = 'signin.amazonaws.com'
      AND event_name   = 'ConsoleLogin'
      AND json_extract_string(additional_event_data, '$.MFAUsed') = 'No'
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f310 Console Logins"
  description: "Lists all console login attempts. Brute force = multiple failures followed by success."
  techniques:
    - tid: "T1078.A001"
      name: "Valid Accounts: IAM Users"
      summary: "Adversaries authenticate with compromised long-lived IAM user credentials."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1078.A001.html"
    - tid: "T1538"
      name: "Cloud Service Dashboard"
      summary: "Adversaries use the management console to explore the environment."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1538.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    List all ConsoleLogin events including successes and failures. Also
    include the newer OAuth2-based sign-in flow (CreateOAuth2Token /
    AuthorizeOAuth2Access), which some accounts emit instead of ConsoleLogin.
    Identify accounts with multiple failed attempts followed by a success
    (possible brute force). Include source IP and user agent.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        source_ip_address,
        aws_region,
        user_agent,
        CASE
            WHEN json_extract_string(response_elements, '$.ConsoleLogin') IS NOT NULL
                THEN json_extract_string(response_elements, '$.ConsoleLogin')
            WHEN json_extract_string(additional_event_data, '$.success') IS NOT NULL
                THEN json_extract_string(additional_event_data, '$.success')
            ELSE NULL
        END AS login_result,
        error_code,
        error_message
    FROM cloudtrail_events
    WHERE event_source = 'signin.amazonaws.com'
      AND event_name IN ('ConsoleLogin', 'CreateOAuth2Token', 'AuthorizeOAuth2Access')
    ORDER BY event_time DESC
    LIMIT 200

- category: "\U0001f511 Identity & Access"
  label: "\U0001f510 MFA & Password Changes"
  description: "Detects MFA deactivation and password resets. Strong indicator of account takeover."
  techniques:
    - tid: "T1098"
      name: "Account Manipulation"
      summary: "Adversaries modify credentials or permissions to maintain or elevate access."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.html"
    - tid: "T1531"
      name: "Account Access Removal"
      summary: "Adversaries delete or lock legitimate credentials to deny defenders access."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1531.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Detect changes to authentication settings: CreateVirtualMFADevice,
    DeactivateMFADevice, DeleteVirtualMFADevice, EnableMFADevice,
    ChangePassword, UpdateLoginProfile, DeleteLoginProfile.
    MFA deactivation or password resets may indicate account takeover.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.userName') AS target_user,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'CreateVirtualMFADevice', 'DeactivateMFADevice', 'DeleteVirtualMFADevice',
        'EnableMFADevice', 'ChangePassword', 'UpdateLoginProfile', 'DeleteLoginProfile'
    )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f504 Privilege Escalation (IAM)"
  description: "Detects IAM policy attachment and role manipulation events used for privilege escalation."
  techniques:
    - tid: "T1098.003"
      name: "Account Manipulation: Additional Cloud Roles"
      summary: "Adversaries attach roles or policies to grant themselves elevated permissions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.003.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Detect potential IAM privilege escalation: look for PutUserPolicy,
    AttachUserPolicy, PutRolePolicy, AttachRolePolicy, CreatePolicyVersion,
    and SetDefaultPolicyVersion events. Show caller, target resource, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.userName')  AS target_user,
        json_extract_string(request_parameters, '$.roleName')  AS target_role,
        json_extract_string(request_parameters, '$.policyArn') AS policy_arn,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'PutUserPolicy',        'AttachUserPolicy',
        'PutRolePolicy',        'AttachRolePolicy',
        'CreatePolicyVersion',  'SetDefaultPolicyVersion',
        'AttachGroupPolicy',    'PutGroupPolicy',
        'CreateGroup'
    )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f504 IAM Role Trust Policy Changes"
  description: "Detects UpdateAssumeRolePolicy calls. Adding external account principals to a trust policy creates a persistent backdoor."
  techniques:
    - tid: "T1484.002"
      name: "Domain or Tenant Policy Modification: Trust Modification"
      summary: "Adversaries modify trust relationships (SAML/OIDC/role trust) to gain persistent access."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1484.002.html"
    - tid: "T1098.003"
      name: "Account Manipulation: Additional Cloud Roles"
      summary: "Adversaries attach roles or policies to grant themselves elevated permissions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.003.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all UpdateAssumeRolePolicy events. Attackers add their own account
    as a trusted principal in an existing role's trust policy, creating a
    persistent backdoor that survives password resets and key rotation.
    Show the role name, the new policy document, caller, source IP, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.roleName')        AS role_name,
        json_extract_string(request_parameters, '$.policyDocument')  AS policy_document,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name = 'UpdateAssumeRolePolicy'
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f6a7 IAM Permission Boundary Changes"
  description: "Detects permission boundary put/delete events. Removing a permission boundary immediately expands a principal's effective permissions, enabling privilege escalation."
  techniques:
    - tid: "T1098.003"
      name: "Account Manipulation: Additional Cloud Roles"
      summary: "Adversaries attach roles or policies to grant themselves elevated permissions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.003.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all IAM permission boundary changes: PutUserPermissionsBoundary,
    DeleteUserPermissionsBoundary, PutRolePermissionsBoundary, and
    DeleteRolePermissionsBoundary. Permission boundaries cap the maximum
    permissions of an IAM entity. Removing one immediately escalates the
    effective permissions to whatever the attached policies allow.
    Show target user/role, new boundary ARN, caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.userName')            AS target_user,
        json_extract_string(request_parameters, '$.roleName')            AS target_role,
        json_extract_string(request_parameters, '$.permissionsBoundary') AS permissions_boundary,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'iam.amazonaws.com'
      AND event_name IN (
          'PutUserPermissionsBoundary',    'DeleteUserPermissionsBoundary',
          'PutRolePermissionsBoundary',    'DeleteRolePermissionsBoundary'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f451 User Added to Admin Group"
  description: "Detects users added to groups with 'admin' in the name. Classic privilege escalation technique."
  techniques:
    - tid: "T1098.003"
      name: "Account Manipulation: Additional Cloud Roles"
      summary: "Adversaries attach roles or policies to grant themselves elevated permissions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.003.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AddUserToGroup events where the group name contains 'admin'.
    Show who performed the action, the target user, group name, and time.
    This is a classic privilege escalation indicator.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        json_extract_string(request_parameters, '$.userName')  AS target_user,
        json_extract_string(request_parameters, '$.groupName') AS group_name,
        source_ip_address,
        aws_region
    FROM cloudtrail_events
    WHERE event_name = 'AddUserToGroup'
      AND lower(json_extract_string(request_parameters, '$.groupName')) LIKE '%admin%'
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f465 IAM Group Membership Changes"
  description: "Detects all AddUserToGroup and RemoveUserFromGroup events regardless of group name. Any group addition may indicate privilege escalation through group-inherited policies."
  techniques:
    - tid: "T1098.003"
      name: "Account Manipulation: Additional Cloud Roles"
      summary: "Adversaries attach roles or policies to grant themselves elevated permissions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.003.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AddUserToGroup and RemoveUserFromGroup events.
    Any group addition can be a privilege escalation step if the target group
    carries high-privilege policies — not just groups with 'admin' in the name.
    Show caller, target user, group name, source IP, and time.
    Flag groups whose names suggest elevated access (admin, power, root, owner,
    super, billing, security, infra, devops, sre).
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.userName')  AS target_user,
        json_extract_string(request_parameters, '$.groupName') AS group_name,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN ('AddUserToGroup', 'RemoveUserFromGroup', 'CreateGroup', 'DeleteGroup')
    ORDER BY event_time DESC
    LIMIT 200

- category: "\U0001f511 Identity & Access"
  label: "\U0001f464 New IAM Users / Keys"
  description: "Identifies IAM user and access key creation events. Unexpected creation may indicate persistence."
  techniques:
    - tid: "T1136.003"
      name: "Create Account: Cloud Account"
      summary: "Adversaries create new IAM users or accounts as a persistent foothold."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1136.003.html"
    - tid: "T1098.001"
      name: "Account Manipulation: Additional Cloud Credentials"
      summary: "Adversaries add access keys, passwords, or SSH keys to existing identities as a backdoor."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Identify all IAM CreateUser, CreateAccessKey, and CreateLoginProfile events.
    Show who created them, when, and from which IP. Flag anything created outside
    business hours or from unexpected IPs.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.userName') AS new_user,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN ('CreateUser', 'CreateAccessKey', 'CreateLoginProfile')
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f3af IAM PassRole Abuse"
  description: "Detects iam:PassRole calls. Passing a privileged role to EC2/Lambda/Glue/ECS/SageMaker is the most common lateral privilege escalation path."
  techniques:
    - tid: "T1098.003"
      name: "Account Manipulation: Additional Cloud Roles"
      summary: "Adversaries attach roles or policies to grant themselves elevated permissions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.003.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all iam:PassRole events. Attackers with iam:PassRole permission assign
    a highly privileged role to a compute service (EC2, Lambda, Glue, ECS,
    SageMaker) they control, gaining all permissions of that role without
    directly possessing those permissions themselves.
    Show caller, role name/ARN, target service context, source IP, and time.
  sql: |
    -- iam:PassRole is not recorded as a standalone CloudTrail event.
    -- Detect via request_parameters of the receiving service (RunInstances, CreateFunction, etc.).
    SELECT
        event_time,
        event_source,
        event_name,
        user_identity_arn,
        COALESCE(
            json_extract_string(request_parameters, '$.iamInstanceProfile.arn'),
            json_extract_string(request_parameters, '$.role'),
            json_extract_string(request_parameters, '$.roleArn')
        )                  AS passed_role_arn,
        json_extract_string(request_parameters, '$.functionName')    AS lambda_function,
        json_extract_string(request_parameters, '$.instanceId')      AS ec2_instance,
        json_extract_string(request_parameters, '$.notebookInstanceName') AS notebook_name,
        json_extract_string(request_parameters, '$.endpointName')    AS glue_endpoint,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'RunInstances',
        'CreateFunction20150331',                'CreateFunction',
        'UpdateFunctionConfiguration20150331v2', 'UpdateFunctionConfiguration',
        'CreateNotebookInstance',                'UpdateNotebookInstance',
        'CreateTrainingJob',                     'CreateProcessingJob',
        'CreateDevEndpoint',                     'UpdateDevEndpoint',
        'RegisterTaskDefinition',
        'StartAutomationExecution',
        'CreateStateMachine',                    'UpdateStateMachine'
    )
      AND (
          request_parameters LIKE '%roleArn%'
          OR request_parameters LIKE '%iamInstanceProfile%'
          OR request_parameters LIKE '%"role"%'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f510 AssumeRole Cross-Account"
  description: "Shows AssumeRole events where caller and target are in different AWS accounts. Indicates lateral movement."
  techniques:
    - tid: "T1199.A002"
      name: "Trusted Relationship: Role Assumption and Federated Access"
      summary: "Adversaries pivot across accounts through assumed roles and federated sessions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1199.A002.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Show all AssumeRole events where the assumed role ARN is in a different
    AWS account than the caller. Include session duration and external ID if present.
    Cross-account role assumptions can indicate lateral movement.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        user_identity_account_id                                     AS caller_account,
        recipient_account_id,
        json_extract_string(request_parameters, '$.roleArn')         AS assumed_role_arn,
        json_extract_string(request_parameters, '$.externalId')      AS external_id,
        json_extract_string(request_parameters, '$.durationSeconds') AS duration_seconds,
        source_ip_address
    FROM cloudtrail_events
    WHERE event_name = 'AssumeRole'
      AND user_identity_account_id IS NOT NULL
      AND recipient_account_id     IS NOT NULL
      AND user_identity_account_id != recipient_account_id
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f3e2 Cross-Account Access"
  description: "Finds events where the caller account differs from the recipient account. Lateral movement signal."
  techniques:
    - tid: "T1199.A002"
      name: "Trusted Relationship: Role Assumption and Federated Access"
      summary: "Adversaries pivot across accounts through assumed roles and federated sessions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1199.A002.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all events where the caller's AWS account ID differs from the
    recipient account ID. This includes cross-account role assumptions
    and resource access. Show caller account, recipient account, event details.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_account_id AS caller_account,
        recipient_account_id,
        user_identity_arn,
        source_ip_address
    FROM cloudtrail_events
    WHERE user_identity_account_id IS NOT NULL
      AND recipient_account_id     IS NOT NULL
      AND user_identity_account_id != recipient_account_id
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f511 STS Federation Token Issuance"
  description: "Detects GetFederationToken and GetSessionToken calls. Attackers use these to convert long-lived keys into persistent temporary credentials."
  techniques:
    - tid: "T1199.A002"
      name: "Trusted Relationship: Role Assumption and Federated Access"
      summary: "Adversaries pivot across accounts through assumed roles and federated sessions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1199.A002.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all GetFederationToken and GetSessionToken events from STS.
    Attackers with a compromised IAM access key use these to generate temporary
    credentials that are harder to revoke. GetFederationToken in particular
    creates sessions that survive key rotation. Show caller, federation name,
    duration requested, source IP, and region.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        user_identity_type,
        json_extract_string(request_parameters, '$.name')            AS federation_name,
        json_extract_string(request_parameters, '$.durationSeconds') AS duration_seconds,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'sts.amazonaws.com'
      AND event_name IN ('GetFederationToken', 'GetSessionToken')
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f9e9 STS AssumeRoleWithWebIdentity"
  description: "Detects AssumeRoleWithWebIdentity calls. Abusing a misconfigured OIDC trust (e.g., overly broad sub claim) lets attackers hijack a role using attacker-controlled tokens."
  techniques:
    - tid: "T1199.A002"
      name: "Trusted Relationship: Role Assumption and Federated Access"
      summary: "Adversaries pivot across accounts through assumed roles and federated sessions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1199.A002.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AssumeRoleWithWebIdentity events from sts.amazonaws.com.
    A misconfigured OIDC trust policy (e.g., sub claim matched with a wildcard,
    or GitHub Actions OIDC without a repo condition) lets attackers obtain
    temporary credentials by presenting a forged or stolen third-party token.
    Show role ARN, session name, source IP, and time.
    Flag sessions where the requesting IP is unexpected.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.roleArn')          AS role_arn,
        json_extract_string(request_parameters, '$.roleSessionName')  AS session_name,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'sts.amazonaws.com'
      AND event_name = 'AssumeRoleWithWebIdentity'
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f194 IAM Identity Center (SSO) Events"
  description: "Detects AWS IAM Identity Center management actions. Attackers abuse SSO to create backdoor permission sets or assign accounts to attacker-controlled users."
  techniques:
    - tid: "T1098.003"
      name: "Account Manipulation: Additional Cloud Roles"
      summary: "Adversaries attach roles or policies to grant themselves elevated permissions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.003.html"
    - tid: "T1078.A001"
      name: "Valid Accounts: IAM Users"
      summary: "Adversaries authenticate with compromised long-lived IAM user credentials."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1078.A001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AWS IAM Identity Center (SSO) management events from
    sso.amazonaws.com, sso-directory.amazonaws.com, and
    identitystore.amazonaws.com. Key threats: CreatePermissionSet (new admin
    access), CreateAccountAssignment (assigning accounts to attacker users),
    AttachManagedPolicyToPermissionSet, and DeleteAccountAssignment.
    Show event name, caller, target account, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_arn,
        aws_region,
        source_ip_address,
        request_parameters,
        error_code
    FROM cloudtrail_events
    WHERE event_source IN (
        'sso.amazonaws.com',
        'sso-directory.amazonaws.com',
        'identitystore.amazonaws.com',
        'sso-oauth.amazonaws.com'
    )
    ORDER BY event_time DESC
    LIMIT 200

- category: "\U0001f511 Identity & Access"
  label: "\U0001f517 SAML / OIDC Provider Updates"
  description: "Detects SAML/OIDC identity provider changes. Updating a SAML provider with attacker-controlled metadata creates a persistent authentication backdoor."
  techniques:
    - tid: "T1484.002"
      name: "Domain or Tenant Policy Modification: Trust Modification"
      summary: "Adversaries modify trust relationships (SAML/OIDC/role trust) to gain persistent access."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1484.002.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all SAML and OIDC provider management events: CreateSAMLProvider,
    UpdateSAMLProvider, DeleteSAMLProvider, CreateOIDCProvider,
    UpdateOIDCProviderThumbprint, DeleteOIDCProvider,
    AddClientIDToOIDCProvider, and RemoveClientIDFromOIDCProvider.
    Updating a SAML provider with attacker-controlled IdP metadata allows
    the attacker to authenticate as any federated user permanently.
    Show provider ARN, caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.sAMLProviderArn') AS saml_provider_arn,
        json_extract_string(request_parameters, '$.url')             AS oidc_url,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'iam.amazonaws.com'
      AND event_name IN (
          'CreateSAMLProvider',          'UpdateSAMLProvider',          'DeleteSAMLProvider',
          'CreateOIDCProvider',          'UpdateOIDCProviderThumbprint', 'DeleteOIDCProvider',
          'AddClientIDToOIDCProvider',   'RemoveClientIDFromOIDCProvider'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f9d0 IAM Access Analyzer Calls"
  description: "Detects any use of IAM Access Analyzer. Attackers use the native AWS analyzer to enumerate externally accessible resources without writing custom recon scripts."
  techniques:
    - tid: "T1087.004"
      name: "Account Discovery: Cloud Account"
      summary: "Adversaries enumerate IAM users, roles, and policies to map the account."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1087.004.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all IAM Access Analyzer API calls from access-analyzer.amazonaws.com.
    Key events: CreateAnalyzer, ListFindings, GetFinding (attacker reads policy
    gaps), StartResourceScan, ValidatePolicy.
    Attackers leverage the built-in Access Analyzer to silently enumerate which
    resources are externally accessible without triggering GuardDuty signatures
    normally associated with custom recon tools.
    Show event name, analyzer ARN, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.analyzerArn') AS analyzer_arn,
        aws_region,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'access-analyzer.amazonaws.com'
    ORDER BY event_time DESC
    LIMIT 200

- category: "\U0001f511 Identity & Access"
  label: "\U0001f504 Credential Report & Enumeration"
  description: "Detects IAM enumeration activity that maps the entire IAM landscape. Common in early attack stages."
  techniques:
    - tid: "T1087.004"
      name: "Account Discovery: Cloud Account"
      summary: "Adversaries enumerate IAM users, roles, and policies to map the account."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1087.004.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Detect IAM enumeration activity: GenerateCredentialReport,
    GetCredentialReport, ListUsers, ListRoles, ListPolicies,
    GetAccountAuthorizationDetails. These calls collectively map the
    entire IAM landscape. Group by caller and time window.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'GenerateCredentialReport', 'GetCredentialReport',
        'ListUsers', 'ListRoles', 'ListPolicies',
        'GetAccountAuthorizationDetails'
    )
    ORDER BY event_time DESC
    LIMIT 200

- category: "\U0001f511 Identity & Access"
  label: "\U0001f5dd Access Key Abuse"
  description: "Detects access keys used from 3+ distinct source IPs in 7 days. Strong indicator of key leak."
  techniques:
    - tid: "T1078.A001"
      name: "Valid Accounts: IAM Users"
      summary: "Adversaries authenticate with compromised long-lived IAM user credentials."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1078.A001.html"
  chart:
    type: bar
    x: user_identity_arn
    y:
      - distinct_source_ips
      - total_events
  prompt: |
    Find access key lifecycle events: CreateAccessKey, DeleteAccessKey,
    UpdateAccessKey, GetAccessKeyLastUsed. Also check for keys used from
    multiple source_ip_address values, which may indicate key compromise.
    Show the user_identity_arn, event_time, and source_ip_address.
  sql: |
    SELECT
        user_identity_arn,
        COUNT(DISTINCT source_ip_address) AS distinct_source_ips,
        MIN(event_time)                   AS first_seen,
        MAX(event_time)                   AS last_seen,
        COUNT(*)                          AS total_events
    FROM cloudtrail_events
    WHERE event_time >= NOW() - INTERVAL '7 days'
      AND user_identity_arn IS NOT NULL
      AND source_ip_address IS NOT NULL
    GROUP BY user_identity_arn
    HAVING COUNT(DISTINCT source_ip_address) >= 3
    ORDER BY distinct_source_ips DESC
    LIMIT 50

- category: "\U0001f511 Identity & Access"
  label: "\U0001f4f0 AWS Organizations Account Creation"
  description: "Detects Organizations account creation and delegated administrator changes. Attackers create shadow accounts to establish persistent footholds outside the main account."
  techniques:
    - tid: "T1666.A001"
      name: "Modify Cloud Resource Hierarchy: Create or Invite AWS Account"
      summary: "Adversaries create or invite accounts to expand or hide their foothold."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1666.A001.html"
    - tid: "T1136.003"
      name: "Create Account: Cloud Account"
      summary: "Adversaries create new IAM users or accounts as a persistent foothold."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1136.003.html"
    - tid: "T1666.A002"
      name: "Modify Cloud Resource Hierarchy: Leave AWS Organization"
      summary: "Adversaries detach accounts from the organization to escape guardrails."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1666.A002.html"
    - tid: "T1666.A003"
      name: "Modify Cloud Resource Hierarchy: Invite Accounts to Unknown Organization"
      summary: "Adversaries move victim accounts under an attacker-controlled organization."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1666.A003.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AWS Organizations management events: CreateAccount (shadow account
    persistence), InviteAccountToOrganization, RegisterDelegatedAdministrator
    (granting a rogue account service-level admin), DeregisterDelegatedAdministrator,
    EnableAWSServiceAccess, DisableAWSServiceAccess, CreateOrganizationalUnit,
    MoveAccount, AttachPolicy, DetachPolicy. Also flag hierarchy-escape events:
    LeaveOrganization and RemoveAccountFromOrganization (detaching an account
    from its guardrails), and AcceptHandshake / CancelHandshake / DeclineHandshake
    (moving an account under a different, possibly attacker-controlled, organization).
    Creating a new account inside the organization gives the attacker a permanent
    foothold that survives incident response in the targeted account.
    Show account name, email, caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.accountName')      AS account_name,
        json_extract_string(request_parameters, '$.accountId')        AS target_account_id,
        json_extract_string(request_parameters, '$.email')            AS account_email,
        json_extract_string(request_parameters, '$.servicePrincipal') AS service_principal,
        json_extract_string(request_parameters, '$.handshakeId')      AS handshake_id,
        aws_region,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'organizations.amazonaws.com'
      AND event_name IN (
          'CreateAccount',                 'InviteAccountToOrganization',
          'CreateOrganizationalUnit',      'MoveAccount',
          'AttachPolicy',                  'DetachPolicy',
          'RegisterDelegatedAdministrator','DeregisterDelegatedAdministrator',
          'EnableAWSServiceAccess',        'DisableAWSServiceAccess',
          'LeaveOrganization',             'RemoveAccountFromOrganization',
          'AcceptHandshake',               'CancelHandshake', 'DeclineHandshake'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f465 Cognito Unauthenticated Access"
  description: "Detects Cognito Identity Pools with unauthenticated access enabled. Allows anonymous users to call AWS APIs with the unauthenticated IAM role's permissions."
  techniques:
    - tid: "T1098.A006"
      name: "Account Manipulation: Cognito Refresh Token Abuse"
      summary: "Adversaries abuse Cognito tokens and user-pool settings to keep authenticated access."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.A006.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all CreateIdentityPool and UpdateIdentityPool events where
    allowUnauthenticatedIdentities was set to true.
    An identity pool with unauthenticated access enabled lets anonymous internet
    users obtain temporary AWS credentials through the unauthenticated IAM role,
    which may have overly permissive policies attached.
    Show pool name, pool ID, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.identityPoolId')              AS identity_pool_id,
        json_extract_string(request_parameters, '$.identityPoolName')            AS identity_pool_name,
        json_extract_string(request_parameters, '$.allowUnauthenticatedIdentities') AS allow_unauthenticated,
        aws_region,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'cognito-identity.amazonaws.com'
      AND event_name IN ('CreateIdentityPool', 'UpdateIdentityPool', 'SetIdentityPoolRoles')
      AND (
          request_parameters LIKE '%"allowUnauthenticatedIdentities":true%'
          OR request_parameters LIKE '%allowUnauthenticatedIdentities=true%'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f9ea Glue DevEndpoint Privilege Escalation"
  description: "Detects Glue development endpoint creation and connection enumeration. iam:PassRole + glue:CreateDevEndpoint grants full role permissions via SSH — one of the most overlooked IAM privilege escalation techniques."
  techniques:
    - tid: "T1098.003"
      name: "Account Manipulation: Additional Cloud Roles"
      summary: "Adversaries attach roles or policies to grant themselves elevated permissions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.003.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all Glue development endpoint and connection events:
    CreateDevEndpoint / UpdateDevEndpoint (iam:PassRole + glue:CreateDevEndpoint
    creates an SSH-accessible endpoint that can run arbitrary code with the
    passed role's full permissions), DeleteDevEndpoint, GetDevEndpoint,
    GetConnections / GetConnection (enumerating stored database credentials
    in the Glue Data Catalog — a common post-compromise credential harvest step).
    Show endpoint name, role ARN, public key, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.endpointName')    AS endpoint_name,
        json_extract_string(request_parameters, '$.roleArn')         AS role_arn,
        json_extract_string(request_parameters, '$.connectionName')  AS connection_name,
        json_extract_string(request_parameters, '$.publicKey')       AS public_key,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'glue.amazonaws.com'
      AND event_name IN (
          'CreateDevEndpoint',   'UpdateDevEndpoint',   'DeleteDevEndpoint',
          'GetDevEndpoint',      'GetDevEndpoints',
          'GetConnections',      'GetConnection',
          'CreateConnection',    'DeleteConnection'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f9ea SageMaker Notebook Privilege Escalation"
  description: "Detects SageMaker notebook instance creation and presigned URL generation. iam:PassRole + sagemaker:CreateNotebookInstance provides a Jupyter environment with the passed role's full AWS permissions. CreatePresignedNotebookInstanceUrl alone can grant access to an existing notebook."
  techniques:
    - tid: "T1098.003"
      name: "Account Manipulation: Additional Cloud Roles"
      summary: "Adversaries attach roles or policies to grant themselves elevated permissions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.003.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all SageMaker notebook management events:
    CreateNotebookInstance (iam:PassRole + sagemaker:CreateNotebookInstance
    launches a Jupyter environment with the passed role's full AWS permissions),
    CreatePresignedNotebookInstanceUrl (an attacker with only this permission
    can access any existing notebook and its attached role),
    StartNotebookInstance, StopNotebookInstance, DeleteNotebookInstance,
    UpdateNotebookInstance (changing to a more privileged role).
    Also flag CreateTrainingJob and CreateProcessingJob which accept iam:PassRole.
    Show notebook name, role ARN, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.notebookInstanceName')   AS notebook_name,
        json_extract_string(request_parameters, '$.roleArn')                AS role_arn,
        json_extract_string(request_parameters, '$.instanceType')           AS instance_type,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'sagemaker.amazonaws.com'
      AND event_name IN (
          'CreateNotebookInstance',              'UpdateNotebookInstance',
          'DeleteNotebookInstance',              'StartNotebookInstance',
          'StopNotebookInstance',
          'CreatePresignedNotebookInstanceUrl',
          'CreateTrainingJob',                   'CreateProcessingJob',
          'CreateTransformJob',                  'CreateHyperParameterTuningJob'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f6e0 Data Pipeline / CodeStar Privilege Escalation"
  description: "Detects Data Pipeline and CodeStar resource creation. Both accept iam:PassRole and can execute arbitrary code with the passed role's permissions. CodeStar:CreateProjectFromTemplate is an undocumented API that creates an admin IAM role."
  techniques:
    - tid: "T1098.003"
      name: "Account Manipulation: Additional Cloud Roles"
      summary: "Adversaries attach roles or policies to grant themselves elevated permissions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.003.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AWS Data Pipeline and CodeStar management events used for
    privilege escalation:
    Data Pipeline: CreatePipeline + PutPipelineDefinition + ActivatePipeline
    (the pipeline definition can contain a ShellCommandActivity that runs
    arbitrary code with the passed role's permissions),
    CodeStar: CreateProjectFromTemplate (undocumented API that creates an
    admin-equivalent IAM role as a side effect), CreateProject, AssociateTeamMember
    (granting team member role with elevated access).
    Show resource name, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_arn,
        COALESCE(
            json_extract_string(request_parameters, '$.name'),
            json_extract_string(request_parameters, '$.pipelineId')
        )                                                               AS resource_name,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE (
        event_source = 'datapipeline.amazonaws.com'
        AND event_name IN (
            'CreatePipeline',     'PutPipelineDefinition',
            'ActivatePipeline',   'DeletePipeline'
        )
    ) OR (
        event_source = 'codestar.amazonaws.com'
        AND event_name IN (
            'CreateProject',              'DeleteProject',
            'CreateProjectFromTemplate',
            'AssociateTeamMember',        'DisassociateTeamMember',
            'UpdateTeamMember'
        )
    )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f511 Identity & Access"
  label: "\U0001f9e9 Step Functions Privilege Escalation"
  description: "Detects Step Functions state machine creation and execution. iam:PassRole + states:CreateStateMachine + states:StartExecution allows running arbitrary Lambda / ECS tasks under the passed role's permissions."
  techniques:
    - tid: "T1098.003"
      name: "Account Manipulation: Additional Cloud Roles"
      summary: "Adversaries attach roles or policies to grant themselves elevated permissions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.003.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AWS Step Functions management events:
    CreateStateMachine (iam:PassRole + states:CreateStateMachine can execute
    Lambda functions or ECS tasks under the passed role's full permissions),
    UpdateStateMachine (changing the role or task definitions),
    DeleteStateMachine, StartExecution, StopExecution, CreateActivity.
    Step Functions is an often-overlooked privilege escalation path because
    it indirectly invokes other services under the passed role.
    Show state machine name, role ARN, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.name')         AS state_machine_name,
        json_extract_string(request_parameters, '$.roleArn')      AS role_arn,
        json_extract_string(request_parameters, '$.stateMachineArn') AS state_machine_arn,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'states.amazonaws.com'
      AND event_name IN (
          'CreateStateMachine',  'UpdateStateMachine',  'DeleteStateMachine',
          'StartExecution',      'StopExecution',
          'CreateActivity',      'DeleteActivity'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "🔑 Identity & Access"
  label: "🪓 IAM Entity Deletion"
  description: "Detects deletion of IAM users, roles, policies, and MFA devices. Attackers delete IAM entities to remove traces of their activity or lock defenders out."
  techniques:
    - tid: "T1070.A001"
      name: "Indicator Removal: Delete IAM Entities"
      summary: "Adversaries delete IAM users, roles, and policies to remove traces of their activity."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1070.A001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find IAM entity deletion events: DeleteUser, DeleteRole, DeleteAccessKey,
    DeleteLoginProfile, DeletePolicy, DeleteRolePolicy, DeleteUserPolicy,
    DeleteGroup, DeleteVirtualMFADevice, DeactivateMFADevice.
    Deleting IAM entities removes evidence of attacker-created identities and
    can lock legitimate users out. Show which entity was deleted, the caller,
    source IP, and time. Flag callers with many deletions in a short window.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        COALESCE(
            json_extract_string(request_parameters, '$.userName'),
            json_extract_string(request_parameters, '$.roleName'),
            json_extract_string(request_parameters, '$.policyArn'),
            json_extract_string(request_parameters, '$.groupName'),
            json_extract_string(request_parameters, '$.serialNumber'),
            json_extract_string(request_parameters, '$.instanceProfileName')
        )                                                                 AS deleted_entity,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'iam.amazonaws.com'
      AND event_name IN (
          'DeleteUser',             'DeleteRole',
          'DeleteAccessKey',        'DeleteLoginProfile',
          'DeletePolicy',           'DeleteRolePolicy',
          'DeleteUserPolicy',       'DeleteGroup',
          'DeleteGroupPolicy',      'DeleteVirtualMFADevice',
          'DeactivateMFADevice',    'DeleteInstanceProfile'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "🔑 Identity & Access"
  label: "👑 AssumeRoot Usage"
  description: "Detects sts:AssumeRoot calls from the management account into member-account root. A compromised management account can take over every member account this way."
  techniques:
    - tid: "AT1669"
      name: "Assume Root into Organization Member Account"
      summary: "Adversaries use sts:AssumeRoot to take over member-account root from the management account."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/AT1669.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all sts:AssumeRoot events. AssumeRoot lets the Organizations
    management account obtain temporary root credentials in a member
    account — attackers use it to delete root credentials, reset MFA,
    or take over member accounts. Show the caller, the target principal
    (member account), the task policy used, source IP, and time.
    Correlate with DeactivateMFADevice / DeleteLoginProfile shortly after.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.targetPrincipal')     AS target_principal,
        json_extract_string(request_parameters, '$.taskPolicyArn.arn')   AS task_policy_arn,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name = 'AssumeRoot'
    ORDER BY event_time DESC
    LIMIT 100

# ===========================================================================
# Data & Storage
# ===========================================================================

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f4a3 S3 Bulk Object Deletion"
  description: "Detects high-volume DeleteObject/DeleteObjects calls (>=50/hour). Distinct from exfiltration — this is data destruction / ransomware pattern."
  techniques:
    - tid: "T1485.A003"
      name: "Data Destruction: S3 Object and Bucket Deletion"
      summary: "Adversaries mass-delete S3 objects and buckets."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.A003.html"
  chart:
    type: bar
    x: user_identity_arn
    y:
      - delete_count
  prompt: |
    Find identities performing 50 or more S3 DeleteObject or DeleteObjects
    calls within a single hour. This is the primary data-destruction pattern
    for ransomware and wiper attacks — distinct from the GetObject exfiltration
    pattern already monitored. Show caller, source IP, hour bucket,
    number of delete operations, and number of affected buckets.
  sql: |
    SELECT
        user_identity_arn,
        source_ip_address,
        DATE_TRUNC('hour', event_time)                                   AS hour_bucket,
        COUNT(*)                                                          AS delete_count,
        COUNT(DISTINCT json_extract_string(request_parameters, '$.bucketName'))
                                                                          AS buckets_affected
    FROM cloudtrail_events
    WHERE event_source = 's3.amazonaws.com'
      AND event_name IN ('DeleteObject', 'DeleteObjects')
    GROUP BY user_identity_arn, source_ip_address, hour_bucket
    HAVING COUNT(*) >= 50
    ORDER BY delete_count DESC
    LIMIT 50

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f525 AWS Backup Tampering"
  description: "Detects Backup Vault/Plan/RecoveryPoint deletion. Destroying backups is the first step in ransomware attacks to prevent recovery."
  techniques:
    - tid: "T1485"
      name: "Data Destruction"
      summary: "Adversaries destroy data and backups to cause damage or prevent recovery."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AWS Backup tampering events: DeleteBackupVault,
    DeleteBackupPlan, DeleteRecoveryPoint, DeleteBackupSelection,
    DisassociateRecoveryPoint, PutBackupVaultAccessPolicy (cross-account
    access to exfiltrate backups), DeleteBackupVaultLockConfiguration
    (removing immutable backup lock).
    Ransomware operators delete all backup copies before encrypting primary data
    to prevent recovery. Any backup vault or recovery-point deletion outside a
    sanctioned maintenance window is a critical incident indicator.
    Show vault/plan name, recovery point ARN, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.backupVaultName')     AS vault_name,
        json_extract_string(request_parameters, '$.backupPlanId')        AS plan_id,
        json_extract_string(request_parameters, '$.recoveryPointArn')    AS recovery_point_arn,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'backup.amazonaws.com'
      AND event_name IN (
          'DeleteBackupVault',             'DeleteBackupPlan',
          'DeleteRecoveryPoint',           'DeleteBackupSelection',
          'DisassociateRecoveryPoint',     'PutBackupVaultAccessPolicy',
          'DeleteBackupVaultLockConfiguration'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f513 KMS Key Operations"
  description: "Flags sensitive KMS operations including key deletion and high-volume Decrypt calls."
  techniques:
    - tid: "T1486"
      name: "Data Encrypted for Impact"
      summary: "Adversaries encrypt data with attacker-controlled keys for ransom."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1486.html"
    - tid: "T1485"
      name: "Data Destruction"
      summary: "Adversaries destroy data and backups to cause damage or prevent recovery."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find sensitive KMS operations: DisableKey, ScheduleKeyDeletion,
    CreateGrant, PutKeyPolicy, Decrypt (high volume from single source).
    Attackers may disable encryption or decrypt stolen data.
    Show caller identity, key ID from request_parameters, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.keyId') AS key_id,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'DisableKey', 'ScheduleKeyDeletion', 'CancelKeyDeletion',
        'CreateGrant', 'PutKeyPolicy', 'Decrypt'
    )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f513 S3 Public Access Block Disabled"
  description: "Detects S3 public access block settings being disabled. Immediate data exposure risk."
  techniques:
    - tid: "T1530.A001"
      name: "Data from Cloud Storage: S3 Object Collection"
      summary: "Adversaries download or expose S3 objects at scale."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1530.A001.html"
  prompt: |
    Find all PutPublicAccessBlock events where any of the four block settings
    were set to false. This exposes S3 buckets to public access.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.bucketName')                     AS bucket_name,
        json_extract_string(request_parameters, '$.PublicAccessBlockConfiguration') AS block_config,
        source_ip_address
    FROM cloudtrail_events
    WHERE event_name = 'PutPublicAccessBlock'
      AND (
          request_parameters LIKE '%"blockPublicAcls":false%'
          OR request_parameters LIKE '%"blockPublicPolicy":false%'
          OR request_parameters LIKE '%"ignorePublicAcls":false%'
          OR request_parameters LIKE '%"restrictPublicBuckets":false%'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001faa3 S3 Bucket Policy / ACL Changes"
  description: "Detects S3 bucket policy and ACL modifications. These can make a bucket publicly readable or grant access to attacker-controlled accounts."
  techniques:
    - tid: "T1530.A001"
      name: "Data from Cloud Storage: S3 Object Collection"
      summary: "Adversaries download or expose S3 objects at scale."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1530.A001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all S3 bucket permission changes: PutBucketPolicy, DeleteBucketPolicy,
    PutBucketAcl, PutBucketCors, PutBucketWebsite, and DeleteBucketWebsite.
    These modifications can expose bucket contents publicly or to attackers.
    PutBucketPolicy with Principal='*' is especially critical.
    Show bucket name, caller, source IP, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.bucketName') AS bucket_name,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 's3.amazonaws.com'
      AND event_name IN (
          'PutBucketPolicy',   'DeleteBucketPolicy',
          'PutBucketAcl',      'PutBucketCors',
          'PutBucketWebsite',  'DeleteBucketWebsite'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001faa3 S3 Data Access Anomalies"
  description: "Detects bulk GetObject calls (>=100/hour) that may indicate data exfiltration."
  techniques:
    - tid: "T1530.A001"
      name: "Data from Cloud Storage: S3 Object Collection"
      summary: "Adversaries download or expose S3 objects at scale."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1530.A001.html"
  chart:
    type: bar
    x: user_identity_arn
    y:
      - call_count
  prompt: |
    Find unusual S3 activity: large numbers of GetObject calls from a single
    IP or user within a short time window (potential exfiltration).
    Also flag DeleteBucket, DeleteObject, and PutBucketPolicy events.
  sql: |
    SELECT
        user_identity_arn,
        source_ip_address,
        DATE_TRUNC('hour', event_time) AS hour_bucket,
        COUNT(*)                       AS call_count
    FROM cloudtrail_events
    WHERE event_source = 's3.amazonaws.com'
      AND event_name   = 'GetObject'
    GROUP BY user_identity_arn, source_ip_address, hour_bucket
    HAVING COUNT(*) >= 100
    ORDER BY call_count DESC
    LIMIT 50

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f510 Secrets Manager Bulk GetSecretValue"
  description: "Detects bulk retrieval of secrets (DB passwords, API keys, etc.). Ten or more GetSecretValue calls in one hour is a strong credential-harvesting signal."
  techniques:
    - tid: "T1552"
      name: "Unsecured Credentials"
      summary: "Adversaries harvest secrets stored in cloud services or files."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1552.html"
  chart:
    type: bar
    x: user_identity_arn
    y:
      - call_count
      - distinct_secrets
  prompt: |
    Find all Secrets Manager GetSecretValue calls and identify identities that
    retrieved 10 or more distinct secrets within a single hour. Legitimate
    applications typically access a fixed, small set of secrets. Bulk reads
    across many distinct secret IDs indicate credential harvesting.
    Show caller, source IP, hour bucket, call count, and distinct secret count.
  sql: |
    SELECT
        user_identity_arn,
        source_ip_address,
        DATE_TRUNC('hour', event_time)                                            AS hour_bucket,
        COUNT(*)                                                                   AS call_count,
        COUNT(DISTINCT json_extract_string(request_parameters, '$.secretId'))     AS distinct_secrets
    FROM cloudtrail_events
    WHERE event_source = 'secretsmanager.amazonaws.com'
      AND event_name = 'GetSecretValue'
    GROUP BY user_identity_arn, source_ip_address, hour_bucket
    HAVING COUNT(*) >= 10
    ORDER BY call_count DESC
    LIMIT 50

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f5dd Secrets Manager Deletion & Cross-Account Policy"
  description: "Detects Secrets Manager secret deletion and cross-account resource policy changes. Complements existing bulk-read detection with destruction and policy-exfiltration vectors."
  techniques:
    - tid: "T1552"
      name: "Unsecured Credentials"
      summary: "Adversaries harvest secrets stored in cloud services or files."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1552.html"
    - tid: "T1485"
      name: "Data Destruction"
      summary: "Adversaries destroy data and backups to cause damage or prevent recovery."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find Secrets Manager events beyond bulk reads: DeleteSecret (immediate or
    scheduled destruction of credentials), PutResourcePolicy (granting secret
    access to external AWS accounts — a silent exfiltration of credentials),
    DeleteResourcePolicy, RestoreSecret (an attacker restoring a secret they
    deleted to cover tracks), CancelRotateSecret (freezing rotation to preserve
    a known credential).
    These complement the existing bulk GetSecretValue detection by covering
    the destruction and cross-account-sharing exfiltration paths.
    Show secret ID, recovery window, resource policy, caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.secretId')             AS secret_id,
        json_extract_string(request_parameters, '$.recoveryWindowInDays') AS recovery_window_days,
        json_extract_string(request_parameters, '$.resourcePolicy')       AS resource_policy,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'secretsmanager.amazonaws.com'
      AND event_name IN (
          'DeleteSecret',
          'PutResourcePolicy',       'DeleteResourcePolicy',
          'RemoveRegionsFromReplication',
          'ReplicateSecretToRegions',
          'CancelRotateSecret'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f510 SSM Parameter Store Bulk Read"
  description: "Detects bulk reads of SSM Parameter Store entries. An often-overlooked exfiltration channel compared with Secrets Manager."
  techniques:
    - tid: "T1552"
      name: "Unsecured Credentials"
      summary: "Adversaries harvest secrets stored in cloud services or files."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1552.html"
  chart:
    type: bar
    x: user_identity_arn
    y:
      - call_count
      - distinct_params
  prompt: |
    Find all SSM Parameter Store bulk read operations: GetParameter,
    GetParameters, and GetParametersByPath. Legitimate services access a
    known fixed set of parameters. Identities reading 20+ parameters in one
    hour may be harvesting database credentials, API keys, or configuration
    secrets stored in Parameter Store (SecureString type).
    Show caller, source IP, hour bucket, call count, and distinct parameter count.
  sql: |
    SELECT
        user_identity_arn,
        source_ip_address,
        DATE_TRUNC('hour', event_time)                                              AS hour_bucket,
        COUNT(*)                                                                     AS call_count,
        COUNT(DISTINCT json_extract_string(request_parameters, '$.name'))           AS distinct_params
    FROM cloudtrail_events
    WHERE event_source = 'ssm.amazonaws.com'
      AND event_name IN ('GetParameter', 'GetParameters', 'GetParametersByPath')
    GROUP BY user_identity_arn, source_ip_address, hour_bucket
    HAVING COUNT(*) >= 20
    ORDER BY call_count DESC
    LIMIT 50

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f4be RDS Snapshot Cross-Account Share"
  description: "Detects RDS/Aurora snapshots shared to external AWS accounts. Classic data exfiltration via snapshot sharing."
  techniques:
    - tid: "T1578.001"
      name: "Modify Cloud Compute Infrastructure: Create Snapshot"
      summary: "Adversaries create and share snapshots to stage data theft."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1578.001.html"
    - tid: "T1530"
      name: "Data from Cloud Storage"
      summary: "Adversaries collect data from cloud storage services."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1530.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all ModifyDBSnapshotAttribute and ModifyDBClusterSnapshotAttribute events
    where the restore permission was granted to another AWS account (valuesToAdd).
    Attackers share snapshots to their own account to exfiltrate an entire database
    without triggering S3/network-based DLP. Show snapshot ID, target account,
    caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.dBSnapshotIdentifier')        AS snapshot_id,
        json_extract_string(request_parameters, '$.dBClusterSnapshotIdentifier') AS cluster_snapshot_id,
        json_extract_string(request_parameters, '$.attributeName')               AS attribute_name,
        request_parameters,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'ModifyDBSnapshotAttribute',
        'ModifyDBClusterSnapshotAttribute'
    )
      AND (
          request_parameters LIKE '%restore%'
          OR request_parameters LIKE '%valuesToAdd%'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f4a3 RDS Deleted without Final Snapshot"
  description: "Detects RDS instance/cluster deletion with skipFinalSnapshot=true. Potential data destruction."
  techniques:
    - tid: "T1485.A001"
      name: "Data Destruction: RDS Instances and Backups"
      summary: "Adversaries delete RDS instances and backups to destroy data."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.A001.html"
  prompt: |
    Find all DeleteDBInstance and DeleteDBCluster events where the final
    snapshot was skipped. This may indicate data destruction or a destructive
    attack. Show DB name, caller, region, and time.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        aws_region,
        event_name,
        json_extract_string(request_parameters, '$.dBInstanceIdentifier') AS db_instance,
        json_extract_string(request_parameters, '$.dBClusterIdentifier')  AS db_cluster,
        source_ip_address
    FROM cloudtrail_events
    WHERE event_name IN ('DeleteDBInstance', 'DeleteDBCluster')
      AND json_extract_string(request_parameters, '$.skipFinalSnapshot') = 'true'
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f4bd RDS Public Accessibility Enabled"
  description: "Detects RDS instances created or modified with PubliclyAccessible=true. Exposes the database directly to the internet, bypassing VPC security controls."
  techniques:
    - tid: "T1213.A013"
      name: "Data from Information Repositories: RDS Instance Manipulation"
      summary: "Adversaries restore, expose, or reconfigure RDS instances to reach the data inside."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1213.A013.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all RDS CreateDBInstance and ModifyDBInstance events where
    publiclyAccessible was set to true. A publicly accessible RDS instance
    bypasses VPC network controls and exposes the database directly to the
    internet. Show DB identifier, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.dBInstanceIdentifier') AS db_instance,
        json_extract_string(request_parameters, '$.publiclyAccessible')   AS publicly_accessible,
        aws_region,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'rds.amazonaws.com'
      AND event_name IN (
          'CreateDBInstance', 'ModifyDBInstance',
          'RestoreDBInstanceFromDBSnapshot',
          'RestoreDBInstanceFromS3',
          'RestoreDBInstanceToPointInTime'
      )
      AND (
          request_parameters LIKE '%"publiclyAccessible":true%'
          OR request_parameters LIKE '%publiclyAccessible=true%'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f5c4 DynamoDB Export / Bulk Exfiltration"
  description: "Detects DynamoDB ExportTableToPointInTime (silent full-table export to S3) and table deletion. High-risk exfiltration and destruction vector."
  techniques:
    - tid: "T1530"
      name: "Data from Cloud Storage"
      summary: "Adversaries collect data from cloud storage services."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1530.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all DynamoDB data-exfiltration and destruction events:
    ExportTableToPointInTime (exports entire table to any S3 bucket — including
    attacker-controlled ones — without generating GetItem events),
    DeleteTable (data destruction), CreateGlobalTable (replicating data to
    attacker region), UpdateContinuousBackups (disabling PITR to prevent recovery).
    DynamoDB exports bypass S3/network-based DLP because the data moves
    server-side. Show table name, export destination bucket, caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.tableName')         AS table_name,
        json_extract_string(request_parameters, '$.s3Bucket')          AS export_s3_bucket,
        json_extract_string(request_parameters, '$.s3BucketOwner')     AS s3_bucket_owner,
        json_extract_string(request_parameters, '$.exportFormat')      AS export_format,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'dynamodb.amazonaws.com'
      AND event_name IN (
          'ExportTableToPointInTime',
          'DeleteTable',
          'CreateGlobalTable',
          'UpdateContinuousBackups'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f4be EBS Direct API Snapshot Exfiltration"
  description: "Detects EBS Direct API calls (ListSnapshotBlocks / GetSnapshotBlock). Pacu's ebs__download_snapshots uses this API to stream raw snapshot data without creating EC2 instances, bypassing traditional snapshot-sharing detection."
  techniques:
    - tid: "T1530"
      name: "Data from Cloud Storage"
      summary: "Adversaries collect data from cloud storage services."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1530.html"
    - tid: "T1578.001"
      name: "Modify Cloud Compute Infrastructure: Create Snapshot"
      summary: "Adversaries create and share snapshots to stage data theft."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1578.001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all EBS Direct API calls from ebs.amazonaws.com:
    ListSnapshotBlocks / GetSnapshotBlock (reading raw block data directly from
    an EBS snapshot — Pacu's ebs__download_snapshots module uses this to stream
    an entire disk image without creating an EC2 instance or requesting a snapshot
    copy, so it bypasses the traditional ModifySnapshotAttribute detection),
    ListChangedBlocks (incremental diff exfiltration),
    StartSnapshot / CompleteSnapshot / PutSnapshotBlock (writing data to a new
    snapshot, potentially to stage exfiltrated data in attacker-controlled storage).
    Show snapshot ID, block index, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.snapshotId')    AS snapshot_id,
        json_extract_string(request_parameters, '$.blockIndex')    AS block_index,
        json_extract_string(request_parameters, '$.volumeSize')    AS volume_size_gb,
        json_extract_string(request_parameters, '$.description')   AS description,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'ebs.amazonaws.com'
      AND event_name IN (
          'ListSnapshotBlocks',   'GetSnapshotBlock',
          'ListChangedBlocks',    'PutSnapshotBlock',
          'StartSnapshot',        'CompleteSnapshot'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f30a Kinesis Firehose / Stream Exfiltration Channel"
  description: "Detects Kinesis Firehose delivery stream creation/update pointing to external S3. Real-time data pipeline exfiltration invisible to network DLP."
  techniques:
    - tid: "T1530"
      name: "Data from Cloud Storage"
      summary: "Adversaries collect data from cloud storage services."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1530.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all Kinesis Data Firehose and Kinesis Data Streams management events:
    CreateDeliveryStream (new pipeline — check for external S3 bucket owner),
    UpdateDestination (redirecting existing stream to attacker S3),
    DeleteDeliveryStream, StopStreamEncryption (weakening stream protection),
    CreateStream (new stream for attacker data collection).
    A Firehose delivery stream configured to an attacker-controlled S3 bucket
    creates a real-time data pipeline that bypasses all network-level DLP.
    Show stream name, destination bucket, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.deliveryStreamName') AS stream_name,
        json_extract_string(request_parameters, '$.streamName')         AS kinesis_stream,
        request_parameters,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source IN (
        'firehose.amazonaws.com',
        'kinesis.amazonaws.com'
      )
      AND event_name IN (
          'CreateDeliveryStream',    'UpdateDestination',       'DeleteDeliveryStream',
          'CreateStream',            'StopStreamEncryption',
          'MergeShards',             'SplitShard'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f501 S3 Cross-Account Replication"
  description: "Detects PutBucketReplication and DeleteBucketReplication. Cross-account replication silently copies all new objects to an attacker-controlled bucket."
  techniques:
    - tid: "T1530.A001"
      name: "Data from Cloud Storage: S3 Object Collection"
      summary: "Adversaries download or expose S3 objects at scale."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1530.A001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all PutBucketReplication and DeleteBucketReplication events.
    An attacker who configures replication to an external account receives
    a continuous stream of new objects in real time without generating
    additional GetObject events. Show source bucket, caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.bucketName') AS bucket_name,
        request_parameters,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 's3.amazonaws.com'
      AND event_name IN ('PutBucketReplication', 'DeleteBucketReplication')
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f4c2 S3 Versioning / Logging Disabled"
  description: "Detects S3 versioning suspension and server access logging disable. Disabling versioning enables data destruction; disabling logging erases the access evidence trail."
  techniques:
    - tid: "T1562.008"
      name: "Impair Defenses: Disable Cloud Logs"
      summary: "Adversaries disable or reroute cloud logging to erase evidence of their activity."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.008.html"
    - tid: "T1485"
      name: "Data Destruction"
      summary: "Adversaries destroy data and backups to cause damage or prevent recovery."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find PutBucketVersioning events where versioning was Suspended, and
    PutBucketLogging events where logging was disabled (empty BucketLoggingStatus).
    Disabling versioning allows permanent deletion of objects, while disabling
    server-access logging removes the evidence trail for subsequent exfiltration.
    Show bucket name, caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.bucketName') AS bucket_name,
        request_parameters,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 's3.amazonaws.com'
      AND event_name IN ('PutBucketVersioning', 'PutBucketLogging')
      AND (
          request_parameters LIKE '%Suspended%'
          OR request_parameters LIKE '%"BucketLoggingStatus":{}%'
          OR request_parameters LIKE '%"LoggingEnabled":{}%'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f4e7 SES Identity & Forwarding Config Changes"
  description: "Detects SES receipt rule and identity configuration changes. Forwarding rules can auto-relay all inbound mail to attacker addresses; verified identities enable phishing campaigns."
  techniques:
    - tid: "T1496.A001"
      name: "Resource Hijacking: Cloud Service Hijacking - SES Messaging"
      summary: "Adversaries abuse SES to send spam or phishing from the victim account."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.A001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AWS SES identity and forwarding configuration events:
    CreateReceiptRule / UpdateReceiptRule (configuring forwarding rules that
    auto-forward all incoming mail to attacker-controlled addresses),
    SetIdentityFeedbackForwardingEnabled (enabling bounce/complaint forwarding
    to attacker addresses), VerifyEmailIdentity / VerifyDomainIdentity
    (establishing new sending identities for phishing campaigns),
    PutEmailIdentityMailFromAttributes (modifying MAIL FROM domain to spoof
    legitimate-looking senders), DeleteIdentity (removing evidence).
    Show identity, rule name, forwarding settings, caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.identity')             AS ses_identity,
        json_extract_string(request_parameters, '$.emailAddress')         AS email_address,
        json_extract_string(request_parameters, '$.domain')               AS domain,
        json_extract_string(request_parameters, '$.ruleSetName')          AS rule_set_name,
        json_extract_string(request_parameters, '$.rule.name')            AS rule_name,
        json_extract_string(request_parameters, '$.forwardingEnabled')    AS forwarding_enabled,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'ses.amazonaws.com'
      AND event_name IN (
          'CreateReceiptRule',                        'UpdateReceiptRule',
          'DeleteReceiptRule',
          'SetIdentityFeedbackForwardingEnabled',
          'VerifyEmailIdentity',                      'VerifyDomainIdentity',
          'DeleteIdentity',
          'PutEmailIdentityMailFromAttributes',
          'CreateEmailIdentity',                      'DeleteEmailIdentity'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f4e1 SQS / SNS Cross-Account Policy Changes"
  description: "Detects SQS/SNS queue/topic policy changes that grant access to external accounts. Creates a silent exfiltration channel without triggering high-volume send alerts."
  techniques:
    - tid: "T1530"
      name: "Data from Cloud Storage"
      summary: "Adversaries collect data from cloud storage services."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1530.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find SQS and SNS permission changes that may grant external accounts
    access to receive messages: SQS SetQueueAttributes (changing queue policy
    to allow external sqs:ReceiveMessage), SQS AddPermission / RemovePermission,
    SNS AddPermission / RemovePermission, SNS SetTopicAttributes,
    SNS Subscribe (subscribing an attacker-controlled HTTP endpoint or
    cross-account SQS queue).
    Unlike high-volume send monitoring, this detects the configuration step
    that enables silent data streaming to attacker-controlled endpoints.
    Show resource ARN, granted account, permission label, caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_arn,
        aws_region,
        COALESCE(
            json_extract_string(request_parameters, '$.queueUrl'),
            json_extract_string(request_parameters, '$.topicArn')
        )                                                               AS resource_arn,
        json_extract_string(request_parameters, '$.label')             AS permission_label,
        json_extract_string(request_parameters, '$.awsAccountId')      AS granted_account_id,
        json_extract_string(request_parameters, '$.endpoint')          AS subscription_endpoint,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE (
        event_source = 'sqs.amazonaws.com'
        AND event_name IN ('SetQueueAttributes', 'AddPermission', 'RemovePermission')
      ) OR (
        event_source = 'sns.amazonaws.com'
        AND event_name IN ('AddPermission', 'RemovePermission',
                           'SetTopicAttributes', 'Subscribe')
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f4f8 EC2 Public Snapshot / AMI Sharing"
  description: "Detects EBS snapshots or AMIs shared publicly (group=all). Enables anyone to copy your disk images and extract data."
  techniques:
    - tid: "T1578.001"
      name: "Modify Cloud Compute Infrastructure: Create Snapshot"
      summary: "Adversaries create and share snapshots to stage data theft."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1578.001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all ModifySnapshotAttribute events where createVolumePermission was
    granted to 'all' (public), and ModifyImageAttribute events where
    launchPermission was granted to 'all'. A public EBS snapshot or AMI allows
    any AWS account to copy the disk image and extract sensitive data.
    Show snapshot/AMI ID, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.snapshotId') AS snapshot_id,
        json_extract_string(request_parameters, '$.imageId')    AS image_id,
        request_parameters,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN ('ModifySnapshotAttribute', 'ModifyImageAttribute')
      AND (
          lower(request_parameters) LIKE '%"group":"all"%'
          OR lower(request_parameters) LIKE '%group=all%'
          OR lower(request_parameters) LIKE '%"all"%'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f4e7 Data Exfiltration Channels"
  description: "Detects high-volume SNS/SQS/SES/S3 PutObject calls (>=50/hour) that may indicate exfiltration."
  techniques:
    - tid: "T1530"
      name: "Data from Cloud Storage"
      summary: "Adversaries collect data from cloud storage services."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1530.html"
    - tid: "T1496.003"
      name: "Resource Hijacking: SMS Pumping"
      summary: "Adversaries abuse SNS SMS sending for revenue-generating message fraud."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.003.html"
  chart:
    type: bar
    x: event_name
    y:
      - call_count
  prompt: |
    Look for potential data exfiltration via messaging/storage services:
    SNS Publish, SQS SendMessage, SES SendEmail, and any PutObject to
    S3 buckets. Focus on high-volume calls from a single identity in a
    short time window. Filter by event_source for sns, sqs, ses, s3.
  sql: |
    SELECT
        user_identity_arn,
        event_source,
        event_name,
        DATE_TRUNC('hour', event_time) AS hour_bucket,
        COUNT(*)                       AS call_count
    FROM cloudtrail_events
    WHERE event_name IN ('Publish', 'SendMessage', 'SendEmail', 'PutObject')
      AND event_source IN (
          'sns.amazonaws.com', 'sqs.amazonaws.com',
          'ses.amazonaws.com', 's3.amazonaws.com'
      )
    GROUP BY user_identity_arn, event_source, event_name, hour_bucket
    HAVING COUNT(*) >= 50
    ORDER BY call_count DESC
    LIMIT 50

- category: "🪣 Data & Storage"
  label: "🔐 S3 SSE-C Encryption (Ransomware)"
  description: "Detects S3 objects re-encrypted with attacker-supplied SSE-C keys, plus bucket default-encryption changes. Without the customer key the victim cannot decrypt — a cloud-native ransomware pattern."
  techniques:
    - tid: "T1486.A001"
      name: "Data Encrypted for Impact: S3 Encryption - SSE-C Key Encryption"
      summary: "Adversaries re-encrypt S3 objects with attacker-supplied SSE-C keys for ransom."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1486.A001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find S3 ransomware indicators: CopyObject or PutObject calls where the
    object is encrypted with a customer-provided key (SSE-C), and
    PutBucketEncryption changes to the bucket default. SSE-C means the key is
    supplied by the caller and never stored by AWS, so an attacker who
    re-encrypts objects with their own key holds the data for ransom. Show the
    bucket, object key, caller, source IP, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.bucketName')          AS bucket_name,
        json_extract_string(request_parameters, '$.key')                 AS object_key,
        json_extract_string(additional_event_data, '$.SSEApplied')       AS sse_applied,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 's3.amazonaws.com'
      AND (
          (event_name IN ('CopyObject', 'PutObject')
           AND (
               json_extract_string(additional_event_data, '$.SSEApplied') = 'SSE_C'
               OR json_extract_string(
                   request_parameters,
                   '$.x-amz-server-side-encryption-customer-algorithm'
               ) IS NOT NULL
           ))
          OR event_name = 'PutBucketEncryption'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "🪣 Data & Storage"
  label: "⏳ S3 Lifecycle-Triggered Deletion"
  description: "Detects S3 lifecycle rules that expire objects, plus lifecycle-config deletion. Attackers set a short expiration to silently purge data over time without issuing DeleteObject calls."
  techniques:
    - tid: "T1485.001"
      name: "Data Destruction: Lifecycle-Triggered Deletion"
      summary: "Adversaries set short S3 lifecycle expiration rules to silently purge data."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find S3 lifecycle changes used for stealthy data destruction:
    PutBucketLifecycle / PutBucketLifecycleConfiguration (especially rules
    with a short Expiration in days) and DeleteBucketLifecycle. A short
    expiration rule causes S3 to delete objects automatically, avoiding the
    DeleteObject bursts that trigger other alerts. Show the bucket, the
    expiration in days, the caller, source IP, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.bucketName')          AS bucket_name,
        json_extract_string(
            request_parameters,
            '$.LifecycleConfiguration.Rule.Expiration.Days'
        )                                                                 AS expiration_days,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 's3.amazonaws.com'
      AND event_name IN (
          'PutBucketLifecycle',
          'PutBucketLifecycleConfiguration',
          'DeleteBucketLifecycle'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "🪣 Data & Storage"
  label: "🗃 RDS Query & Instance Manipulation"
  description: "Detects RDS Data API queries, master-password resets, and snapshot restores. Attackers read data directly, reset credentials to gain access, or restore snapshots into instances they control."
  techniques:
    - tid: "AT1023.001"
      name: "Cloud Database Discovery: Query RDS"
      summary: "Adversaries query RDS databases directly to discover and read data."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/AT1023.001.html"
    - tid: "T1213.A013"
      name: "Data from Information Repositories: RDS Instance Manipulation"
      summary: "Adversaries restore, expose, or reconfigure RDS instances to reach the data inside."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1213.A013.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find RDS discovery and manipulation: rds-data ExecuteStatement /
    BatchExecuteStatement (direct SQL over the Data API), ModifyDBInstance or
    ModifyDBCluster that set masterUserPassword (credential reset for access),
    RestoreDBInstanceFromDBSnapshot / RestoreDBClusterFromSnapshot (restore into
    an attacker-controlled instance), and DownloadDBLogFilePortion. Show the
    event, the target DB identifier, caller, source IP, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        COALESCE(
            json_extract_string(request_parameters, '$.dBInstanceIdentifier'),
            json_extract_string(request_parameters, '$.dBClusterIdentifier'),
            json_extract_string(request_parameters, '$.resourceArn')
        )                                                                 AS db_target,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE
        (event_source = 'rds-data.amazonaws.com'
         AND event_name IN ('ExecuteStatement', 'BatchExecuteStatement'))
        OR (event_source = 'rds.amazonaws.com'
            AND (
                (event_name IN ('ModifyDBInstance', 'ModifyDBCluster')
                 AND json_extract_string(
                     request_parameters, '$.masterUserPassword'
                 ) IS NOT NULL)
                OR event_name IN (
                    'RestoreDBInstanceFromDBSnapshot',
                    'RestoreDBClusterFromSnapshot',
                    'DownloadDBLogFilePortion'
                )
            ))
    ORDER BY event_time DESC
    LIMIT 100

- category: "🪣 Data & Storage"
  label: "🔎 S3 Bucket Enumeration"
  description: "Detects callers sweeping bucket and object metadata (≥10 List/GetBucket* reads in one hour). A common early step to locate valuable data before exfiltration."
  techniques:
    - tid: "T1619.A001"
      name: "Cloud Storage Discovery: S3 Object and Bucket Enumeration"
      summary: "Adversaries enumerate buckets and objects to locate valuable data."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1619.A001.html"
  chart:
    type: bar
    x: user_identity_arn
    y:
      - enum_calls
  prompt: |
    Find identities that made 10 or more S3 enumeration calls in a single hour
    — ListBuckets, ListObjects/ListObjectsV2, GetBucketAcl, GetBucketPolicy,
    GetBucketVersioning, GetBucketLocation, GetBucketEncryption. Bulk metadata
    reads across many buckets indicate an attacker mapping storage before
    stealing data. Show the caller, source IP, hour bucket, number of
    enumeration calls, and number of distinct buckets touched.
  sql: |
    SELECT
        user_identity_arn,
        source_ip_address,
        DATE_TRUNC('hour', event_time)                                   AS hour_bucket,
        COUNT(*)                                                          AS enum_calls,
        COUNT(DISTINCT json_extract_string(request_parameters, '$.bucketName'))
                                                                          AS buckets_touched
    FROM cloudtrail_events
    WHERE event_source = 's3.amazonaws.com'
      AND event_name IN (
          'ListBuckets',        'ListObjects',       'ListObjectsV2',
          'GetBucketAcl',       'GetBucketPolicy',   'GetBucketVersioning',
          'GetBucketLocation',  'GetBucketEncryption', 'GetBucketLogging',
          'GetBucketReplication'
      )
    GROUP BY user_identity_arn, source_ip_address, hour_bucket
    HAVING COUNT(*) >= 10
    ORDER BY enum_calls DESC
    LIMIT 50

- category: "🪣 Data & Storage"
  label: "🔑 Storage Re-Encryption for Impact"
  description: "Detects EBS/RDS snapshots and volumes re-encrypted with an explicit KMS key, plus disabling of default EBS encryption. Re-encrypting with an attacker-held key holds the data for ransom."
  techniques:
    - tid: "T1486.A002"
      name: "Data Encrypted for Impact: EC2/EBS Data Encryption"
      summary: "Adversaries re-encrypt EBS volumes and snapshots with attacker-controlled KMS keys."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1486.A002.html"
    - tid: "T1486.A003"
      name: "Data Encrypted for Impact: RDS Data Encryption"
      summary: "Adversaries re-encrypt RDS data with attacker-controlled KMS keys."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1486.A003.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find storage re-encryption used for ransom: CopySnapshot, CopyImage,
    CreateVolume, or CopyDBSnapshot / CopyDBClusterSnapshot calls that specify
    an explicit kmsKeyId (re-encrypting data under an attacker-controlled key),
    and DisableEbsEncryptionByDefault. Show the event, the KMS key used, the
    source resource, caller, source IP, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.kmsKeyId')            AS kms_key_id,
        COALESCE(
            json_extract_string(request_parameters, '$.sourceSnapshotId'),
            json_extract_string(request_parameters, '$.sourceDBSnapshotIdentifier'),
            json_extract_string(request_parameters, '$.snapshotId')
        )                                                                 AS source_resource,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE
        (event_name IN (
            'CopySnapshot', 'CopyImage', 'CreateVolume',
            'CopyDBSnapshot', 'CopyDBClusterSnapshot'
         )
         AND json_extract_string(request_parameters, '$.kmsKeyId') IS NOT NULL)
        OR event_name = 'DisableEbsEncryptionByDefault'
    ORDER BY event_time DESC
    LIMIT 100

# ===========================================================================
# Compute & Serverless
# ===========================================================================

- category: "\u26a1 Compute & Serverless"
  label: "\U0001f4a5 EC2 Mass Stop / Terminate"
  description: "Detects high-volume EC2 StopInstances/TerminateInstances (>=5 in one hour). Indicates ransomware disruption or destructive attack."
  techniques:
    - tid: "T1578.003"
      name: "Modify Cloud Compute Infrastructure: Delete Cloud Instance"
      summary: "Adversaries terminate instances to destroy evidence or disrupt service."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1578.003.html"
    - tid: "T1485"
      name: "Data Destruction"
      summary: "Adversaries destroy data and backups to cause damage or prevent recovery."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find identities performing 5 or more EC2 StopInstances or TerminateInstances
    calls within a single hour. This pattern indicates a destructive attack:
    ransomware operators stop instances to safely encrypt attached EBS volumes,
    while wipers terminate instances to destroy running workloads.
    Show caller, region, hour bucket, total operation count, and breakdown
    between stop and terminate actions.
  sql: |
    SELECT
        user_identity_arn,
        source_ip_address,
        aws_region,
        DATE_TRUNC('hour', event_time)                                              AS hour_bucket,
        COUNT(*)                                                                     AS instance_ops_count,
        COUNT(*) FILTER (WHERE event_name = 'TerminateInstances')                   AS terminate_count,
        COUNT(*) FILTER (WHERE event_name = 'StopInstances')                        AS stop_count
    FROM cloudtrail_events
    WHERE event_source = 'ec2.amazonaws.com'
      AND event_name IN ('TerminateInstances', 'StopInstances')
    GROUP BY user_identity_arn, source_ip_address, aws_region, hour_bucket
    HAVING COUNT(*) >= 5
    ORDER BY instance_ops_count DESC
    LIMIT 50

- category: "\u26a1 Compute & Serverless"
  label: "\U0001f5a5\ufe0f SSM Session / Run Command"
  description: "Detects SSM StartSession, SendCommand, and automation executions. Primary lateral movement path via managed instances."
  techniques:
    - tid: "T1651"
      name: "Cloud Administration Command"
      summary: "Adversaries execute commands on instances via SSM and other admin channels."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1651.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AWS Systems Manager remote-execution events: StartSession,
    TerminateSession, ResumeSession, SendCommand, and StartAutomationExecution.
    These are the primary lateral movement mechanism for attackers who have
    compromised IAM credentials. Show caller, target instance, document name,
    region, and source IP.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.target')       AS target_instance,
        json_extract_string(request_parameters, '$.documentName') AS document_name,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'ssm.amazonaws.com'
      AND event_name IN (
          'StartSession', 'TerminateSession', 'ResumeSession',
          'SendCommand', 'StartAutomationExecution'
      )
    ORDER BY event_time DESC
    LIMIT 200

- category: "\u26a1 Compute & Serverless"
  label: "\U0001f511 EC2 Instance Connect / Serial Console Access"
  description: "Detects EC2 Instance Connect and Serial Console access, which lets attackers reach an instance from a browser or CLI without an SSH key or bastion host. A primary lateral-movement path for attackers who lack SSH keys."
  techniques:
    - tid: "T1651"
      name: "Cloud Administration Command"
      summary: "Adversaries execute commands on instances via SSM and other admin channels."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1651.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all EC2 Instance Connect and Serial Console access events:
    SendSSHPublicKey (pushes a temporary SSH public key directly to an instance,
    bypassing EC2 key pairs \u2014 valid for 60 seconds),
    SendSerialConsoleSSHPublicKey (serial console access, works even when the
    instance has no network connectivity), and ec2-instance-connect:Connect.
    These methods leave no SSH key artifacts after the session.
    Show instance ID, OS user, caller, source IP, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_arn,
        json_extract_string(request_parameters, '$.instanceId')   AS instance_id,
        json_extract_string(request_parameters, '$.osUser')       AS os_user,
        json_extract_string(request_parameters, '$.serialPort')   AS serial_port,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'ec2-instance-connect.amazonaws.com'
      AND event_name IN (
          'SendSSHPublicKey',
          'SendSerialConsoleSSHPublicKey'
      )
    ORDER BY event_time DESC
    LIMIT 200

- category: "\u26a1 Compute & Serverless"
  label: "\U0001f4dd EC2 User Data Modification"
  description: "Detects ModifyInstanceAttribute calls that change the userData field. User data scripts run as root at next boot, providing a persistent code-execution backdoor."
  techniques:
    - tid: "T1578.005"
      name: "Modify Cloud Compute Infrastructure: Modify Cloud Compute Configurations"
      summary: "Adversaries change compute or network configuration to enable their operations."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1578.005.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all ModifyInstanceAttribute events where the userData attribute was
    changed. EC2 user data is a shell script run as root on every instance boot.
    Modifying user data on a stopped instance and then starting it causes the
    malicious script to execute with full root privileges at boot time.
    Show instance ID, caller, region, and time. Check if the base64-encoded
    user data contains suspicious indicators (curl, wget, reverse shell patterns).
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.instanceId') AS instance_id,
        aws_region,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'ec2.amazonaws.com'
      AND event_name = 'ModifyInstanceAttribute'
      AND request_parameters LIKE '%userData%'
    ORDER BY event_time DESC
    LIMIT 100

- category: "\u26a1 Compute & Serverless"
  label: "\u26a1 Lambda Function Tampering"
  description: "Detects Lambda creation, code updates, and permission changes. Attackers use Lambda for persistence."
  techniques:
    - tid: "T1648"
      name: "Serverless Execution"
      summary: "Adversaries run code through serverless services such as Lambda."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1648.html"
    - tid: "T1648.A001"
      name: "Serverless Execution: Invoking Lambda Function"
      summary: "Adversaries invoke or trigger Lambda functions to execute their code."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1648.A001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find Lambda-related events: CreateFunction, UpdateFunctionCode,
    UpdateFunctionConfiguration, AddPermission, CreateEventSourceMapping.
    Also flag Function URL exposure — CreateFunctionUrlConfig /
    UpdateFunctionUrlConfig, especially with authType=NONE, which turns a
    function into an unauthenticated public HTTP trigger the attacker can invoke
    at will. Attackers may deploy malicious functions for persistence or crypto
    mining. Show caller, function details from request_parameters, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.functionName') AS function_name,
        json_extract_string(request_parameters, '$.runtime')      AS runtime,
        json_extract_string(request_parameters, '$.authType')     AS function_url_auth_type,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'CreateFunction20150331', 'CreateFunction',
        'UpdateFunctionCode20150331v2', 'UpdateFunctionCode',
        'UpdateFunctionConfiguration20150331v2', 'UpdateFunctionConfiguration',
        'AddPermission20150331v2', 'AddPermission',
        'CreateEventSourceMapping',
        'CreateFunctionUrlConfig', 'UpdateFunctionUrlConfig'
    )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\u26a1 Compute & Serverless"
  label: "\U0001f4e6 Lambda Layer Addition"
  description: "Detects Lambda layer publication and permission changes. Publishing a malicious shared layer and adding it to production functions injects attacker code into the dependency chain."
  techniques:
    - tid: "T1648.A002"
      name: "Serverless Execution: Malicious Code from Compromised Third Party Packages"
      summary: "Adversaries inject malicious code through compromised packages, layers, or images."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1648.A002.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all Lambda layer management events: PublishLayerVersion (new or updated
    layer that may contain malicious code), DeleteLayerVersion,
    AddLayerVersionPermission (sharing layer with wildcard principal '*' — public
    supply-chain attack), RemoveLayerVersionPermission.
    Shared Lambda layers are a stealthy persistence vector: once added to a
    function, malicious layer code runs on every invocation.
    Show layer name, version, principal, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.layerName')     AS layer_name,
        json_extract_string(request_parameters, '$.versionNumber') AS version_number,
        json_extract_string(request_parameters, '$.principal')     AS principal,
        aws_region,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'lambda.amazonaws.com'
      AND event_name IN (
          'PublishLayerVersion',        'DeleteLayerVersion',
          'AddLayerVersionPermission',  'RemoveLayerVersionPermission'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "⚡ Compute & Serverless"
  label: "\U0001f4e6 ECS Task Definition"
  description: "Detects ECS task definition registration and service updates. Pacu's ecs__backdoor_task_def registers a new task definition version pointing to a malicious container image, then updates the service to deploy it — all without touching ECR."
  techniques:
    - tid: "T1496.A006"
      name: "Resource Hijacking: Compute Hijacking - ECS"
      summary: "Adversaries deploy attacker containers on ECS for hijacked compute."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.A006.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all ECS task definition and service modification events:
    RegisterTaskDefinition (Pacu backdoors ECS by registering a new task definition
    revision that adds a credential-stealing sidecar container, then updates the
    service to use that revision — no ECR changes are required),
    DeregisterTaskDefinition (removing evidence of the original definition),
    UpdateService (switching to the backdoored task definition revision),
    CreateService (deploying a new rogue service), RunTask / StartTask
    (ad-hoc execution of a malicious task definition).
    Show task family/definition, cluster name, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        COALESCE(
            json_extract_string(request_parameters, '$.family'),
            json_extract_string(request_parameters, '$.taskDefinition')
        )                                                                  AS task_family,
        json_extract_string(request_parameters, '$.cluster')              AS cluster,
        json_extract_string(request_parameters, '$.service')              AS service_name,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'ecs.amazonaws.com'
      AND event_name IN (
          'RegisterTaskDefinition',   'DeregisterTaskDefinition',
          'UpdateService',            'CreateService',            'DeleteService',
          'RunTask',                  'StartTask',                'StopTask'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\u26a1 Compute & Serverless"
  label: "\U0001f464 EC2 Instance Profile Changes"
  description: "Detects IAM instance profile association and replacement. Attaching a privileged profile grants the instance elevated permissions for lateral movement."
  techniques:
    - tid: "T1098.003"
      name: "Account Manipulation: Additional Cloud Roles"
      summary: "Adversaries attach roles or policies to grant themselves elevated permissions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.003.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all EC2 instance profile modification events:
    AssociateIamInstanceProfile, DisassociateIamInstanceProfile, and
    ReplaceIamInstanceProfileAssociation.  Attaching a highly-privileged
    IAM instance profile to a running EC2 instance grants its processes full
    access to AWS APIs, enabling lateral movement without explicit credentials.
    Show instance ID, new profile ARN, caller, and region.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.instanceId')      AS instance_id,
        json_extract_string(request_parameters, '$.iamInstanceProfile') AS iam_profile,
        json_extract_string(request_parameters, '$.associationId')   AS association_id,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'ec2.amazonaws.com'
      AND event_name IN (
          'AssociateIamInstanceProfile',
          'DisassociateIamInstanceProfile',
          'ReplaceIamInstanceProfileAssociation'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\u26a1 Compute & Serverless"
  label: "\U0001f5a5 EC2 Instance Launches"
  description: "Lists all RunInstances events. Unexpected launches in unusual regions may indicate cryptomining."
  techniques:
    - tid: "T1578.002"
      name: "Modify Cloud Compute Infrastructure: Create Cloud Instance"
      summary: "Adversaries launch instances to run their own workloads."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1578.002.html"
    - tid: "T1496.A008"
      name: "Resource Hijacking: Compute Hijacking - EC2 Use"
      summary: "Adversaries launch EC2 capacity for cryptomining or other paid workloads."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.A008.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    List all RunInstances events. Show who launched the instances, when,
    from which IP, and in which region. Flag launches by unexpected users
    or in regions not normally used by this account. Include instance type
    from request_parameters if available.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.instanceType')  AS instance_type,
        json_extract_string(request_parameters, '$.minCount')      AS min_count,
        json_extract_string(request_parameters, '$.maxCount')      AS max_count,
        json_extract_string(request_parameters, '$.keyName')       AS key_name,
        json_extract_string(request_parameters, '$.imageId')       AS ami_id,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_name = 'RunInstances'
    ORDER BY event_time DESC
    LIMIT 100

- category: "\u26a1 Compute & Serverless"
  label: "\U0001f4b0 EC2 Spot Fleet / Reserved Instance Abuse"
  description: "Detects large Spot Fleet requests, Reserved Instance purchases, and Auto Scaling group creation with high capacity. Cryptomining financial-impact indicator."
  techniques:
    - tid: "T1496.A008"
      name: "Resource Hijacking: Compute Hijacking - EC2 Use"
      summary: "Adversaries launch EC2 capacity for cryptomining or other paid workloads."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.A008.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find EC2 resource reservation and auto-scaling events that indicate
    resource hijacking for cryptomining: RequestSpotFleet (bulk cheap GPU/CPU
    capacity), PurchaseReservedInstancesOffering (committing org funds to
    long-term compute), RequestSpotInstances, CreateAutoScalingGroup with
    maxSize > 20 (auto-scaling cryptomining fleet), PutScalingPolicy /
    ExecutePolicy (triggering mass scale-out).
    Show target capacity, instance count, ASG max size, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.spotFleetRequestConfig.targetCapacity') AS spot_target_capacity,
        json_extract_string(request_parameters, '$.instanceCount')                          AS instance_count,
        json_extract_string(request_parameters, '$.autoScalingGroupName')                   AS asg_name,
        json_extract_string(request_parameters, '$.maxSize')                                AS asg_max_size,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE (
        event_source = 'ec2.amazonaws.com'
        AND event_name IN (
            'RequestSpotFleet',                'CancelSpotFleetRequests',
            'RequestSpotInstances',
            'PurchaseReservedInstancesOffering',
            'ModifyReservedInstances'
        )
    ) OR (
        -- Auto Scaling events are emitted from autoscaling.amazonaws.com, not ec2.amazonaws.com
        event_source = 'autoscaling.amazonaws.com'
        AND event_name IN (
            'CreateAutoScalingGroup', 'UpdateAutoScalingGroup',
            'PutScalingPolicy',       'ExecutePolicy'
        )
    )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\u26a1 Compute & Serverless"
  label: "\u2638\ufe0f EKS Cluster API Calls"
  description: "Detects EKS cluster control-plane modifications. Public API server exposure or rogue Fargate profiles enable container platform takeover."
  techniques:
    - tid: "T1190.A020"
      name: "Exploit Public-Facing Application: EKS"
      summary: "Adversaries exploit exposed EKS API endpoints and workloads."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1190.A020.html"
    - tid: "AT1668"
      name: "EKS Modification - Workload Integrity Degradation"
      summary: "Adversaries modify EKS clusters and workloads to run attacker-controlled containers."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/AT1668.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all EKS cluster control-plane modification events: CreateCluster,
    DeleteCluster, UpdateClusterConfig (especially endpointPublicAccess=true),
    CreateNodegroup, DeleteNodegroup, CreateFargateProfile, CreateAddon,
    DeleteAddon, AssociateAccessPolicy, CreateAccessEntry, DeleteAccessEntry.
    Enabling the public API server endpoint or creating rogue Fargate profiles
    gives the attacker persistent execution in the cluster. Show cluster name,
    caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        COALESCE(
            json_extract_string(request_parameters, '$.name'),
            json_extract_string(request_parameters, '$.clusterName')
        ) AS cluster_name,
        aws_region,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'eks.amazonaws.com'
      AND event_name IN (
          'CreateCluster',         'DeleteCluster',         'UpdateClusterConfig',
          'CreateNodegroup',       'DeleteNodegroup',
          'CreateFargateProfile',  'DeleteFargateProfile',
          'CreateAddon',           'DeleteAddon',           'UpdateAddon',
          'AssociateAccessPolicy', 'DisassociateAccessPolicy',
          'CreateAccessEntry',     'DeleteAccessEntry'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\u26a1 Compute & Serverless"
  label: "\U0001f433 ECR Repository / Image Changes"
  description: "Detects ECR repository creation/deletion, policy changes, and image pushes. Injecting malicious images into a production repository is a supply-chain persistence technique."
  techniques:
    - tid: "T1648.A002"
      name: "Serverless Execution: Malicious Code from Compromised Third Party Packages"
      summary: "Adversaries inject malicious code through compromised packages, layers, or images."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1648.A002.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all ECR repository and image modification events: CreateRepository,
    DeleteRepository, PutLifecyclePolicy, DeleteLifecyclePolicy,
    SetRepositoryPolicy (cross-account access), DeleteRepositoryPolicy,
    InitiateLayerUpload, CompleteLayerUpload, PutImage, BatchDeleteImage.
    Pushing a malicious image tagged 'latest' to a production repository
    poisons all subsequent deployments. Show repository name, image tag,
    caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.repositoryName') AS repository_name,
        json_extract_string(request_parameters, '$.imageTag')       AS image_tag,
        aws_region,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'ecr.amazonaws.com'
      AND event_name IN (
          'CreateRepository',     'DeleteRepository',
          'PutLifecyclePolicy',   'DeleteLifecyclePolicy',
          'SetRepositoryPolicy',  'DeleteRepositoryPolicy',
          'InitiateLayerUpload',  'CompleteLayerUpload',
          'PutImage',             'BatchDeleteImage'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\u26a1 Compute & Serverless"
  label: "\U0001f4c5 EventBridge / CloudWatch Rule Changes"
  description: "Detects EventBridge rule and EventBridge Scheduler modifications. Attackers use scheduled rules to establish persistence without a long-running process."
  techniques:
    - tid: "T1648.A001"
      name: "Serverless Execution: Invoking Lambda Function"
      summary: "Adversaries invoke or trigger Lambda functions to execute their code."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1648.A001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all EventBridge rule and EventBridge Scheduler modification events:
    PutRule, DeleteRule, DisableRule, EnableRule, PutTargets, RemoveTargets,
    CreateSchedule, UpdateSchedule, DeleteSchedule.
    Attackers use scheduled rules to execute malicious Lambda functions or SSM
    commands on a recurring basis, achieving persistence without a running process.
    Show rule name, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_arn,
        json_extract_string(request_parameters, '$.name')      AS rule_name,
        aws_region,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source IN ('events.amazonaws.com', 'scheduler.amazonaws.com')
      AND event_name IN (
          'PutRule', 'DeleteRule', 'DisableRule', 'EnableRule',
          'PutTargets', 'RemoveTargets',
          'CreateSchedule', 'UpdateSchedule', 'DeleteSchedule'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "⚡ Compute & Serverless"
  label: "\U0001f4a1 Lightsail Instance & Key Abuse"
  description: "Detects Lightsail instance access, key pair operations, and port exposure. Pacu has three dedicated Lightsail modules (enum, download_ssh_keys, generate_temp_access). Lightsail resources operate outside the standard EC2 security boundary."
  techniques:
    - tid: "T1496.001"
      name: "Resource Hijacking: Compute Hijacking"
      summary: "Adversaries run cryptomining or other workloads at the victim's expense."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all sensitive AWS Lightsail operations:
    GetInstanceAccessDetails (Pacu's lightsail__download_ssh_keys retrieves the
    default SSH key and temporary credentials for any Lightsail instance),
    CreateKeyPair / ImportKeyPair / DownloadDefaultKeyPair (SSH key material
    exfiltration and backdoor creation),
    GetRelationalDatabaseMasterUserPassword (database credential theft),
    OpenInstancePublicPorts (opening ports to 0.0.0.0/0 on the Lightsail firewall),
    CreateInstances (new instance launch for cryptomining or C2),
    ExportSnapshot / CreateInstanceSnapshotFromSnapshot (data exfiltration via snapshot).
    Show instance name, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        COALESCE(
            json_extract_string(request_parameters, '$.instanceName'),
            json_extract_string(request_parameters, '$.relationalDatabaseName'),
            json_extract_string(request_parameters, '$.keyPairName')
        )                                                                AS resource_name,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'lightsail.amazonaws.com'
      AND event_name IN (
          'GetInstanceAccessDetails',
          'CreateKeyPair',                       'ImportKeyPair',
          'DownloadDefaultKeyPair',
          'GetRelationalDatabaseMasterUserPassword',
          'OpenInstancePublicPorts',             'CloseInstancePublicPorts',
          'CreateInstances',                     'DeleteInstance',
          'CreateInstanceSnapshot',              'ExportSnapshot',
          'CreateInstanceFromSnapshot'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "⚡ Compute & Serverless"
  label: "🛰 IMDS Options Weakening"
  description: "Detects ModifyInstanceMetadataOptions calls that make IMDSv2 optional or re-enable the metadata endpoint. Weakening IMDS re-opens the SSRF path to steal instance-role credentials."
  techniques:
    - tid: "T1552.005"
      name: "Unsecured Credentials: Cloud Instance Metadata API"
      summary: "Adversaries steal instance-role credentials via the EC2 instance metadata service."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1552.005.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find ModifyInstanceMetadataOptions calls that weaken IMDS protection:
    HttpTokens set to 'optional' (downgrading from required IMDSv2 to IMDSv1),
    HttpEndpoint set to 'enabled', or a raised HttpPutResponseHopLimit. IMDSv1
    is vulnerable to SSRF-based theft of instance-role credentials, so an
    attacker who can call this API re-opens that path. Show the instance ID,
    the requested token/endpoint/hop-limit values, caller, source IP, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(
            request_parameters,
            '$.ModifyInstanceMetadataOptionsRequest.InstanceId'
        )                                                                 AS instance_id,
        json_extract_string(
            request_parameters,
            '$.ModifyInstanceMetadataOptionsRequest.HttpTokens'
        )                                                                 AS http_tokens,
        json_extract_string(
            request_parameters,
            '$.ModifyInstanceMetadataOptionsRequest.HttpEndpoint'
        )                                                                 AS http_endpoint,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name = 'ModifyInstanceMetadataOptions'
    ORDER BY event_time DESC
    LIMIT 100

- category: "⚡ Compute & Serverless"
  label: "💥 AMI & Snapshot Deletion"
  description: "Detects bulk deregistration of AMIs and deletion of EBS snapshots (≥5 in one hour). Destroying golden images and backups removes recovery options during a destructive attack."
  techniques:
    - tid: "T1485.A002"
      name: "Data Destruction: AMI Image Deletion"
      summary: "Adversaries deregister AMIs and delete snapshots to destroy recovery images."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1485.A002.html"
  chart:
    type: bar
    x: user_identity_arn
    y:
      - delete_count
  prompt: |
    Find identities that deregistered AMIs or deleted EBS snapshots 5 or more
    times within a single hour — DeregisterImage, DeleteSnapshot. Bulk deletion
    of images and snapshots destroys the recovery baseline before or during a
    destructive attack. Show the caller, source IP, hour bucket, number of
    deletions, and the affected image/snapshot IDs.
  sql: |
    SELECT
        user_identity_arn,
        source_ip_address,
        DATE_TRUNC('hour', event_time)                                   AS hour_bucket,
        COUNT(*)                                                          AS delete_count,
        COUNT(DISTINCT COALESCE(
            json_extract_string(request_parameters, '$.snapshotId'),
            json_extract_string(request_parameters, '$.imageId')
        ))                                                                AS resources_affected
    FROM cloudtrail_events
    WHERE event_source = 'ec2.amazonaws.com'
      AND event_name IN ('DeregisterImage', 'DeleteSnapshot')
    GROUP BY user_identity_arn, source_ip_address, hour_bucket
    HAVING COUNT(*) >= 5
    ORDER BY delete_count DESC
    LIMIT 50

# ===========================================================================
# AI & LLM Abuse (LLMjacking — see doc/PLAN_LLMJACKING.md)
# ===========================================================================

- category: "\U0001f916 AI & LLM Abuse"
  label: "\U0001f916 Bedrock Model Invocation Spike"
  description: "Detects principals invoking Bedrock models 50+ times in one hour. High-volume inference on stolen credentials (LLMjacking) can cost the victim tens of thousands of dollars per day."
  techniques:
    - tid: "T1496.A007"
      name: "Resource Hijacking: Cloud Service Hijacking - Bedrock LLM Abuse"
      summary: "Adversaries run LLM inference on Bedrock with stolen credentials (LLMjacking)."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.A007.html"
  chart:
    type: timeseries
    bucket: hour
  prompt: |
    Find principals with a spike in Amazon Bedrock model invocations:
    InvokeModel, InvokeModelWithResponseStream, Converse, ConverseStream
    (event_source bedrock.amazonaws.com), 50 or more calls within any
    1-hour window. Group by caller, hour, and modelId
    (json_extract_string(request_parameters, '$.modelId')).
    This is the core LLMjacking pattern: attackers resell stolen
    inference capacity through reverse proxies at the victim's expense.
  sql: |
    SELECT
        user_identity_arn,
        DATE_TRUNC('hour', event_time)                          AS hour_bucket,
        json_extract_string(request_parameters, '$.modelId')    AS model_id,
        COUNT(*)                                                AS invocation_count,
        COUNT(DISTINCT source_ip_address)                       AS distinct_ips,
        COUNT(DISTINCT aws_region)                              AS distinct_regions
    FROM cloudtrail_events
    WHERE event_source = 'bedrock.amazonaws.com'
      AND event_name IN (
          'InvokeModel', 'InvokeModelWithResponseStream',
          'Converse',    'ConverseStream'
      )
    GROUP BY user_identity_arn, hour_bucket, model_id
    HAVING COUNT(*) >= 50
    ORDER BY invocation_count DESC
    LIMIT 100

- category: "\U0001f916 AI & LLM Abuse"
  label: "\U0001f513 Bedrock Model Access Enablement"
  description: "Detects foundation-model access being enabled or provisioned capacity purchased. In orgs that never adopted Bedrock this is a near-zero-noise LLMjacking indicator — the attacker's canonical first write."
  techniques:
    - tid: "T1496.A007"
      name: "Resource Hijacking: Cloud Service Hijacking - Bedrock LLM Abuse"
      summary: "Adversaries run LLM inference on Bedrock with stolen credentials (LLMjacking)."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.A007.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find Amazon Bedrock model-access enablement events:
    PutUseCaseForModelAccess, PutFoundationModelEntitlement,
    CreateFoundationModelAgreement, PutModelAccessConfig, and
    CreateProvisionedModelThroughput (event_source bedrock.amazonaws.com).
    Attackers with stolen credentials self-enable foundation-model access
    before abusing it (LLMjacking). Show caller, model, region, source IP,
    and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.modelId')   AS model_id,
        source_ip_address,
        aws_region,
        user_agent,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'bedrock.amazonaws.com'
      AND event_name IN (
          'PutUseCaseForModelAccess',      'PutFoundationModelEntitlement',
          'CreateFoundationModelAgreement', 'PutModelAccessConfig',
          'CreateProvisionedModelThroughput'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f916 AI & LLM Abuse"
  label: "\U0001f648 Bedrock Invocation Logging Tampering"
  description: "Detects deletion or modification of Bedrock model-invocation logging, plus attackers checking whether logging is enabled before abusing the account (a documented LLMjacking IOC)."
  techniques:
    - tid: "T1496.A007"
      name: "Resource Hijacking: Cloud Service Hijacking - Bedrock LLM Abuse"
      summary: "Adversaries run LLM inference on Bedrock with stolen credentials (LLMjacking)."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.A007.html"
    - tid: "T1562.008"
      name: "Impair Defenses: Disable Cloud Logs"
      summary: "Adversaries disable or reroute cloud logging to erase evidence of their activity."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.008.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find Amazon Bedrock invocation-logging tampering events:
    DeleteModelInvocationLoggingConfiguration (disabling prompt/usage
    logging), PutModelInvocationLoggingConfiguration (rewriting the config),
    and GetModelInvocationLoggingConfiguration (attackers checking whether
    their prompts are being recorded — a documented LLMjacking indicator).
    Show caller, region, source IP, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        source_ip_address,
        aws_region,
        user_agent,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'bedrock.amazonaws.com'
      AND event_name IN (
          'DeleteModelInvocationLoggingConfiguration',
          'PutModelInvocationLoggingConfiguration',
          'GetModelInvocationLoggingConfiguration'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f916 AI & LLM Abuse"
  label: "\U0001f9ed Bedrock Reconnaissance Sweep"
  description: "Identifies callers enumerating Bedrock models across 2+ regions or with 10+ enumeration calls in one hour. Stolen-key holders sweep regions to find where models are usable."
  techniques:
    - tid: "T1496.A007"
      name: "Resource Hijacking: Cloud Service Hijacking - Bedrock LLM Abuse"
      summary: "Adversaries run LLM inference on Bedrock with stolen credentials (LLMjacking)."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.A007.html"
  chart:
    type: bar
    x: user_identity_arn
    y:
      - recon_calls
      - distinct_regions
  prompt: |
    Identify Amazon Bedrock reconnaissance: callers who executed 10 or more
    enumeration calls (ListFoundationModels, GetFoundationModelAvailability,
    ListProvisionedModelThroughputs, ListInferenceProfiles,
    GetUseCaseForModelAccess) within any 1-hour window, or who enumerated
    across 2 or more regions. Attackers testing stolen keys sweep regions
    to find where Bedrock models are enabled. Show caller, call count,
    distinct regions, and the region list.
  sql: |
    SELECT
        user_identity_arn,
        DATE_TRUNC('hour', event_time)  AS hour_bucket,
        COUNT(*)                        AS recon_calls,
        COUNT(DISTINCT aws_region)      AS distinct_regions,
        array_agg(DISTINCT aws_region)  AS regions,
        array_agg(DISTINCT event_name)  AS api_calls
    FROM cloudtrail_events
    WHERE event_source = 'bedrock.amazonaws.com'
      AND event_name IN (
          'ListFoundationModels',            'GetFoundationModelAvailability',
          'ListProvisionedModelThroughputs', 'ListInferenceProfiles',
          'GetUseCaseForModelAccess',        'ListFoundationModelAgreementOffers'
      )
    GROUP BY user_identity_arn, hour_bucket
    HAVING COUNT(*) >= 10
        OR COUNT(DISTINCT aws_region) >= 2
    ORDER BY recon_calls DESC
    LIMIT 100

- category: "\U0001f916 AI & LLM Abuse"
  label: "⛔ Failed Bedrock Invocations"
  description: "Finds bursts of failed Bedrock invocations (AccessDenied / ValidationException). Stolen-key testing produces failure storms across models and regions before a working combination is found."
  techniques:
    - tid: "T1496.A007"
      name: "Resource Hijacking: Cloud Service Hijacking - Bedrock LLM Abuse"
      summary: "Adversaries run LLM inference on Bedrock with stolen credentials (LLMjacking)."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.A007.html"
  chart:
    type: bar
    x: user_identity_arn
    y:
      - failed_calls
  prompt: |
    Find failed Amazon Bedrock invocation attempts: InvokeModel,
    InvokeModelWithResponseStream, Converse, ConverseStream with a non-null
    error_code (AccessDenied, AccessDeniedException, ValidationException,
    ThrottlingException). Group by caller and error code, and count distinct
    models and regions tried. Bursts of failures indicate an attacker
    probing which models a stolen key can invoke.
  sql: |
    SELECT
        user_identity_arn,
        COUNT(*)                                                       AS failed_calls,
        array_agg(DISTINCT error_code)                                 AS error_codes,
        COUNT(DISTINCT json_extract_string(request_parameters, '$.modelId'))
                                                                       AS models_tried,
        COUNT(DISTINCT aws_region)                                     AS regions_tried,
        MIN(event_time)                                                AS first_seen,
        MAX(event_time)                                                AS last_seen
    FROM cloudtrail_events
    WHERE event_source = 'bedrock.amazonaws.com'
      AND event_name IN (
          'InvokeModel', 'InvokeModelWithResponseStream',
          'Converse',    'ConverseStream'
      )
      AND error_code IS NOT NULL
    GROUP BY user_identity_arn
    HAVING COUNT(*) >= 5
    ORDER BY failed_calls DESC
    LIMIT 100

- category: "\U0001f916 AI & LLM Abuse"
  label: "\U0001f30d Bedrock Callers & Origins"
  description: "Inventories every principal that ever touched Bedrock, with source IP, GeoIP origin, user agent, and model diversity. Spot the caller or origin that has no business using Bedrock at all."
  techniques:
    - tid: "T1496.A007"
      name: "Resource Hijacking: Cloud Service Hijacking - Bedrock LLM Abuse"
      summary: "Adversaries run LLM inference on Bedrock with stolen credentials (LLMjacking)."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.A007.html"
  prompt: |
    Build an inventory of all Amazon Bedrock callers
    (event_source bedrock.amazonaws.com): group by user_identity_arn,
    source_ip_address, geo_country_code, geo_org, and user_agent, with
    total call count, distinct models used, first-seen and last-seen
    timestamps. This baseline lets an analyst spot principals or origins
    (unexpected countries, hosting ASNs, python-requests user agents)
    that have no legitimate reason to use Bedrock.
  sql: |
    SELECT
        user_identity_arn,
        source_ip_address,
        geo_country_code,
        geo_org,
        user_agent,
        COUNT(*)                                                       AS total_calls,
        COUNT(DISTINCT json_extract_string(request_parameters, '$.modelId'))
                                                                       AS distinct_models,
        COUNT(DISTINCT event_name)                                     AS distinct_apis,
        MIN(event_time)                                                AS first_seen,
        MAX(event_time)                                                AS last_seen
    FROM cloudtrail_events
    WHERE event_source = 'bedrock.amazonaws.com'
    GROUP BY user_identity_arn, source_ip_address, geo_country_code,
             geo_org, user_agent
    ORDER BY total_calls DESC
    LIMIT 200

# ===========================================================================
# Network & Infrastructure
# ===========================================================================

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f30d Security Group Opened to Internet"
  description: "Finds security group rules that allow traffic from 0.0.0.0/0. Direct public exposure risk."
  techniques:
    - tid: "T1190.A019"
      name: "Exploit Public-Facing Application: Overly Permissive VPC Security Groups"
      summary: "Overly open security groups expose workloads directly to the internet."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1190.A019.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find security group rules that allow traffic from 0.0.0.0/0 (any IP).
    This includes AuthorizeSecurityGroupIngress and ModifySecurityGroupRules.
    Show the security group ID, caller, region, and full rule parameters.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.groupId') AS security_group_id,
        source_ip_address,
        request_parameters
    FROM cloudtrail_events
    WHERE event_name IN (
        'AuthorizeSecurityGroupIngress',
        'AuthorizeSecurityGroupEgress',
        'ModifySecurityGroupRules'
    )
      AND request_parameters LIKE '%0.0.0.0/0%'
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f525 Security Group Modifications"
  description: "Detects security group rule changes, especially rules allowing 0.0.0.0/0 on any port."
  techniques:
    - tid: "T1562.007"
      name: "Impair Defenses: Disable or Modify Cloud Firewall"
      summary: "Adversaries open or remove cloud firewall rules to enable their own access."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.007.html"
    - tid: "T1190.A019"
      name: "Exploit Public-Facing Application: Overly Permissive VPC Security Groups"
      summary: "Overly open security groups expose workloads directly to the internet."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1190.A019.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all security group changes: AuthorizeSecurityGroupIngress,
    AuthorizeSecurityGroupEgress, RevokeSecurityGroupIngress,
    RevokeSecurityGroupEgress, CreateSecurityGroup, DeleteSecurityGroup.
    Check request_parameters for rules opening 0.0.0.0/0 or port 22/3389.
    Show caller identity, time, and the specific changes made.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.groupId') AS security_group_id,
        source_ip_address,
        request_parameters
    FROM cloudtrail_events
    WHERE event_name IN (
        'AuthorizeSecurityGroupIngress', 'AuthorizeSecurityGroupEgress',
        'RevokeSecurityGroupIngress',    'RevokeSecurityGroupEgress',
        'CreateSecurityGroup',           'DeleteSecurityGroup',
        'ModifySecurityGroupRules'
    )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f30a VPC Flow Log Changes"
  description: "Detects deletion of VPC Flow Logs. Removing flow logs eliminates network-level evidence — a critical defense evasion indicator."
  techniques:
    - tid: "T1562.008"
      name: "Impair Defenses: Disable Cloud Logs"
      summary: "Adversaries disable or reroute cloud logging to erase evidence of their activity."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.008.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all DeleteFlowLogs events (and CreateFlowLogs that may redirect traffic
    to an attacker-controlled bucket). VPC Flow Logs are the primary network
    forensic evidence source; deleting them is a strong defense evasion indicator.
    Show caller, flow log IDs, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        request_parameters,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'ec2.amazonaws.com'
      AND event_name IN ('DeleteFlowLogs', 'CreateFlowLogs')
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f310 CloudFront Distribution Tampering"
  description: "Detects CloudFront distribution creation and origin changes. Modifying origins redirects CDN traffic to attacker-controlled servers for MitM interception or data collection."
  techniques:
    - tid: "T1491.A001"
      name: "Defacement: Subdomain Takeover"
      summary: "Adversaries hijack dangling DNS records and CDN origins to serve their own content."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1491.A001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all CloudFront distribution modification events: CreateDistribution,
    UpdateDistribution (especially origin domain changes — redirects all CDN
    traffic to attacker server), DeleteDistribution, CreateCachePolicy,
    CreateOriginAccessControl / UpdateOriginAccessControl (loosening S3 origin
    access), AssociateAlias (hijacking a domain alias).
    An attacker who modifies a CloudFront origin to point to their own server
    intercepts all end-user traffic passing through the distribution in real time.
    Show distribution ID, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.id')               AS distribution_id,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'cloudfront.amazonaws.com'
      AND event_name IN (
          'CreateDistribution',       'UpdateDistribution',
          'DeleteDistribution',
          'CreateCachePolicy',        'UpdateCachePolicy',
          'CreateOriginAccessControl','UpdateOriginAccessControl',
          'AssociateAlias'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f6e1 Network Firewall / Shield Tampering"
  description: "Detects Network Firewall and Shield protection removal. Deleting network-layer defenses exposes VPCs to direct attack traffic."
  techniques:
    - tid: "T1562.007"
      name: "Impair Defenses: Disable or Modify Cloud Firewall"
      summary: "Adversaries open or remove cloud firewall rules to enable their own access."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.007.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AWS Network Firewall and Shield tampering events:
    DeleteFirewall, DeleteFirewallPolicy, DeleteRuleGroup (removing packet
    inspection rules), DisassociateSubnets (detaching firewall from protected
    subnets), UpdateFirewallPolicy / UpdateRuleGroup (weakening inspection rules),
    Shield DeleteProtection (removing DDoS protection from a resource),
    DisableProactiveEngagement (removing 24/7 Shield Response Team engagement),
    DeleteSubscription (cancelling Shield Advanced).
    Unlike WAF (covered separately), Network Firewall operates at the VPC
    level and its removal exposes entire subnet ranges to attack traffic.
    Show resource name, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.firewallName')          AS firewall_name,
        json_extract_string(request_parameters, '$.firewallPolicyArn')     AS firewall_policy_arn,
        json_extract_string(request_parameters, '$.ruleGroupArn')          AS rule_group_arn,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE (
        event_source = 'network-firewall.amazonaws.com'
        AND event_name IN (
            'DeleteFirewall',       'DeleteFirewallPolicy',
            'DeleteRuleGroup',      'DisassociateSubnets',
            'UpdateFirewallPolicy', 'UpdateRuleGroup'
        )
      ) OR (
        event_source = 'shield.amazonaws.com'
        AND event_name IN (
            'DeleteProtection',          'DisableProactiveEngagement',
            'DeleteSubscription',        'DisassociateDRTLogBucket',
            'DisassociateDRTRole'
        )
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f9f1 Network ACL Changes"
  description: "Detects Network ACL entry creation, deletion, and replacement. NACLs override security groups and can open entire subnets to attackers."
  techniques:
    - tid: "T1562.007"
      name: "Impair Defenses: Disable or Modify Cloud Firewall"
      summary: "Adversaries open or remove cloud firewall rules to enable their own access."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1562.007.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all Network ACL modification events: CreateNetworkAclEntry,
    DeleteNetworkAclEntry, ReplaceNetworkAclEntry, CreateNetworkAcl,
    DeleteNetworkAcl, and ReplaceNetworkAclAssociation.
    NACLs are stateless and apply at the subnet level — attackers use them
    to bypass security group restrictions. Show NACL ID, rule number,
    protocol, action, CIDR block, caller, and region.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.networkAclId') AS nacl_id,
        request_parameters,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'ec2.amazonaws.com'
      AND event_name IN (
          'CreateNetworkAcl',          'DeleteNetworkAcl',
          'CreateNetworkAclEntry',     'DeleteNetworkAclEntry',
          'ReplaceNetworkAclEntry',    'ReplaceNetworkAclAssociation'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f6e3\ufe0f Route Table Changes"
  description: "Detects route table modifications. Adding or replacing routes can redirect traffic to attacker-controlled hosts (MitM, traffic hijacking)."
  techniques:
    - tid: "T1578.005"
      name: "Modify Cloud Compute Infrastructure: Modify Cloud Compute Configurations"
      summary: "Adversaries change compute or network configuration to enable their operations."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1578.005.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all route table modification events: CreateRoute, DeleteRoute,
    ReplaceRoute, CreateRouteTable, DeleteRouteTable, AssociateRouteTable,
    DisassociateRouteTable, and ReplaceRouteTableAssociation.
    Attackers modify routes to redirect traffic to malicious gateways for
    interception or to establish C2 paths. Show route table ID, destination
    CIDR, gateway, caller, and region.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.routeTableId')         AS route_table_id,
        json_extract_string(request_parameters, '$.destinationCidrBlock') AS destination_cidr,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'ec2.amazonaws.com'
      AND event_name IN (
          'CreateRoute',             'DeleteRoute',
          'ReplaceRoute',            'CreateRouteTable',
          'DeleteRouteTable',        'AssociateRouteTable',
          'DisassociateRouteTable',  'ReplaceRouteTableAssociation'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f9f1 VPN / Direct Connect / Transit Gateway"
  description: "Detects new VPN connections, Direct Connect, and Transit Gateway attachments. Attackers create covert network tunnels for persistent C2 or data exfiltration channels."
  techniques:
    - tid: "T1578.005"
      name: "Modify Cloud Compute Infrastructure: Modify Cloud Compute Configurations"
      summary: "Adversaries change compute or network configuration to enable their operations."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1578.005.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all VPN, Direct Connect, and Transit Gateway management events:
    CreateVpnConnection / CreateVpnGateway / CreateCustomerGateway (new
    encrypted tunnel to attacker-controlled network),
    CreateTransitGateway / CreateTransitGatewayAttachment /
    AcceptTransitGatewayVpcAttachment (connecting rogue VPC to organization
    network), DeleteVpnConnection / DeleteTransitGateway (removing evidence).
    These services create persistent Layer-3 network paths that survive
    instance termination and IAM key rotation, providing a durable
    exfiltration channel or C2 communication path.
    Show resource IDs, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.transitGatewayId')         AS tgw_id,
        json_extract_string(request_parameters, '$.vpnConnectionId')           AS vpn_id,
        json_extract_string(request_parameters, '$.connectionId')              AS dx_connection_id,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'ec2.amazonaws.com'
      AND event_name IN (
          'CreateTransitGateway',             'DeleteTransitGateway',
          'CreateTransitGatewayAttachment',   'DeleteTransitGatewayAttachment',
          'AcceptTransitGatewayVpcAttachment',
          'CreateVpnConnection',              'DeleteVpnConnection',
          'CreateVpnGateway',                 'DeleteVpnGateway',
          'CreateCustomerGateway',            'DeleteCustomerGateway'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f4e1 Elastic IP Allocation / Association"
  description: "Detects Elastic IP allocation and association. Attackers assign a fixed public IP to a compromised instance to create stable C2 infrastructure."
  techniques:
    - tid: "T1578.005"
      name: "Modify Cloud Compute Infrastructure: Modify Cloud Compute Configurations"
      summary: "Adversaries change compute or network configuration to enable their operations."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1578.005.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all Elastic IP lifecycle events: AllocateAddress (new fixed public IP),
    AssociateAddress (attach EIP to instance), DisassociateAddress, and
    ReleaseAddress. Attackers assign a static Elastic IP to a compromised or
    newly launched instance to ensure a predictable C2 endpoint that survives
    instance restarts. Show caller, public IP, allocation ID, instance ID,
    region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.domain')       AS domain,
        json_extract_string(request_parameters, '$.allocationId') AS allocation_id,
        json_extract_string(request_parameters, '$.instanceId')   AS instance_id,
        json_extract_string(response_elements,  '$.publicIp')     AS public_ip,
        aws_region,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'ec2.amazonaws.com'
      AND event_name IN (
          'AllocateAddress', 'AssociateAddress',
          'DisassociateAddress', 'ReleaseAddress'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f5dd\ufe0f EC2 Key Pair Creation"
  description: "Detects CreateKeyPair and ImportKeyPair events. Attackers create or import SSH keys as a persistence mechanism to maintain instance access."
  techniques:
    - tid: "T1098.001"
      name: "Account Manipulation: Additional Cloud Credentials"
      summary: "Adversaries add access keys, passwords, or SSH keys to existing identities as a backdoor."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all CreateKeyPair and ImportKeyPair events. Attackers create new EC2
    SSH key pairs or import their own public key to maintain persistent access
    to EC2 instances, even after password/credential rotation.
    Show key name, caller identity, source IP, and region.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.keyName')          AS key_name,
        json_extract_string(response_elements,  '$.keyFingerprint')   AS key_fingerprint,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN ('CreateKeyPair', 'ImportKeyPair')
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f4e1 Network Infrastructure Changes"
  description: "Detects VPC and network-level changes that may establish attacker-controlled infrastructure."
  techniques:
    - tid: "T1578.005"
      name: "Modify Cloud Compute Infrastructure: Modify Cloud Compute Configurations"
      summary: "Adversaries change compute or network configuration to enable their operations."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1578.005.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Detect VPC and network changes: CreateVpc, DeleteVpc, CreateSubnet,
    CreateInternetGateway, AttachInternetGateway, CreateNatGateway,
    CreateVpcPeeringConnection, AcceptVpcPeeringConnection,
    ModifyVpcAttribute. Show caller, region, and parameters.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'CreateVpc', 'DeleteVpc', 'CreateSubnet', 'DeleteSubnet',
        'CreateInternetGateway', 'AttachInternetGateway', 'DetachInternetGateway',
        'CreateNatGateway', 'DeleteNatGateway',
        'CreateVpcPeeringConnection', 'AcceptVpcPeeringConnection',
        'ModifyVpcAttribute'
    )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f3f7 ACM Certificate Operations"
  description: "Detects ACM certificate requests and deletions. Attackers use compromised accounts to issue TLS certificates for attacker-controlled domains to build phishing infrastructure."
  techniques:
    - tid: "T1583.001"
      name: "Acquire Infrastructure: Domains"
      summary: "Adversaries register or manage domains and certificates for attack infrastructure."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1583.001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all ACM certificate lifecycle events: RequestCertificate (especially
    for domains not owned by the organization — phishing or impersonation
    infrastructure), DeleteCertificate (removing evidence or disrupting HTTPS
    services), ImportCertificate (importing attacker-controlled certificates),
    ExportCertificate (exfiltrating private key material).
    A compromised AWS account can issue TLS certificates for arbitrary domain
    names using DNS validation, creating legitimate-looking phishing sites
    backed by certificates from trusted CAs.
    Show domain name, SAN names, validation method, cert ARN, caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.domainName')              AS domain_name,
        json_extract_string(request_parameters, '$.subjectAlternativeNames') AS san_names,
        json_extract_string(request_parameters, '$.certificateArn')          AS cert_arn,
        json_extract_string(request_parameters, '$.validationMethod')        AS validation_method,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'acm.amazonaws.com'
      AND event_name IN (
          'RequestCertificate',
          'DeleteCertificate',
          'ImportCertificate',
          'ExportCertificate'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f511 API Gateway Key Creation & Management"
  description: "Detects API Gateway key creation and REST API management. Pacu's api_gateway__create_api_keys creates persistent API credentials that survive IAM key rotation. Attackers also modify API authorizers to weaken access controls."
  techniques:
    - tid: "AT1667.001"
      name: "Application API Abuse: API Gateway"
      summary: "Adversaries create or modify API Gateway resources for persistent access."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/AT1667.001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all sensitive API Gateway management events:
    CreateApiKey / UpdateApiKey / DeleteApiKey (Pacu's api_gateway__create_api_keys
    generates persistent API keys that bypass IAM-based authentication and
    survive IAM credential rotation — a durable persistence mechanism),
    CreateRestApi / DeleteRestApi (deploying or removing API endpoints),
    CreateAuthorizer / UpdateAuthorizer / DeleteAuthorizer (modifying or
    removing API authorization checks),
    CreateDeployment (deploying configuration changes that may weaken auth),
    UpdateAccount (modifying the CloudWatch role or throttling limits),
    ImportRestApi (importing a pre-configured API that may bypass auth).
    Show API name, key ID, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        COALESCE(
            json_extract_string(request_parameters, '$.name'),
            json_extract_string(request_parameters, '$.keyId'),
            json_extract_string(request_parameters, '$.restApiId')
        )                                                              AS resource_name,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'apigateway.amazonaws.com'
      AND event_name IN (
          'CreateApiKey',       'UpdateApiKey',       'DeleteApiKey',
          'CreateRestApi',      'DeleteRestApi',       'ImportRestApi',
          'CreateAuthorizer',   'UpdateAuthorizer',    'DeleteAuthorizer',
          'CreateDeployment',   'UpdateAccount',
          'CreateUsagePlan',    'DeleteUsagePlan'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f310 Network & Infrastructure"
  label: "\U0001f6a7 VPC Endpoint Access Denied"
  description: "Detects access denied errors via VPC endpoints. May indicate misconfigured endpoint policy."
  techniques:
    - tid: "T1059.009"
      name: "Command and Scripting Interpreter: Cloud API"
      summary: "Adversaries drive the attack through direct AWS API calls and tooling such as Pacu."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1059.009.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find access denied errors that occurred via VPC endpoints. These may
    indicate misconfigured VPC endpoint policies or unauthorized access attempts.
    Show the VPC endpoint ID, service, caller, and error details.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_arn,
        source_ip_address,
        error_code,
        error_message,
        vpc_endpoint_id
    FROM cloudtrail_events
    WHERE error_code IN ('AccessDenied', 'AccessDeniedException')
      AND vpc_endpoint_id IS NOT NULL
    ORDER BY event_time DESC
    LIMIT 100

- category: "⚡ Compute & Serverless"
  label: "🖥 WorkSpaces Hijacking"
  description: "Detects Amazon WorkSpaces provisioning and pool creation. Attackers spin up desktops at the victim's expense, an under-monitored compute-hijacking channel outside the EC2 boundary."
  techniques:
    - tid: "T1496.A009"
      name: "Resource Hijacking: Compute Hijacking - WorkSpaces"
      summary: "Adversaries provision WorkSpaces desktops at the victim's expense."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1496.A009.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find Amazon WorkSpaces provisioning that may indicate compute hijacking:
    CreateWorkspaces, CreateWorkspacesPool, CreateStandbyWorkspaces,
    ModifyWorkspaceProperties, and RebuildWorkspaces. WorkSpaces run outside
    the EC2 security boundary and are rarely monitored, so an attacker can
    provision desktops for hijacked compute. Show the event, the directory ID,
    caller, source IP, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.directoryId')         AS directory_id,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'workspaces.amazonaws.com'
      AND event_name IN (
          'CreateWorkspaces', 'CreateWorkspacesPool', 'CreateStandbyWorkspaces',
          'ModifyWorkspaceProperties', 'RebuildWorkspaces'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "🔑 Identity & Access"
  label: "🎫 Support Case Manipulation"
  description: "Detects AWS Support case closure and comment activity. Attackers resolve abuse/support cases to suppress AWS notifications about a compromise."
  techniques:
    - tid: "T1098.A001"
      name: "Account Manipulation: AWS Support Case Closure"
      summary: "Adversaries resolve AWS abuse/support cases to suppress compromise notifications."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.A001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find AWS Support activity attackers use to hide a compromise: ResolveCase
    (closing an AWS-opened abuse case), AddCommunicationToCase, CreateCase, and
    DescribeCases (monitoring what AWS has flagged). Silencing or watching abuse
    cases lets an attacker keep operating after AWS detects, for example,
    cryptomining or spam. Show the event, the case ID, caller, source IP, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.caseId')             AS case_id,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'support.amazonaws.com'
      AND event_name IN (
          'ResolveCase', 'AddCommunicationToCase', 'CreateCase', 'DescribeCases'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "🔑 Identity & Access"
  label: "🪪 Cognito User Pool Manipulation"
  description: "Detects Cognito user-pool and app-client changes: extended token validity, new clients, and admin user creation. Attackers abuse these to mint long-lived tokens or seed backdoor users."
  techniques:
    - tid: "T1098.A006"
      name: "Account Manipulation: Cognito Refresh Token Abuse"
      summary: "Adversaries abuse Cognito tokens and user-pool settings to keep authenticated access."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.A006.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find Cognito user-pool manipulation used for persistence: UpdateUserPoolClient
    or CreateUserPoolClient (extending refresh/access token validity for
    long-lived tokens), AdminCreateUser and AdminSetUserPassword (seeding a
    backdoor user), and UpdateUserPool. This complements the identity-pool
    unauthenticated-access hunt with the user-pool token-abuse vector. Show the
    event, the user pool ID, caller, source IP, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.userPoolId')          AS user_pool_id,
        json_extract_string(request_parameters, '$.refreshTokenValidity') AS refresh_token_validity,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'cognito-idp.amazonaws.com'
      AND event_name IN (
          'UpdateUserPoolClient', 'CreateUserPoolClient', 'UpdateUserPool',
          'AdminCreateUser', 'AdminSetUserPassword'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "🌐 Network & Infrastructure"
  label: "🌐 Route 53 & Domain Changes"
  description: "Detects DNS record edits, hosted-zone changes, and domain registration/transfer. Attackers redirect traffic, take over dangling subdomains, or register lookalike domains for phishing."
  techniques:
    - tid: "T1583.001"
      name: "Acquire Infrastructure: Domains"
      summary: "Adversaries register or manage domains and certificates for attack infrastructure."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1583.001.html"
    - tid: "T1491.A001"
      name: "Defacement: Subdomain Takeover"
      summary: "Adversaries hijack dangling DNS records and CDN origins to serve their own content."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1491.A001.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find Route 53 and domain changes that enable traffic redirection, subdomain
    takeover, or phishing infrastructure: ChangeResourceRecordSets (DNS record
    edits), CreateHostedZone / DeleteHostedZone, and Route 53 Domains actions
    RegisterDomain, TransferDomain, DisableDomainTransferLock,
    UpdateDomainNameservers. Show the event, the hosted zone or domain name,
    caller, source IP, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        COALESCE(
            json_extract_string(request_parameters, '$.hostedZoneId'),
            json_extract_string(request_parameters, '$.name'),
            json_extract_string(request_parameters, '$.domainName')
        )                                                                 AS dns_target,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source IN ('route53.amazonaws.com', 'route53domains.amazonaws.com')
      AND event_name IN (
          'ChangeResourceRecordSets', 'CreateHostedZone', 'DeleteHostedZone',
          'RegisterDomain', 'TransferDomain', 'DisableDomainTransferLock',
          'UpdateDomainNameservers'
      )
    ORDER BY event_time DESC
    LIMIT 100

# ===========================================================================
# Threat Patterns
# ===========================================================================

- category: "\U0001f575 Threat Patterns"
  label: "\U0001f50d Reconnaissance Pattern"
  description: "Identifies callers who ran 10+ distinct read-only API calls in one hour. Common early attack phase."
  techniques:
    - tid: "T1087.004"
      name: "Account Discovery: Cloud Account"
      summary: "Adversaries enumerate IAM users, roles, and policies to map the account."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1087.004.html"
    - tid: "T1619.A001"
      name: "Cloud Storage Discovery: S3 Object and Bucket Enumeration"
      summary: "Adversaries enumerate buckets and objects to locate valuable data."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1619.A001.html"
  chart:
    type: bar
    x: user_identity_arn
    y:
      - distinct_api_calls
      - total_calls
  prompt: |
    Identify potential reconnaissance: callers who executed 10 or more distinct
    Describe*, List*, or Get* API calls within any 1-hour window.
    This pattern is common in the early stages of an attack.
  sql: |
    SELECT
        user_identity_arn,
        DATE_TRUNC('hour', event_time) AS hour_bucket,
        COUNT(DISTINCT event_name)     AS distinct_api_calls,
        COUNT(*)                       AS total_calls
    FROM cloudtrail_events
    WHERE (
        event_name LIKE 'Describe%'
        OR event_name LIKE 'List%'
        OR event_name LIKE 'Get%'
    )
    GROUP BY user_identity_arn, hour_bucket
    HAVING COUNT(DISTINCT event_name) >= 10
    ORDER BY distinct_api_calls DESC
    LIMIT 50

- category: "\U0001f575 Threat Patterns"
  label: "\U0001f916 Unusual User Agents"
  description: "Lists rare user agents (<5 events). Custom tooling like Pacu or curl may indicate attacker tooling."
  techniques:
    - tid: "T1059.009"
      name: "Command and Scripting Interpreter: Cloud API"
      summary: "Adversaries drive the attack through direct AWS API calls and tooling such as Pacu."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1059.009.html"
  chart:
    type: bar
    x: user_agent
    y:
      - event_count
  prompt: |
    List all distinct user_agent values with their event counts.
    Flag user agents that appear fewer than 5 times — they may indicate
    custom attack tooling (e.g., Pacu, Prowler misuse, or curl/wget).
    Also flag any user_agent containing 'python', 'boto', or 'script'.
  sql: |
    SELECT
        user_agent,
        COUNT(*)                          AS event_count,
        COUNT(DISTINCT user_identity_arn) AS distinct_callers,
        MIN(event_time)                   AS first_seen,
        MAX(event_time)                   AS last_seen
    FROM cloudtrail_events
    WHERE user_agent IS NOT NULL
    GROUP BY user_agent
    HAVING COUNT(*) < 5
        OR lower(user_agent) LIKE '%pacu%'
        OR lower(user_agent) LIKE '%boto%'
        OR lower(user_agent) LIKE '%python%'
        OR lower(user_agent) LIKE '%curl%'
        OR lower(user_agent) LIKE '%wget%'
    ORDER BY event_count ASC
    LIMIT 100

- category: "\U0001f575 Threat Patterns"
  label: "\U0001f30d Multi-Region Activity"
  description: "Detects identities performing writes in 3+ regions in one day. Geographic spread may indicate compromise."
  techniques:
    - tid: "T1535"
      name: "Unused/Unsupported Cloud Regions"
      summary: "Adversaries operate in regions the victim does not monitor."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1535.html"
  chart:
    type: bar
    x: user_identity_arn
    y:
      - distinct_regions
  prompt: |
    Identify user identities (user_identity_arn) that performed write operations
    (read_only = false) in 3 or more distinct aws_region values within the
    same day. Unusual geographic spread may indicate compromised credentials
    being used from multiple attacker locations.
  sql: |
    SELECT
        user_identity_arn,
        CAST(event_time AS DATE)       AS activity_date,
        COUNT(DISTINCT aws_region)     AS distinct_regions,
        array_agg(DISTINCT aws_region) AS regions
    FROM cloudtrail_events
    WHERE read_only = false
      AND user_identity_arn IS NOT NULL
    GROUP BY user_identity_arn, CAST(event_time AS DATE)
    HAVING COUNT(DISTINCT aws_region) >= 3
    ORDER BY distinct_regions DESC
    LIMIT 50

- category: "\U0001f575 Threat Patterns"
  label: "\U0001f575 First-Time API Calls (24h)"
  description: "Finds API calls seen in the last 24h but never before. Novel operations may indicate attacker tooling."
  techniques:
    - tid: "T1059.009"
      name: "Command and Scripting Interpreter: Cloud API"
      summary: "Adversaries drive the attack through direct AWS API calls and tooling such as Pacu."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1059.009.html"
  prompt: |
    Find API calls that appear in the last 24 hours but have never been seen
    before in the entire log dataset. These novel operations may indicate
    attacker reconnaissance or tooling.

- category: "🕵 Threat Patterns"
  label: "🗺 First-Seen Region Activity"
  description: "Finds AWS regions whose first-ever activity falls in the last 24h of the dataset. Operating in a never-before-used region is a classic way to hide cryptomining or staging from region-scoped monitoring."
  techniques:
    - tid: "T1535"
      name: "Unused/Unsupported Cloud Regions"
      summary: "Adversaries operate in regions the victim does not monitor."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1535.html"
  chart:
    type: bar
    x: aws_region
    y:
      - event_count
  prompt: |
    Find AWS regions that were first used only within the last 24 hours of the
    dataset — i.e. a region whose earliest event is recent while the rest of the
    account has a longer history. Attackers use unused regions to run
    cryptomining or stage tooling where region-scoped alarms and dashboards do
    not look. Show the region, its first-seen time, the number of events, and
    the distinct callers and event names.
  sql: |
    WITH region_first_seen AS (
        SELECT
            aws_region,
            MIN(event_time) AS first_seen,
            COUNT(*)        AS event_count,
            COUNT(DISTINCT user_identity_arn) AS distinct_callers,
            COUNT(DISTINCT event_name)        AS distinct_events
        FROM cloudtrail_events
        WHERE aws_region IS NOT NULL
        GROUP BY aws_region
    ),
    dataset_bounds AS (
        SELECT MAX(event_time) AS max_time FROM cloudtrail_events
    )
    SELECT
        r.aws_region,
        r.first_seen,
        r.event_count,
        r.distinct_callers,
        r.distinct_events
    FROM region_first_seen r, dataset_bounds b
    WHERE r.first_seen >= b.max_time - INTERVAL 24 HOUR
    ORDER BY r.first_seen DESC
    LIMIT 50

# ===========================================================================
# Activity & Baseline
# ===========================================================================

- category: "\U0001f4ca Activity & Baseline"
  label: "\U0001f5a5 Write Events from Management Console"
  description: "Identifies mutating API calls made via the AWS console. Useful when CLI-only access is expected."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    List all write (mutating) API calls made via the AWS Management Console.
    These may be unexpected if your environment only uses CLI/SDK access.
    Show caller, service, action, region, and time.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        event_source,
        event_name,
        aws_region,
        source_ip_address,
        user_agent
    FROM cloudtrail_events
    WHERE read_only = false
      AND (
          -- session_credential_from_console is not a standard CloudTrail column.
          -- Detect console-originated calls via additionalEventData or user_agent instead.
          json_extract_string(additional_event_data, '$.credentialId') IS NOT NULL
          OR user_agent LIKE '%console.aws.amazon.com%'
          OR user_agent LIKE '%signin.amazonaws.com%'
      )
    ORDER BY event_time DESC
    LIMIT 200

- category: "\U0001f4ca Activity & Baseline"
  label: "\U0001f50d Events with Errors (24h)"
  description: "Lists all error events in the past 24 hours. Quick overview of what is failing right now."
  chart:
    type: timeseries
    bucket: hour
  prompt: |
    Show all API calls in the past 24 hours that resulted in errors.
    Include caller, service, action, region, error code and message.
    Useful for quickly identifying what is failing or being probed.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        event_source,
        event_name,
        aws_region,
        source_ip_address,
        user_agent,
        error_code,
        error_message
    FROM cloudtrail_events
    WHERE error_code IS NOT NULL
      AND event_time >= NOW() - INTERVAL '24 hours'
    ORDER BY event_time DESC
    LIMIT 200

- category: "\U0001f4ca Activity & Baseline"
  label: "\u274c Error Spike Detection"
  description: "Finds 1-hour windows where error count exceeds the daily average by 3x. Signals scanning or outage."
  prompt: |
    Find time windows (1-hour buckets) where the total number of API errors
    (error_code IS NOT NULL) exceeds the daily average by 3x or more.
    Show the time bucket, error count, top error codes, and the user
    identities generating the most errors.

# ===========================================================================
# GeoIP Analysis
# ===========================================================================

- category: "\U0001f30d GeoIP Analysis"
  label: "\U0001f5fa Console Logins by Country"
  description: "Maps console login events to their geographic origin. Logins from unexpected countries are high-risk."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Show all console login events with their GeoIP information, including
    the newer OAuth2-based sign-in flow (CreateOAuth2Token /
    AuthorizeOAuth2Access) some accounts emit instead of ConsoleLogin.
    Group by country and show success/failure counts. Console logins
    from unexpected countries are a critical indicator of compromise.
  sql: |
    SELECT
        geo_country_code,
        geo_country_name,
        geo_city,
        source_ip_address,
        user_identity_arn,
        CASE
            WHEN json_extract_string(response_elements, '$.ConsoleLogin') IS NOT NULL
                THEN json_extract_string(response_elements, '$.ConsoleLogin')
            WHEN json_extract_string(additional_event_data, '$.success') IS NOT NULL
                THEN json_extract_string(additional_event_data, '$.success')
            ELSE NULL
        END AS login_result,
        event_time,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'signin.amazonaws.com'
      AND event_name IN ('ConsoleLogin', 'CreateOAuth2Token', 'AuthorizeOAuth2Access')
      AND geo_country_code IS NOT NULL
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001f30d GeoIP Analysis"
  label: "\U0001f6a8 Unusual Country Access"
  description: "Detects API calls from unexpected countries by showing rare country/identity combinations."
  chart:
    type: bar
    x: geo_country_code
    y:
      - event_count
  prompt: |
    Find all source IPs from countries other than the expected baseline,
    grouped by user identity ARN. Show event counts and countries.
    Focus on countries with fewer than 10 total events — they are more likely
    to represent attacker infrastructure.
  sql: |
    SELECT
        geo_country_code,
        geo_country_name,
        user_identity_arn,
        source_ip_address,
        COUNT(*)        AS event_count,
        MIN(event_time) AS first_seen,
        MAX(event_time) AS last_seen
    FROM cloudtrail_events
    WHERE geo_country_code IS NOT NULL
      AND geo_country_code NOT IN ('PRIVATE', 'LOOPBACK', 'LINK-LOCAL', 'SPECIAL')
    GROUP BY geo_country_code, geo_country_name, user_identity_arn, source_ip_address
    HAVING COUNT(*) < 10
    ORDER BY event_count ASC
    LIMIT 100

- category: "\U0001f30d GeoIP Analysis"
  label: "\U0001f6ab Access Denied by Country"
  description: "Groups access denied errors by source country. Concentrated denials from one country may signal an attack."
  chart:
    type: bar
    x: geo_country_name
    y:
      - denied_count
  prompt: |
    Show access denied errors grouped by source country. Concentrated
    denials from a single foreign country may indicate a credential
    stuffing or brute force attack from that region.
  sql: |
    SELECT
        geo_country_code,
        geo_country_name,
        COUNT(*)                            AS denied_count,
        COUNT(DISTINCT source_ip_address)   AS unique_ips,
        COUNT(DISTINCT user_identity_arn)   AS unique_identities,
        MIN(event_time)                     AS first_seen,
        MAX(event_time)                     AS last_seen
    FROM cloudtrail_events
    WHERE error_code IN ('AccessDenied', 'AccessDeniedException', 'UnauthorizedAccess')
      AND geo_country_code IS NOT NULL
      AND geo_country_code NOT IN ('PRIVATE', 'LOOPBACK', 'LINK-LOCAL', 'SPECIAL')
    GROUP BY geo_country_code, geo_country_name
    ORDER BY denied_count DESC
    LIMIT 20

- category: "\U0001f30d GeoIP Analysis"
  label: "\U0001f50d Write Events by Country"
  description: "Shows mutating (write) API calls grouped by country. Writes from unexpected countries are high-priority."
  chart:
    type: bar
    x: geo_country_name
    y:
      - write_events
      - unique_callers
  prompt: |
    Show all write (mutating) API calls grouped by source country.
    Writes from unexpected countries are a stronger signal than reads.
    Include event counts, unique callers, and top event names per country.
  sql: |
    SELECT
        geo_country_code,
        geo_country_name,
        COUNT(*)                            AS write_events,
        COUNT(DISTINCT user_identity_arn)   AS unique_callers,
        COUNT(DISTINCT event_name)          AS distinct_apis,
        array_agg(DISTINCT event_name ORDER BY event_name)[:5] AS sample_apis
    FROM cloudtrail_events
    WHERE read_only = false
      AND geo_country_code IS NOT NULL
      AND geo_country_code NOT IN ('PRIVATE', 'LOOPBACK', 'LINK-LOCAL', 'SPECIAL')
    GROUP BY geo_country_code, geo_country_name
    ORDER BY write_events DESC
    LIMIT 20

- category: "\U0001f30d GeoIP Analysis"
  label: "\U0001f30d Top Source Countries"
  description: "Ranks source countries by API call volume. Identifies the geographic distribution of all activity."
  chart:
    type: bar
    x: geo_country_name
    y:
      - event_count
      - write_events
  prompt: |
    Rank source countries by API call volume using the geo_country_code and
    geo_country_name columns. Show event count and unique IP count per country.
    Exclude private/loopback/link-local IPs.
  sql: |
    SELECT
        geo_country_code,
        geo_country_name,
        COUNT(*)                            AS event_count,
        COUNT(DISTINCT source_ip_address)   AS unique_ips,
        COUNT(DISTINCT user_identity_arn)   AS unique_identities,
        COUNT(*) FILTER (WHERE read_only = false) AS write_events
    FROM cloudtrail_events
    WHERE geo_country_code IS NOT NULL
      AND geo_country_code NOT IN ('PRIVATE', 'LOOPBACK', 'LINK-LOCAL', 'SPECIAL')
    GROUP BY geo_country_code, geo_country_name
    ORDER BY event_count DESC
    LIMIT 20

- category: "\U0001f30d GeoIP Analysis"
  label: "\U0001f3e2 Top ASN / Organizations"
  description: "Lists autonomous systems (ISPs/cloud providers) by API call volume. Spot VPN/hosting providers."
  chart:
    type: bar
    x: geo_org
    y:
      - event_count
  prompt: |
    Show the top ASN organizations making API calls. Cloud provider ASNs
    (AWS, GCP, Azure) are expected, but VPN/hosting providers may indicate
    attacker infrastructure.
  sql: |
    SELECT
        geo_asn,
        geo_org,
        geo_country_code,
        COUNT(*)                            AS event_count,
        COUNT(DISTINCT source_ip_address)   AS unique_ips,
        COUNT(DISTINCT user_identity_arn)   AS unique_identities
    FROM cloudtrail_events
    WHERE geo_asn IS NOT NULL
    GROUP BY geo_asn, geo_org, geo_country_code
    ORDER BY event_count DESC
    LIMIT 30

- category: "\U0001f30d GeoIP Analysis"
  label: "\U0001f4cd Top Source Cities"
  description: "Ranks source cities by event volume. Pinpoints the most active geographic origins."
  chart:
    type: bar
    x: geo_city
    y:
      - event_count
  prompt: |
    Rank source cities by API call volume. Show country, city, event count,
    and unique IPs. City-level data can help identify specific attacker
    infrastructure or corporate office locations.
  sql: |
    SELECT
        geo_country_code,
        geo_city,
        COUNT(*)                            AS event_count,
        COUNT(DISTINCT source_ip_address)   AS unique_ips,
        COUNT(DISTINCT user_identity_arn)   AS unique_callers
    FROM cloudtrail_events
    WHERE geo_city IS NOT NULL
      AND geo_country_code NOT IN ('PRIVATE', 'LOOPBACK', 'LINK-LOCAL', 'SPECIAL')
    GROUP BY geo_country_code, geo_city
    ORDER BY event_count DESC
    LIMIT 30

- category: "\U0001f30d GeoIP Analysis"
  label: "\U0001f4cb API Calls by Country (Event Name)"
  description: "Shows which API operations are called from each country. Write events from unexpected countries indicate credential compromise."
  chart:
    type: bar
    x: geo_country_name
    y:
      - event_count
      - write_count
  prompt: |
    Show the top (event_name, country) pairs by API call volume.
    Include write event count and unique caller count per pair.
    Focus on write operations from countries not normally associated
    with the organisation's operations — these are high-confidence
    indicators of credential compromise.
  sql: |
    SELECT
        event_name,
        geo_country_name,
        geo_country_code,
        COUNT(*)                            AS event_count,
        COUNT(CASE WHEN read_only = false THEN 1 END) AS write_count,
        COUNT(DISTINCT user_identity_arn)   AS unique_callers
    FROM cloudtrail_events
    WHERE geo_country_code IS NOT NULL
      AND geo_country_code NOT IN ('PRIVATE', 'LOOPBACK', 'LINK-LOCAL', 'SPECIAL')
    GROUP BY event_name, geo_country_name, geo_country_code
    ORDER BY event_count DESC
    LIMIT 50

- category: "\U0001f30d GeoIP Analysis"
  label: "\U0001f464 Identities by Country (user_identity_arn)"
  description: "Shows which IAM identities are active from each country. An identity appearing from a new country is a high-confidence compromise indicator."
  chart:
    type: bar
    x: geo_country_name
    y:
      - event_count
      - write_count
  prompt: |
    Show the top (user_identity_arn, country) pairs by API call volume.
    Include write event count and distinct API count per pair.
    An IAM identity that suddenly appears from a foreign country —
    especially performing write operations — is a strong signal of
    compromised credentials or unauthorised access.
  sql: |
    SELECT
        user_identity_arn,
        geo_country_name,
        geo_country_code,
        COUNT(*)                            AS event_count,
        COUNT(CASE WHEN read_only = false THEN 1 END) AS write_count,
        COUNT(DISTINCT event_name)          AS distinct_apis,
        MIN(event_time)                     AS first_seen,
        MAX(event_time)                     AS last_seen
    FROM cloudtrail_events
    WHERE geo_country_code IS NOT NULL
      AND geo_country_code NOT IN ('PRIVATE', 'LOOPBACK', 'LINK-LOCAL', 'SPECIAL')
    GROUP BY user_identity_arn, geo_country_name, geo_country_code
    ORDER BY event_count DESC
    LIMIT 50

- category: "\U0001f30d GeoIP Analysis"
  label: "\U0001f310 Private / Internal IP Summary"
  description: "Summarizes events from private, loopback, and AWS-internal IPs. Baseline for expected internal traffic."
  chart:
    type: bar
    x: ip_type
    y:
      - event_count
  prompt: |
    Summarize events originating from private IPs, loopback, and link-local
    addresses. These represent internal AWS traffic and should dominate
    the baseline. Show breakdown by IP type marker and top callers.
  sql: |
    SELECT
        geo_country_code                    AS ip_type,
        COUNT(*)                            AS event_count,
        COUNT(DISTINCT source_ip_address)   AS unique_ips,
        COUNT(DISTINCT user_identity_arn)   AS unique_identities,
        COUNT(DISTINCT event_name)          AS distinct_apis
    FROM cloudtrail_events
    WHERE geo_country_code IN ('PRIVATE', 'LOOPBACK', 'LINK-LOCAL', 'SPECIAL')
    GROUP BY geo_country_code
    ORDER BY event_count DESC

# ===========================================================================
# IaC & Platform
# ===========================================================================

- category: "\u2601 IaC & Platform"
  label: "\U0001f6e0 CodeBuild / CodePipeline Supply Chain Attack"
  description: "Detects CI/CD pipeline creation and modification. Injecting malicious build steps or modifying pipeline sources poisons all subsequent deployments."
  techniques:
    - tid: "T1648.A002"
      name: "Serverless Execution: Malicious Code from Compromised Third Party Packages"
      summary: "Adversaries inject malicious code through compromised packages, layers, or images."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1648.A002.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all CI/CD pipeline tampering events: CodeBuild UpdateProject
    (changing build environment image or commands — injects malicious build
    steps into every subsequent build), CreateProject, StartBuild (unusual
    caller triggering a build), CodePipeline CreatePipeline / UpdatePipeline
    (modifying source stage to pull from attacker repo),
    StartPipelineExecution, CodeDeploy CreateDeploymentGroup /
    UpdateDeploymentGroup (redirecting deployments), CreateDeployment,
    CodeStar Connections CreateConnection / UpdateConnection (linking
    attacker-controlled GitHub/GitLab repo).
    Show resource name, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_arn,
        aws_region,
        COALESCE(
            json_extract_string(request_parameters, '$.projectName'),
            json_extract_string(request_parameters, '$.name'),
            json_extract_string(request_parameters, '$.pipelineName'),
            json_extract_string(request_parameters, '$.applicationName')
        )                                                               AS resource_name,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source IN (
        'codebuild.amazonaws.com',
        'codepipeline.amazonaws.com',
        'codedeploy.amazonaws.com',
        'codestar-connections.amazonaws.com'
      )
      AND event_name IN (
          'CreateProject',          'UpdateProject',            'StartBuild',
          'BatchDeleteBuilds',      'DeleteProject',
          'CreatePipeline',         'UpdatePipeline',           'StartPipelineExecution',
          'DeletePipeline',
          'CreateDeploymentGroup',  'UpdateDeploymentGroup',    'CreateDeployment',
          'DeleteDeploymentGroup',
          'CreateConnection',       'UpdateConnection',         'DeleteConnection'
      )
    ORDER BY event_time DESC
    LIMIT 200

- category: "\u2601 IaC & Platform"
  label: "\U0001f3d7 CloudFormation / IaC Abuse"
  description: "Detects CloudFormation stack operations. Attackers may use IaC to rapidly deploy malicious infrastructure."
  techniques:
    - tid: "T1098.003"
      name: "Account Manipulation: Additional Cloud Roles"
      summary: "Adversaries attach roles or policies to grant themselves elevated permissions."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1098.003.html"
    - tid: "T1578.002"
      name: "Modify Cloud Compute Infrastructure: Create Cloud Instance"
      summary: "Adversaries launch instances to run their own workloads."
      url: "https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1578.002.html"
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find CloudFormation stack operations: CreateStack, UpdateStack,
    DeleteStack, CreateChangeSet. Attackers may use IaC to rapidly deploy
    malicious infrastructure. Show stack name from request_parameters,
    caller identity, and whether the operation succeeded or failed.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.stackName') AS stack_name,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'CreateStack', 'UpdateStack', 'DeleteStack',
        'CreateChangeSet', 'ExecuteChangeSet'
    )
    ORDER BY event_time DESC
    LIMIT 100
