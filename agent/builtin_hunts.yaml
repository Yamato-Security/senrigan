# IaC & Platform
# ===========================================================================

- category: "\u2601 IaC & Platform"
  label: "\U0001f3d7 CloudFormation / IaC Abuse"
  description: "Detects CloudFormation stack operations. Attackers may use IaC to rapidly deploy malicious infrastructure."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find CloudFormation stack operations: CreateStack, UpdateStack,
    DeleteStack, CreateChangeSet. Attackers may use IaC to rapidly deploy
    malicious infrastructure. Show stack name from request_parameters,
    caller identity, and whether the operation succeeded or failed.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        json_extract_string(request_parameters, '$.stackName') AS stack_name,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_name IN (
        'CreateStack', 'UpdateStack', 'DeleteStack',
        'CreateChangeSet', 'ExecuteChangeSet'
    )
    ORDER BY event_time DESC
    LIMIT 100

# ===========================================================================
# Identity & Access — DFIR追加 (NEW-02)
# ===========================================================================

- category: "\U0001f511 Identity & Access"
  label: "\U0001f3af IAM PassRole Abuse"
  description: "Detects iam:PassRole calls. Passing a privileged role to EC2/Lambda/Glue/ECS/SageMaker is the most common lateral privilege escalation path."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all iam:PassRole events. Attackers with iam:PassRole permission assign
    a highly privileged role to a compute service (EC2, Lambda, Glue, ECS,
    SageMaker) they control, gaining all permissions of that role without
    directly possessing those permissions themselves.
    Show caller, role name/ARN, target service context, source IP, and time.
  sql: |
    SELECT
        event_time,
        user_identity_arn,
        json_extract_string(request_parameters, '$.roleName')        AS role_name,
        json_extract_string(request_parameters, '$.roleArn')         AS role_arn,
        json_extract_string(request_parameters, '$.functionName')    AS lambda_function,
        json_extract_string(request_parameters, '$.instanceId')      AS ec2_instance,
        source_ip_address,
        aws_region,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'iam.amazonaws.com'
      AND event_name = 'PassRole'
    ORDER BY event_time DESC
    LIMIT 100

# ===========================================================================
# Detection & Response — DFIR追加 (NEW-07)
# ===========================================================================

- category: "\U0001f6e1 Detection & Response"
  label: "\U0001f6ab AWS Macie Tampering"
  description: "Detects Macie disable and finding-filter creation. Attackers suppress Macie findings before exfiltrating sensitive data from S3."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AWS Macie tampering events: DisableMacie (complete shutdown),
    CreateFindingsFilter / UpdateFindingsFilter (suppressing sensitive-data
    findings before exfiltration), DisableOrganizationAdminAccount,
    UpdateMacieSession (reducing scan scope), CreateClassificationJob
    (attacker-initiated data discovery on victim buckets).
    Macie is the primary sensitive-data detection layer; disabling it or
    creating suppression filters is a pre-exfiltration defense-evasion step.
    Show event name, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.id')               AS job_or_filter_id,
        json_extract_string(request_parameters, '$.name')             AS resource_name,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'macie2.amazonaws.com'
      AND event_name IN (
          'DisableMacie',
          'CreateFindingsFilter',         'UpdateFindingsFilter',
          'DeleteFindingsFilter',
          'DisableOrganizationAdminAccount',
          'UpdateMacieSession',
          'CreateClassificationJob',
          'UpdateClassificationJob'
      )
    ORDER BY event_time DESC
    LIMIT 100

# ===========================================================================
# Data & Storage — DFIR追加 (NEW-01, NEW-04, NEW-05, NEW-06, NEW-09, NEW-12)
# ===========================================================================

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f525 AWS Backup Tampering"
  description: "Detects Backup Vault/Plan/RecoveryPoint deletion. Destroying backups is the first step in ransomware attacks to prevent recovery."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all AWS Backup tampering events: DeleteBackupVault,
    DeleteBackupPlan, DeleteRecoveryPoint, DeleteBackupSelection,
    DisassociateRecoveryPoint, PutBackupVaultAccessPolicy (cross-account
    access to exfiltrate backups), DeleteBackupVaultLockConfiguration
    (removing immutable backup lock).
    Ransomware operators delete all backup copies before encrypting primary data
    to prevent recovery. Any backup vault or recovery-point deletion outside a
    sanctioned maintenance window is a critical incident indicator.
    Show vault/plan name, recovery point ARN, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.backupVaultName')     AS vault_name,
        json_extract_string(request_parameters, '$.backupPlanId')        AS plan_id,
        json_extract_string(request_parameters, '$.recoveryPointArn')    AS recovery_point_arn,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'backup.amazonaws.com'
      AND event_name IN (
          'DeleteBackupVault',             'DeleteBackupPlan',
          'DeleteRecoveryPoint',           'DeleteBackupSelection',
          'DisassociateRecoveryPoint',     'PutBackupVaultAccessPolicy',
          'DeleteBackupVaultLockConfiguration'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f4a3 S3 Bulk Object Deletion"
  description: "Detects high-volume DeleteObject/DeleteObjects calls (>=50/hour). Distinct from exfiltration — this is data destruction / ransomware pattern."
  chart:
    type: bar
    x: user_identity_arn
    y:
      - delete_count
  prompt: |
    Find identities performing 50 or more S3 DeleteObject or DeleteObjects
    calls within a single hour. This is the primary data-destruction pattern
    for ransomware and wiper attacks — distinct from the GetObject exfiltration
    pattern already monitored. Show caller, source IP, hour bucket,
    number of delete operations, and number of affected buckets.
  sql: |
    SELECT
        user_identity_arn,
        source_ip_address,
        DATE_TRUNC('hour', event_time)                                   AS hour_bucket,
        COUNT(*)                                                          AS delete_count,
        COUNT(DISTINCT json_extract_string(request_parameters, '$.bucketName'))
                                                                          AS buckets_affected
    FROM cloudtrail_events
    WHERE event_source = 's3.amazonaws.com'
      AND event_name IN ('DeleteObject', 'DeleteObjects')
    GROUP BY user_identity_arn, source_ip_address, hour_bucket
    HAVING COUNT(*) >= 50
    ORDER BY delete_count DESC
    LIMIT 50

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f5c4 DynamoDB Export / Bulk Exfiltration"
  description: "Detects DynamoDB ExportTableToPointInTime (silent full-table export to S3) and table deletion. High-risk exfiltration and destruction vector."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all DynamoDB data-exfiltration and destruction events:
    ExportTableToPointInTime (exports entire table to any S3 bucket — including
    attacker-controlled ones — without generating GetItem events),
    DeleteTable (data destruction), CreateGlobalTable (replicating data to
    attacker region), UpdateContinuousBackups (disabling PITR to prevent recovery).
    DynamoDB exports bypass S3/network-based DLP because the data moves
    server-side. Show table name, export destination bucket, caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.tableName')         AS table_name,
        json_extract_string(request_parameters, '$.s3Bucket')          AS export_s3_bucket,
        json_extract_string(request_parameters, '$.s3BucketOwner')     AS s3_bucket_owner,
        json_extract_string(request_parameters, '$.exportFormat')      AS export_format,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'dynamodb.amazonaws.com'
      AND event_name IN (
          'ExportTableToPointInTime',
          'DeleteTable',
          'CreateGlobalTable',
          'UpdateContinuousBackups'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f30a Kinesis Firehose / Stream Exfiltration Channel"
  description: "Detects Kinesis Firehose delivery stream creation/update pointing to external S3. Real-time data pipeline exfiltration invisible to network DLP."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find all Kinesis Data Firehose and Kinesis Data Streams management events:
    CreateDeliveryStream (new pipeline — check for external S3 bucket owner),
    UpdateDestination (redirecting existing stream to attacker S3),
    DeleteDeliveryStream, StopStreamEncryption (weakening stream protection),
    CreateStream (new stream for attacker data collection).
    A Firehose delivery stream configured to an attacker-controlled S3 bucket
    creates a real-time data pipeline that bypasses all network-level DLP.
    Show stream name, destination bucket, caller, region, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.deliveryStreamName') AS stream_name,
        json_extract_string(request_parameters, '$.streamName')         AS kinesis_stream,
        request_parameters,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source IN (
        'firehose.amazonaws.com',
        'kinesis.amazonaws.com'
      )
      AND event_name IN (
          'CreateDeliveryStream',    'UpdateDestination',       'DeleteDeliveryStream',
          'CreateStream',            'StopStreamEncryption',
          'MergeShards',             'SplitShard'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f5dd Secrets Manager Deletion & Cross-Account Policy"
  description: "Detects Secrets Manager secret deletion and cross-account resource policy changes. Complements existing bulk-read detection with destruction and policy-exfiltration vectors."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find Secrets Manager events beyond bulk reads: DeleteSecret (immediate or
    scheduled destruction of credentials), PutResourcePolicy (granting secret
    access to external AWS accounts — a silent exfiltration of credentials),
    DeleteResourcePolicy, RestoreSecret (an attacker restoring a secret they
    deleted to cover tracks), CancelRotateSecret (freezing rotation to preserve
    a known credential).
    These complement the existing bulk GetSecretValue detection by covering
    the destruction and cross-account-sharing exfiltration paths.
    Show secret ID, recovery window, resource policy, caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        user_identity_arn,
        aws_region,
        json_extract_string(request_parameters, '$.secretId')             AS secret_id,
        json_extract_string(request_parameters, '$.recoveryWindowInDays') AS recovery_window_days,
        json_extract_string(request_parameters, '$.resourcePolicy')       AS resource_policy,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE event_source = 'secretsmanager.amazonaws.com'
      AND event_name IN (
          'DeleteSecret',
          'PutResourcePolicy',       'DeleteResourcePolicy',
          'RemoveRegionsFromReplication',
          'ReplicateSecretToRegions',
          'CancelRotateSecret'
      )
    ORDER BY event_time DESC
    LIMIT 100

- category: "\U0001faa3 Data & Storage"
  label: "\U0001f4e1 SQS / SNS Cross-Account Policy Changes"
  description: "Detects SQS/SNS queue/topic policy changes that grant access to external accounts. Creates a silent exfiltration channel without triggering high-volume send alerts."
  chart:
    type: timeseries
    bucket: day
  prompt: |
    Find SQS and SNS permission changes that may grant external accounts
    access to receive messages: SQS SetQueueAttributes (changing queue policy
    to allow external sqs:ReceiveMessage), SQS AddPermission / RemovePermission,
    SNS AddPermission / RemovePermission, SNS SetTopicAttributes,
    SNS Subscribe (subscribing an attacker-controlled HTTP endpoint or
    cross-account SQS queue).
    Unlike high-volume send monitoring, this detects the configuration step
    that enables silent data streaming to attacker-controlled endpoints.
    Show resource ARN, granted account, permission label, caller, and time.
  sql: |
    SELECT
        event_time,
        event_name,
        event_source,
        user_identity_arn,
        aws_region,
        COALESCE(
            json_extract_string(request_parameters, '$.queueUrl'),
            json_extract_string(request_parameters, '$.topicArn')
        )                                                               AS resource_arn,
        json_extract_string(request_parameters, '$.label')             AS permission_label,
        json_extract_string(request_parameters, '$.awsAccountId')      AS granted_account_id,
        json_extract_string(request_parameters, '$.endpoint')          AS subscription_endpoint,
        source_ip_address,
        error_code
    FROM cloudtrail_events
    WHERE (
        event_source = 'sqs.amazonaws.com'
        AND event_name IN ('SetQueueAttributes', 'AddPermission', 'RemovePermission')
      ) OR (
        event_source = 'sns.amazonaws.com'
        AND event_name IN ('AddPermission', 'RemovePermission',
                           'SetTopicAttributes', 'Subscribe')
      )
    ORDER BY event_time DESC
    LIMIT 100

