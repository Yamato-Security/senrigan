version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current with automated bump PRs so that
  # pinning to immutable commits does not leave the workflows stuck on old,
  # potentially vulnerable action versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  # Track the Dockerfile base images too. Without this, tag and digest pins
  # silently go stale — the node digest in config_viz/Dockerfile drifted a full
  # patch release behind before anyone noticed.
  - package-ecosystem: "docker"
    directories:
      - "/ingester"
      - "/agent"
      - "/config_viz"
      - "/dashboard"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
