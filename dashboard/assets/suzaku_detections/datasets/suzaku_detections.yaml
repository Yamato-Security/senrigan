metrics:
  - metric_name: count
    verbose_name: "Count"
    metric_type: count
    expression: "COUNT(*)"
    description: "Number of detections"

  - metric_name: detections
    verbose_name: "Detections"
    metric_type: count
    expression: "COUNT(*)"
    description: "Number of Suzaku detections"

  - metric_name: critical_high
    verbose_name: "Critical + High"
    metric_type: count
    expression: "COUNT(*) FILTER (WHERE level_rank >= 4)"
    description: "Detections at level critical or high"

  - metric_name: distinct_rules
    verbose_name: "Distinct Rules"
    metric_type: count_distinct
    expression: "COUNT(DISTINCT rule_title)"
    description: "Number of distinct Sigma rules"

  - metric_name: distinct_principals
    verbose_name: "Distinct Principals"
    metric_type: count_distinct
    expression: "COUNT(DISTINCT COALESCE(user_arn, user_name))"
    description: "Number of distinct identities"

  - metric_name: distinct_ips
    verbose_name: "Distinct Source IPs"
    metric_type: count_distinct
    expression: "COUNT(DISTINCT source_ip)"
    description: "Number of distinct source IP addresses"

  - metric_name: max_severity_rank
    verbose_name: "Max Severity Rank"
    metric_type: max
    expression: "MAX(level_rank)"
    description: "Worst severity reached"
