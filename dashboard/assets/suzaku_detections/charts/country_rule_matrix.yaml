# SZK-42: Country × Rule
# Which detections came from where, with the identity attached.
# Reads directly as 'this rule fired for this user from this country'.
# Geo columns are populated only when Suzaku was run with --geo-ip <maxmind-db-dir>; otherwise this chart shows 'No data'.
uuid: 5a42c3d4-e5f6-7890-abcd-ef0123450042
version: 1.0.0
dataset_uuid: 7c1f9d2a-6b35-4e88-9a10-0d5f3b7e4c21
slice_name: Country × Rule
viz_type: table
description: >
  Every country/rule pair with the principals involved and the time window
  (SZK-42). The geographic equivalent of SZK-31: it states which detection
  came from which country, for which identity, and when. Geo columns are
  populated only when Suzaku was run with --geo-ip <maxmind-db-dir>; otherwise
  this chart shows 'No data'.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: COUNT(*)
      label: detections
      hasCustomLabel: true
      optionName: metric_szk42_detections
    - expressionType: SQL
      sqlExpression: COUNT(DISTINCT COALESCE(user_arn, user_name))
      label: distinct_principals
      hasCustomLabel: true
      optionName: metric_szk42_users
    - expressionType: SQL
      sqlExpression: MIN(detected_at)
      label: first_seen
      hasCustomLabel: true
      optionName: metric_szk42_first
    - expressionType: SQL
      sqlExpression: MAX(detected_at)
      label: last_seen
      hasCustomLabel: true
      optionName: metric_szk42_last
  groupby:
    - src_country
    - rule_title
    - level
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: src_country IS NOT NULL
      filterOptionName: filter_szk42_country_notnull
  granularity_sqla: detected_at
  time_range: No filter
  row_limit: 250
  order_desc: true
  page_size: 50
cache_timeout: null

# SQL used to power this chart:
# SELECT src_country, rule_title, level, COUNT(*) AS detections,
#        COUNT(DISTINCT COALESCE(user_arn, user_name)) AS distinct_principals,
#        MIN(detected_at) AS first_seen, MAX(detected_at) AS last_seen
# FROM suzaku_detections WHERE src_country IS NOT NULL
# GROUP BY 1, 2, 3 ORDER BY detections DESC
