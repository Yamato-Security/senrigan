# SZK-26: Tactic × Principal
# Which identity was seen performing which tactic. A single principal
# spanning several tactics is the classic compromised-credential shape.
uuid: 5a26c3d4-e5f6-7890-abcd-ef0123450026
version: 1.0.0
dataset_uuid: 3e8a5c47-91d2-4fb6-8c03-6a7e2d914b58
slice_name: Tactic × Principal
viz_type: table
description: >
  ATT&CK tactics cross-tabulated with the principal that triggered them
  (SZK-26). One identity appearing under several tactics — especially
  Credential Access followed by Privilege Escalation — is the classic
  compromised-credential pattern.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: COUNT(*)
      label: detections
      hasCustomLabel: true
      optionName: metric_szk26_detections
    - expressionType: SQL
      sqlExpression: COUNT(DISTINCT rule_title)
      label: distinct_rules
      hasCustomLabel: true
      optionName: metric_szk26_rules
  groupby:
    - user_name
    - tag_value
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: tag_type = 'tactic'
      filterOptionName: filter_szk26_tactic
  granularity_sqla: detected_at
  time_range: No filter
  row_limit: 250
  order_desc: true
  page_size: 50
cache_timeout: null

# SQL used to power this chart:
# SELECT user_name, tag_value, COUNT(*) AS detections,
#        COUNT(DISTINCT rule_title) AS distinct_rules
# FROM suzaku_detection_tags WHERE tag_type = 'tactic'
# GROUP BY 1, 2 ORDER BY detections DESC
