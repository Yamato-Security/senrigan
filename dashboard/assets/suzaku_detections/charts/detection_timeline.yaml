# SZK-12: Detection Timeline (event level)
# One row per rule hit, newest first — the 'what happened, when, and to
# whom' listing the rest of the dashboard drills into.
# Sorted by detected_at DESC; use the dashboard filters to narrow it.
uuid: 5a12c3d4-e5f6-7890-abcd-ef0123450012
version: 1.0.0
dataset_uuid: 7c1f9d2a-6b35-4e88-9a10-0d5f3b7e4c21
slice_name: Detection Timeline
viz_type: table
description: >
  Event-level listing of every Suzaku detection: timestamp, severity, rule,
  principal, source, and outcome (SZK-12). This is the master timeline — every
  other chart on this dashboard is a different way of slicing it. Cross-filter
  from any chart to scope it.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: MAX(level_rank)
      label: severity_rank
      hasCustomLabel: true
      optionName: metric_szk12_severity_rank
  groupby:
    - detected_at
    - level
    - rule_title
    - event_name
    - user_name
    - source_ip
    - src_country
    - src_asn
    - outcome
  adhoc_filters: []
  granularity_sqla: detected_at
  time_range: No filter
  row_limit: 1000
  order_desc: true
  page_size: 100
cache_timeout: null

# SQL used to power this chart:
# SELECT detected_at, level, rule_title, event_name, user_name,
#        source_ip, src_country, src_asn, outcome
# FROM suzaku_detections ORDER BY detected_at DESC LIMIT 1000
