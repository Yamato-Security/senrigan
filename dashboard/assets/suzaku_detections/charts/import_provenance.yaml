# SZK-55: Imported Suzaku Runs (provenance)
# Which Suzaku output files this database was built from, and what each
# contributed. The first thing to check when a number looks wrong: it
# shows immediately whether an expected run was never imported.
uuid: 5a55c3d4-e5f6-7890-abcd-ef0123450055
version: 1.0.0
dataset_uuid: 7c1f9d2a-6b35-4e88-9a10-0d5f3b7e4c21
slice_name: Imported Suzaku Runs
viz_type: table
description: >
  One row per imported Suzaku `.duckdb` output: how many detections it
  contributed, which cloud it covered, and the time range of its detections
  (SZK-55). Use it to confirm that every expected Suzaku run actually made it
  into the database before drawing conclusions.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: COUNT(*)
      label: detections
      hasCustomLabel: true
      optionName: metric_szk55_detections
    - expressionType: SQL
      sqlExpression: COUNT(DISTINCT rule_title)
      label: distinct_rules
      hasCustomLabel: true
      optionName: metric_szk55_rules
    - expressionType: SQL
      sqlExpression: MIN(detected_at)
      label: first_seen
      hasCustomLabel: true
      optionName: metric_szk55_first
    - expressionType: SQL
      sqlExpression: MAX(detected_at)
      label: last_seen
      hasCustomLabel: true
      optionName: metric_szk55_last
  groupby:
    - source_path
    - cloud_provider
  adhoc_filters: []
  granularity_sqla: detected_at
  time_range: No filter
  row_limit: 100
  order_desc: true
  page_size: 25
cache_timeout: null

# SQL used to power this chart:
# SELECT source_path, cloud_provider, COUNT(*) AS detections,
#        COUNT(DISTINCT rule_title) AS distinct_rules,
#        MIN(detected_at) AS first_seen, MAX(detected_at) AS last_seen
# FROM suzaku_detections GROUP BY 1, 2 ORDER BY detections DESC
