# SZK-54: Azure / M365 Workload Activity
# The Azure-specific columns Suzaku's azure_profile carries: Workload,
# RecordType, Category and the object acted on.
# Empty for a database that only holds AWS CloudTrail detections.
uuid: 5a54c3d4-e5f6-7890-abcd-ef0123450054
version: 1.0.0
dataset_uuid: 7c1f9d2a-6b35-4e88-9a10-0d5f3b7e4c21
slice_name: Azure / M365 Workload Activity
viz_type: table
description: >
  Azure and Microsoft 365 detections broken out by workload, Unified Audit Log
  record type, category and target object (SZK-54). These columns exist only
  in Suzaku's Azure output profile, so this chart is empty on an AWS-only
  database.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: COUNT(*)
      label: detections
      hasCustomLabel: true
      optionName: metric_szk54_detections
    - expressionType: SQL
      sqlExpression: COUNT(DISTINCT COALESCE(user_arn, user_name))
      label: distinct_principals
      hasCustomLabel: true
      optionName: metric_szk54_users
    - expressionType: SQL
      sqlExpression: MAX(detected_at)
      label: last_seen
      hasCustomLabel: true
      optionName: metric_szk54_last
  groupby:
    - event_source
    - record_type
    - category
    - target_object
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: cloud_provider = 'azure'
      filterOptionName: filter_szk54_azure_only
  granularity_sqla: detected_at
  time_range: No filter
  row_limit: 250
  order_desc: true
  page_size: 50
cache_timeout: null

# SQL used to power this chart:
# SELECT event_source, record_type, category, target_object, COUNT(*) AS detections,
#        COUNT(DISTINCT COALESCE(user_arn, user_name)) AS distinct_principals,
#        MAX(detected_at) AS last_seen
# FROM suzaku_detections WHERE cloud_provider = 'azure'
# GROUP BY 1, 2, 3, 4 ORDER BY detections DESC
