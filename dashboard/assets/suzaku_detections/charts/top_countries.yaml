# SZK-37: Top Source Countries
# The tabular companion to the map — works the same whether or not the
# world_map visualisation is available in your Superset build.
# Geo columns are populated only when Suzaku was run with --geo-ip <maxmind-db-dir>; otherwise this chart shows 'No data'.
uuid: 5a37c3d4-e5f6-7890-abcd-ef0123450037
version: 1.0.0
dataset_uuid: 7c1f9d2a-6b35-4e88-9a10-0d5f3b7e4c21
slice_name: Top Source Countries
viz_type: dist_bar
description: >
  Detections per source country, with the distinct principals and rules
  involved (SZK-37). Serves as the fallback for SZK-36 when the legacy
  world_map visualisation is unavailable. Geo columns are populated only when
  Suzaku was run with --geo-ip <maxmind-db-dir>; otherwise this chart shows
  'No data'.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: COUNT(*)
      label: detections
      hasCustomLabel: true
      optionName: metric_szk37_detections
    - expressionType: SQL
      sqlExpression: COUNT(DISTINCT COALESCE(user_arn, user_name))
      label: distinct_principals
      hasCustomLabel: true
      optionName: metric_szk37_users
    - expressionType: SQL
      sqlExpression: COUNT(DISTINCT rule_title)
      label: distinct_rules
      hasCustomLabel: true
      optionName: metric_szk37_rules
  groupby:
    - src_country
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: src_country IS NOT NULL
      filterOptionName: filter_szk37_country_notnull
  granularity_sqla: detected_at
  time_range: No filter
  row_limit: 30
  order_desc: true
  orientation: horizontal
  x_axis_label: Detections
  y_axis_label: Country
  color_scheme: supersetColors
  rich_tooltip: true
cache_timeout: null

# SQL used to power this chart:
# SELECT src_country, COUNT(*) AS detections,
#        COUNT(DISTINCT COALESCE(user_arn, user_name)) AS distinct_principals,
#        COUNT(DISTINCT rule_title) AS distinct_rules
# FROM suzaku_detections WHERE src_country IS NOT NULL
# GROUP BY src_country ORDER BY detections DESC
