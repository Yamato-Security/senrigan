# SZK-32: Access Keys Involved in Detections
# The concrete containment list: every AKIA/ASIA key that appears in a
# detection, with the identity it belongs to and the rules it tripped.
# These are the credentials to rotate first.
uuid: 5a32c3d4-e5f6-7890-abcd-ef0123450032
version: 1.0.0
dataset_uuid: 7c1f9d2a-6b35-4e88-9a10-0d5f3b7e4c21
slice_name: Access Keys Involved in Detections
viz_type: table
description: >
  AWS access key IDs that appear in detections, with their principal, the
  rules they triggered and the source IPs they were used from (SZK-32). This
  is the credential-rotation worklist for containment.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: COUNT(*)
      label: detections
      hasCustomLabel: true
      optionName: metric_szk32_detections
    - expressionType: SQL
      sqlExpression: COUNT(DISTINCT rule_title)
      label: distinct_rules
      hasCustomLabel: true
      optionName: metric_szk32_rules
    - expressionType: SQL
      sqlExpression: COUNT(DISTINCT source_ip)
      label: distinct_ips
      hasCustomLabel: true
      optionName: metric_szk32_ips
    - expressionType: SQL
      sqlExpression: MAX(detected_at)
      label: last_seen
      hasCustomLabel: true
      optionName: metric_szk32_last
  groupby:
    - access_key_id
    - user_name
    - account_id
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: access_key_id IS NOT NULL
      filterOptionName: filter_szk32_key_notnull
  granularity_sqla: detected_at
  time_range: No filter
  row_limit: 100
  order_desc: true
  page_size: 50
cache_timeout: null

# SQL used to power this chart:
# SELECT access_key_id, user_name, account_id, COUNT(*) AS detections,
#        COUNT(DISTINCT rule_title) AS distinct_rules,
#        COUNT(DISTINCT source_ip) AS distinct_ips,
#        MAX(detected_at) AS last_seen
# FROM suzaku_detections WHERE access_key_id IS NOT NULL
# GROUP BY 1, 2, 3 ORDER BY detections DESC
