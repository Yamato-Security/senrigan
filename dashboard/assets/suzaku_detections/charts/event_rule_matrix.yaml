# SZK-53: Action × Rule Matrix
# Which API action tripped which rule. Reading down the action column
# shows whether several independent rules agree about one action — the
# strongest corroboration a rule-based tool can give you.
uuid: 5a53c3d4-e5f6-7890-abcd-ef0123450053
version: 1.0.0
dataset_uuid: 7c1f9d2a-6b35-4e88-9a10-0d5f3b7e4c21
slice_name: Action × Rule Matrix
viz_type: table
description: >
  Every API action paired with the rules it triggered, with severity, outcome
  and volume (SZK-53). When several independent rules flag the same action,
  that agreement is the strongest corroboration a signature-based tool can
  offer.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: COUNT(*)
      label: detections
      hasCustomLabel: true
      optionName: metric_szk53_detections
    - expressionType: SQL
      sqlExpression: COUNT(DISTINCT COALESCE(user_arn, user_name))
      label: distinct_principals
      hasCustomLabel: true
      optionName: metric_szk53_users
    - expressionType: SQL
      sqlExpression: MAX(detected_at)
      label: last_seen
      hasCustomLabel: true
      optionName: metric_szk53_last
  groupby:
    - event_name
    - rule_title
    - level
    - outcome
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: event_name IS NOT NULL
      filterOptionName: filter_szk53_event_notnull
  granularity_sqla: detected_at
  time_range: No filter
  row_limit: 500
  order_desc: true
  page_size: 50
cache_timeout: null

# SQL used to power this chart:
# SELECT event_name, rule_title, level, outcome, COUNT(*) AS detections,
#        COUNT(DISTINCT COALESCE(user_arn, user_name)) AS distinct_principals,
#        MAX(detected_at) AS last_seen
# FROM suzaku_detections WHERE event_name IS NOT NULL
# GROUP BY 1, 2, 3, 4 ORDER BY detections DESC
