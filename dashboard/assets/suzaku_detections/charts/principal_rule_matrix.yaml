# SZK-31: Principal × Rule Matrix
# Exactly which rules each identity tripped, with the time window.
# This is the table to screenshot for an incident report entry.
uuid: 5a31c3d4-e5f6-7890-abcd-ef0123450031
version: 1.0.0
dataset_uuid: 7c1f9d2a-6b35-4e88-9a10-0d5f3b7e4c21
slice_name: Principal × Rule Matrix
viz_type: table
description: >
  Every principal/rule pair with its severity, count and time window (SZK-31).
  The most report-ready view on the dashboard: it states which identity
  triggered which detection and when.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: COUNT(*)
      label: detections
      hasCustomLabel: true
      optionName: metric_szk31_detections
    - expressionType: SQL
      sqlExpression: MIN(detected_at)
      label: first_seen
      hasCustomLabel: true
      optionName: metric_szk31_first
    - expressionType: SQL
      sqlExpression: MAX(detected_at)
      label: last_seen
      hasCustomLabel: true
      optionName: metric_szk31_last
  groupby:
    - user_name
    - rule_title
    - level
  adhoc_filters: []
  granularity_sqla: detected_at
  time_range: No filter
  row_limit: 500
  order_desc: true
  page_size: 50
cache_timeout: null

# SQL used to power this chart:
# SELECT user_name, rule_title, level, COUNT(*) AS detections,
#        MIN(detected_at) AS first_seen, MAX(detected_at) AS last_seen
# FROM suzaku_detections GROUP BY 1, 2, 3 ORDER BY detections DESC
