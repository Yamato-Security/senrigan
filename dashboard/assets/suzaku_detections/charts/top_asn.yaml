# SZK-38: Top Source Networks (ASN)
# ASN is more actionable than country: hosting providers, VPN networks
# and Tor exits stand out here even when the country looks ordinary.
# Geo columns are populated only when Suzaku was run with --geo-ip <maxmind-db-dir>; otherwise this chart shows 'No data'.
uuid: 5a38c3d4-e5f6-7890-abcd-ef0123450038
version: 1.0.0
dataset_uuid: 7c1f9d2a-6b35-4e88-9a10-0d5f3b7e4c21
slice_name: Top Source Networks (ASN)
viz_type: dist_bar
description: >
  Detections per source ASN / network operator (SZK-38). More discriminating
  than country alone — cloud hosting, VPN and anonymising networks are visible
  here even when the country looks unremarkable. Geo columns are populated
  only when Suzaku was run with --geo-ip <maxmind-db-dir>; otherwise this
  chart shows 'No data'.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: COUNT(*)
      label: detections
      hasCustomLabel: true
      optionName: metric_szk38_detections
    - expressionType: SQL
      sqlExpression: COUNT(DISTINCT source_ip)
      label: distinct_ips
      hasCustomLabel: true
      optionName: metric_szk38_ips
  groupby:
    - src_asn
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: src_asn IS NOT NULL
      filterOptionName: filter_szk38_asn_notnull
  granularity_sqla: detected_at
  time_range: No filter
  row_limit: 25
  order_desc: true
  orientation: horizontal
  x_axis_label: Detections
  y_axis_label: ASN / Network
  color_scheme: supersetColors
  rich_tooltip: true
cache_timeout: null

# SQL used to power this chart:
# SELECT src_asn, COUNT(*) AS detections, COUNT(DISTINCT source_ip) AS distinct_ips
# FROM suzaku_detections WHERE src_asn IS NOT NULL
# GROUP BY src_asn ORDER BY detections DESC LIMIT 25
