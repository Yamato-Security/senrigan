# Suzaku Detections — Dashboard Definition
# 7-tab layout: Overview | Rules | MITRE ATT&CK | Identity | Origin |
# Timeline | Events.  56 charts over two datasets:
#   * suzaku_detections     — one row per Sigma rule hit
#   * suzaku_detection_tags — one row per ATT&CK tag on a hit (MITRE tab)
#
# Both tables are written by `ingester suzaku-import`, which reads the
# `.duckdb` timeline produced by
#   suzaku aws-ct-timeline|azure-timeline -d <logs> -o result -t duckdb
#
# Import via: superset import-dashboards -p suzaku_detections.zip -u admin
# (in Senrigan this happens automatically in dashboard/init/bootstrap.sh).
uuid: 9b4d7e21-5c68-4a3f-b0d9-1e6c8f2a3457
version: 1.0.0
dashboard_title: Suzaku Detections
description: >
  Pre-built dashboard for Suzaku cloud-log detections stored in DuckDB. Seven
  tabs answer the questions an analyst asks of a detection set in order: how
  bad is it and when did it happen (Overview, Timeline), which rules fired and
  which are rare (Rules), where does it sit on the ATT&CK matrix (MITRE
  ATT&CK), who did it (Identity), where did they come from (Origin), and what
  did they actually attempt (Events).
published: true
css: ""
slug: suzaku-detections

