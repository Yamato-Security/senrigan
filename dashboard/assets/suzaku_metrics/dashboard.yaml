  charts:
  - slice_name: Fields Counted
    viz_type: big_number_total
    description: How many CloudTrail fields this aws-ct-metrics run counted (SZM-01). Suzaku counts whichever
      field it was given, so this is usually one.
  - slice_name: Distinct Values
    viz_type: big_number_total
    description: Cardinality of the counted field (SZM-02). High cardinality on an action field means
      broad API surface use.
  - slice_name: Total Occurrences
    viz_type: big_number_total
    description: Events behind the counts (SZM-03). The denominator for every share on this dashboard.
  - slice_name: Top Value Share
    viz_type: big_number_total
    description: Share of the single most common value (SZM-04). A very high share means one value dominates
      and the interesting activity is in the long tail.
  - slice_name: Values Seen Once
    viz_type: big_number_total
    description: Values that occurred exactly once (SZM-05). In a large dataset, rarity is the cheapest
      anomaly signal — see the Rare Values table.
  - slice_name: Source Countries
    viz_type: big_number_total
    description: Distinct source countries (SZM-06). Zero means Suzaku ran without GeoIP enrichment, not
      that traffic was local.
  - slice_name: Top Values by Occurrence
    viz_type: dist_bar
    description: The most frequently seen values (SZM-10). Use the Field filter to switch field when a
      run counted more than one.
  - slice_name: Value Share Composition
    viz_type: pie
    description: How the counted field's total splits across its top values (SZM-11). One dominant slice
      means the tail is where anomalies live.
  - slice_name: Value Frequency Table
    viz_type: table
    description: The full frequency table (SZM-12), with Suzaku's own percentage next to the count and
      the first/last time each value appeared.
  - slice_name: Rare Values (Bottom-N)
    viz_type: table
    description: 'The least frequent values (SZM-20). Same reasoning as the CloudTrail Rare Events dashboard:
      what happened once is more often interesting than what happened a mi'
  - slice_name: Newest Values (Latest First Seen)
    viz_type: table
    description: Values that appeared for the first time most recently (SZM-21). A value showing up only
      at the end of the timeline is new behaviour; last_seen and occurrences say whether it stayed or
      fired once and vanished.
  - slice_name: Top Source Countries
    viz_type: dist_bar
    description: Occurrences grouped by source country (SZM-30). Empty unless Suzaku ran with GeoIP enrichment
      — the columns exist either way.
  - slice_name: Top Source ASNs
    viz_type: dist_bar
    description: Occurrences grouped by source ASN (SZM-31). Hosting and VPN providers appearing high
      here are worth a second look.
  - slice_name: Value by Country and City
    viz_type: table
    description: Which values came from which location (SZM-32). Empty unless Suzaku ran with GeoIP enrichment.
