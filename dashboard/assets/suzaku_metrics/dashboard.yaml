# Suzaku Field Metrics — Dashboard Definition
#
# Layout follows cloudtrail_default: an Overview tab of KPI cards first, then
# themed tabs. The tabs are shaped by what aws-ct-metrics is — a frequency table
# — so they are Distribution (the head), Rare & Temporal (the tail and timing)
# and GeoIP (only populated for enriched runs).
#
# Field-agnostic contract: `Field` holds whatever field the analyst passed to
# Suzaku, so no chart may filter on a literal field name. The Field native filter
# defaults to the first value instead. dashboard/tests/test_suzaku_bundles.py
# enforces this.
#
# Charts SZM-01..SZM-06 (KPI cards), SZM-10..SZM-12 (Distribution),
# SZM-20..SZM-21 (Rare & Temporal), SZM-30..SZM-32 (GeoIP).
# SZM-22 (Value Activity Span) was dropped in the DFIR review: every column it
# showed is already in SZM-12, which adds Suzaku's own share percentage.
#
# Rebuild after editing:
#   python3 assets/rebuild_suzaku_metrics_zip.py
#   cd docker && docker compose run --rm superset-init
uuid: 5a021003-0000-4000-8000-000000000003
