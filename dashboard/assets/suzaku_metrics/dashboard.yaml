    name: Date Range
    filterType: filter_time
    targets:
    - {}
    defaultDataMask:
      filterState:
        value: No filter
    controlValues:
      enableEmptyFilter: false
    cascadeParentIds: []
    scope:
      rootPath:
      - ROOT_ID
      excluded: []
    type: NATIVE_FILTER
    description: Filter every chart by first-seen timestamp
    chartsInScope: []
    tabsInScope: []
  - id: NATIVE_FILTER-field
    name: Field
    filterType: filter_select
    targets:
    - column:
        name: field
      datasetUuid: 5a021002-0000-4000-8000-000000000005
    defaultDataMask:
      filterState:
        value: null
    controlValues:
      enableEmptyFilter: false
      defaultToFirstItem: true
      multiSelect: true
      searchAllOptions: false
      inverseSelection: false
    cascadeParentIds: []
    scope:
      rootPath:
      - ROOT_ID
      excluded: []
    type: NATIVE_FILTER
    description: Which CloudTrail field's value counts to show
    chartsInScope: []
    tabsInScope: []
  - id: NATIVE_FILTER-value
    name: Value
    filterType: filter_select
    targets:
    - column:
