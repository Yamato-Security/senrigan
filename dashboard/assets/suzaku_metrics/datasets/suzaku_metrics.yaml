# Superset dataset for Suzaku `aws-ct-metrics` output.
#
# `Field` holds whatever field the analyst passed to Suzaku (`eventName` in the
# reference run), so this dataset — and every chart built on it — is deliberately
# field-agnostic: the dashboard filters on `field` rather than assuming one.
# `TimelineColumn` is the same field under the name the `timeline` table gives it,
# which is what lets a chart here be cross-referenced with a timeline chart.
#
# VIRTUAL (sql:) to rename the PascalCase columns
# and to derive `active_days`; the file's timestamps, NULLs and full-precision
# `Percent` are already typed (P2/P3/P8).
#
# REQUIRES `--geo-ip`: Suzaku emits SrcASN / SrcCity / SrcCountry only for an
# enriched run, so a metrics file produced without it cannot serve this dataset.
# See dashboard/README.md.
uuid: 5a021002-0000-4000-8000-000000000005
version: 1.0.0
database_uuid: 5a021001-0000-4000-8000-000000000003
table_name: suzaku_metrics
main_dttm_col: first_seen
description: >
  Value frequencies for the CloudTrail field(s) Suzaku was asked to count, with
  first/last seen timestamps and GeoIP attributes.
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
sql: |
  SELECT
      "Field"                                   AS field,
      "TimelineColumn"                          AS timeline_column,
      "Value"                                   AS value,
      "Count"                                   AS occurrence_count,
      "FieldTotal"                              AS field_total,
      "Percent"                                 AS percent,
      "FirstSeen"                               AS first_seen,
      "LastSeen"                                AS last_seen,
      date_diff('day', "FirstSeen", "LastSeen") AS active_days,
      "SrcASN"                                  AS src_asn,
      "SrcCity"                                 AS src_city,
      "SrcCountry"                              AS src_country
  FROM metrics
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null

columns:
  - column_name: field
    verbose_name: Field
    is_dttm: false
    is_active: true
    type: VARCHAR
    groupby: true
    filterable: true
    description: CloudTrail field these value counts are for (whatever Suzaku was given)

  - column_name: timeline_column
    verbose_name: Timeline Column
    is_dttm: false
    is_active: true
    type: VARCHAR
    groupby: true
    filterable: true
    description: >
      The same field under the name the timeline table uses (eventName ->
      EventName), so a metrics chart can be matched to a timeline one

  - column_name: value
    verbose_name: Value
    is_dttm: false
    is_active: true
    type: VARCHAR
    groupby: true
    filterable: true
    description: One observed value of the field

  - column_name: occurrence_count
    verbose_name: Occurrences
    is_dttm: false
    is_active: true
    type: BIGINT
    groupby: false
    filterable: true
    description: How many events carried this value

  - column_name: field_total
    verbose_name: Field Total
    is_dttm: false
    is_active: true
    type: BIGINT
    groupby: false
    filterable: true
    description: >
      Events carrying any value of this field — the denominator `percent` was
      computed from, so a filtered share can be recomputed exactly

  - column_name: percent
    verbose_name: Share (%)
    is_dttm: false
    is_active: true
    type: DOUBLE
    groupby: false
    filterable: true
    description: >
      Share of the field total, in percent, at full precision — so a sum across
      every value of one field is exactly 100.

  - column_name: first_seen
    verbose_name: First Seen
    is_dttm: true
    is_active: true
    type: TIMESTAMP
    groupby: true
    filterable: true
    description: First event carrying this value

  - column_name: last_seen
    verbose_name: Last Seen
    is_dttm: true
    is_active: true
    type: TIMESTAMP
    groupby: true
    filterable: true
    description: Last event carrying this value

  - column_name: active_days
    verbose_name: Active Days
    is_dttm: false
    is_active: true
    type: BIGINT
    groupby: false
    filterable: true
    description: Days between first and last occurrence

  - column_name: src_asn
    verbose_name: Source ASN
    is_dttm: false
    is_active: true
    type: VARCHAR
    groupby: true
    filterable: true
    description: GeoIP ASN of the source IP (requires --geo-ip)

  - column_name: src_city
    verbose_name: Source City
    is_dttm: false
    is_active: true
    type: VARCHAR
    groupby: true
    filterable: true
    description: GeoIP city of the source IP (requires --geo-ip)

  - column_name: src_country
    verbose_name: Source Country
    is_dttm: false
    is_active: true
    type: VARCHAR
    groupby: true
    filterable: true
    description: GeoIP country of the source IP (requires --geo-ip)

metrics:
  - metric_name: count
    verbose_name: "COUNT(*)"
    metric_type: count
    expression: "COUNT(*)"
    description: Number of distinct values

  - metric_name: occurrence_total
    verbose_name: Occurrences
    metric_type: sum
    expression: "SUM(occurrence_count)"
    description: Total events covered

  - metric_name: distinct_values
    verbose_name: Distinct Values
    metric_type: count_distinct
    expression: "COUNT(DISTINCT value)"
    description: Cardinality of the field

  - metric_name: distinct_fields
    verbose_name: Distinct Fields
    metric_type: count_distinct
    expression: "COUNT(DISTINCT field)"
    description: How many fields this run counted

  - metric_name: top_share
    verbose_name: Top Value Share (%)
    metric_type: max
    expression: "MAX(percent)"
    description: Share of the single most common value

  - metric_name: singleton_values
    verbose_name: Values Seen Once
    metric_type: count
    expression: "COUNT(CASE WHEN occurrence_count = 1 THEN 1 END)"
    description: Values that occurred exactly once — the rare-event view
