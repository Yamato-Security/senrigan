# SZM-20: Least frequent values — the rare-event view.
uuid: 5a021005-0000-4000-8000-000000000020
version: 1.0.0
dataset_uuid: 5a021002-0000-4000-8000-000000000005
slice_name: Rare Values (Bottom-N)
viz_type: table
description: >
  The least frequent values (SZM-20). Same reasoning as the CloudTrail Rare Events dashboard: what happened once is more often interesting than what happened a million times.
query_context: ""
params:
  query_mode: aggregate
  metrics:
    - expressionType: SQL
      sqlExpression: "SUM(occurrence_count)"
      label: occurrences
      hasCustomLabel: true
      optionName: metric_rare_values_occurrences
    - expressionType: SQL
      sqlExpression: "MIN(first_seen)"
      label: first_seen
      hasCustomLabel: true
      optionName: metric_rare_values_first_seen
    - expressionType: SQL
      sqlExpression: "MAX(last_seen)"
      label: last_seen
      hasCustomLabel: true
      optionName: metric_rare_values_last_seen
  groupby:
    - value
  adhoc_filters: []
  granularity_sqla: first_seen
  time_range: "No filter"
  row_limit: 200
  order_desc: false
  timeseries_limit_metric:
    expressionType: SQL
    sqlExpression: "SUM(occurrence_count)"
    label: sort_key
    hasCustomLabel: true
    optionName: metric_rare_values_sort_key
  page_size: 25
  include_time: false
  show_cell_bars: true
cache_timeout: null
