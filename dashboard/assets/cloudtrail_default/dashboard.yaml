dashboard_title: CloudTrail Threat Hunting — Top Events
description: 'Pre-built threat hunting dashboard for AWS CloudTrail logs stored in DuckDB. Triage-first 10-tab layout led by an Overview tab of at-a-glance KPI cards, then Threat Detection, Identity & Access, High-Risk API Monitor, API Activity, S3 & RDS, Computing, Network, Temporal Analysis, and GeoIP Intelligence.  Covers event volume trends, top API calls, IAM entity activity, error patterns, security monitoring control changes, IAM privilege change timelines, secrets access anomalies, SSRF/IMDS detection, DNS record changes, geographic source analysis, and first/last seen temporal hunting for DFIR.

  '
published: true
css: ''
