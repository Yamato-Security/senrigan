  charts:
  - slice_name: CloudTrail Events Over Time
    viz_type: echarts_timeseries_bar
    description: DSH-01 - Hourly Read/Write event volume (stacked bar).
  - slice_name: Top 20 API Calls
    viz_type: dist_bar
    description: DSH-02 - Most frequently called AWS API actions.
  - slice_name: IAM Entity Activity
    viz_type: table
    description: DSH-03 - IAM entities ranked by API call volume with write ratio.
  - slice_name: Error Event Trend
    viz_type: echarts_timeseries_bar
    description: DSH-04 - Hourly error counts broken down by error code.
  - slice_name: Top Source IP Addresses
    viz_type: table
    description: DSH-05 - External source IPs ranked by request count.
  - slice_name: Console Login Activity
    viz_type: table
    description: DSH-08 - Console sign-in attempts with MFA-less count.
  - slice_name: Top Access Denied Actions
    viz_type: dist_bar
    description: DSH-09 - API actions most frequently denied access.
  - slice_name: User Agent Analysis
    viz_type: table
    description: DSH-11 - Top user agents by request count.
  - slice_name: Security-Relevant API Calls
    viz_type: table
    description: DSH-12 - Expanded list of security-relevant API invocations.
  - slice_name: Root Account Usage
    viz_type: table
    description: DSH-13 - All API calls made by the Root account.
  - slice_name: Region Activity
    viz_type: dist_bar
    description: DSH-14 - Event distribution across AWS regions with write ratio.
  - slice_name: Top Countries by Request Volume
    viz_type: dist_bar
    description: DSH-15 - Top 20 source countries (GeoIP enrichment required).
  - slice_name: Global Request Origin Map
    viz_type: world_map
    description: DSH-16 - World map of API call origins (GeoIP enrichment required).
  - slice_name: Top Cities by Request Volume
    viz_type: table
    description: DSH-17 - Top 25 source cities (GeoIP enrichment required).
  - slice_name: Top ASN Organizations by Request Volume
    viz_type: table
    description: DSH-18 - Top 25 ASN organizations (GeoIP enrichment required).
  - slice_name: Login Activity Heatmap (Hour x Day)
    viz_type: heatmap
    description: DSH-19 - Console login counts by hour-of-day and day-of-week.
  - slice_name: Throttling Exception Spikes
    viz_type: echarts_timeseries_bar
    description: DSH-21 - Throttling errors per service per hour.
  - slice_name: Security Monitoring & Control Changes
    viz_type: table
    description: DSH-22 - CloudTrail/GuardDuty/Config/VPC security monitoring control changes.
  - slice_name: Secrets Access Anomaly
    viz_type: table
    description: DSH-23 - Bulk Secrets Manager / SSM Parameter Store reads.
  - slice_name: Organizations / SCP Changes
    viz_type: table
    description: DSH-24 - AWS Organizations management events.
  - slice_name: S3 Protection Config Changes
    viz_type: table
    description: DSH-25 - S3 logging / encryption / public-access changes.
  - slice_name: First / Last Seen per Service Source
    viz_type: table
    description: DSH-26 - First and last seen timestamps per AWS service source.
  - slice_name: AssumedRole from External IP
    viz_type: table
    description: DSH-27 - AssumedRole calls from public (non-RFC1918) IPs.
  - slice_name: MFA-less Login Trend
    viz_type: echarts_timeseries_bar
    description: DSH-28 - Daily console logins split by MFA usage.
  - slice_name: Route53 DNS Changes
    viz_type: table
    description: DSH-29 - Route 53 hosted-zone and resolver changes.
  - slice_name: IAM Privilege Change Event Timeline
    viz_type: echarts_timeseries_bar
    description: DSH-30 - Daily IAM privilege change API calls by event name.
  - slice_name: First / Last Seen per IAM Identity
    viz_type: table
    description: DSH-31 - IAM identities with first/last seen timestamps, event counts, and active span.
  - slice_name: First / Last Seen per Source IP
    viz_type: table
    description: DSH-32 - Source IPs with first/last seen, identity count, and GeoIP context.
  - slice_name: First / Last Seen per API Call
    viz_type: table
    description: DSH-33 - API actions ordered by first appearance for new activity detection.
  - slice_name: Dormant Accounts Reactivated
    viz_type: table
    description: DSH-37 - Identities with long inactivity gaps that resumed activity.
  - slice_name: Event Velocity Spikes per Identity
    viz_type: table
    description: DSH-38 - Identities with 50+ events/hour burst activity periods.
  - slice_name: High-Risk API Events Over Time
    viz_type: echarts_timeseries_bar
    description: HRM-39 - Daily volume of calls to 42 security-monitored APIs stacked by event name.
  - slice_name: Top High-Risk API Calls
    viz_type: bar
    description: HRM-40 - APIs from the high-risk watchlist ranked by total call count.
  - slice_name: Top Actors — High-Risk APIs
    viz_type: bar
    description: HRM-42 - IAM principals ranked by calls to high-risk watchlist APIs.
  - slice_name: Security Service Modification API Events
    viz_type: table
    description: HRM-44 - Detailed log of DeleteTrail / StopLogging / UpdateTrail / PutEventSelectors / DeletePolicy / DetachPolicy calls.
  - slice_name: Credential Retrieval API Events
    viz_type: table
    description: HRM-45 - Detailed log of GetSecretValue / GetParameter / GetParameterHistory calls.
  - slice_name: Glue & SageMaker IAM Role Pass Events
    viz_type: table
    description: DSH-50 - Glue DevEndpoint and SageMaker Notebook events involving iam:PassRole.
  - slice_name: ECS Task Definition & Service Changes
    viz_type: table
    description: DSH-49 - ECS task definition registration and service update events.
  - slice_name: EBS Direct API Snapshot Block Access
    viz_type: table
    description: DSH-51 - EBS Direct API calls (ListSnapshotBlocks/GetSnapshotBlock) to access snapshot block data without creating EC2 instances.
  - slice_name: S3 High-Volume Object Downloads
    viz_type: table
    description: DSH-52 - Identities performing >=100 GetObject calls per hour.
  - slice_name: S3 Bulk Object Deletion
    viz_type: table
    description: DSH-53 - Identities performing >=50 DeleteObject/DeleteObjects calls per hour.
  - slice_name: S3 Versioning / Logging Disabled
    viz_type: table
    description: DSH-54 - PutBucketVersioning (Suspended) and PutBucketLogging (disabled).
  - slice_name: S3 Cross-Account Replication
    viz_type: table
    description: DSH-55 - PutBucketReplication/DeleteBucketReplication — cross-account data replication changes.
  - slice_name: RDS Deleted without Final Snapshot
    viz_type: table
    description: DSH-56 - DeleteDBInstance/DeleteDBCluster with skipFinalSnapshot=true.
  - slice_name: AWS Backup Vault & Plan Deletion Events
    viz_type: table
    description: DSH-57 - Backup Vault/Plan/RecoveryPoint deletion and Vault Lock removal.
  - slice_name: API Calls by Country (Event Name × GeoIP)
    viz_type: table
    description: DSH-79 - Top (event_name, country) pairs by API call volume (GeoIP enrichment required).
