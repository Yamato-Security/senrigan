  MARKDOWN-pb-playbooks:
    type: MARKDOWN
    id: MARKDOWN-pb-playbooks
    children: []
    meta:
      width: 12
      height: 60
      code: '## 📕 Found something? Go to the response playbook


        Senrigan answers *what happened*. These playbooks answer *what to do next* —

        they are the AWS incident response playbooks this dashboard was aligned against.


        | What you found | Playbook |

        |---|---|

        | Unusual API calls from an unknown IP, new access keys | [IRP-CredCompromise](https://github.com/aws-samples/aws-incident-response-playbooks/blob/main/playbooks/IRP-CredCompromise.md) |

        | AssumeRole chains, cross-account activity, role sessions | [IRP-STSTokenAbuse](https://github.com/aws-samples/aws-incident-response-playbooks/blob/main/playbooks/IRP-STSTokenAbuse.md) |

        | SAML/OIDC provider changes, federated session abuse | [IRP-FederatedAccessAbuse](https://github.com/aws-samples/aws-incident-response-playbooks/blob/main/playbooks/IRP-FederatedAccessAbuse.md) |

        | Permission set changes, new account assignments | [IRP-IdentityCenterCompromise](https://github.com/aws-samples/aws-incident-response-playbooks/blob/main/playbooks/IRP-IdentityCenterCompromise.md) |

        | Backup deletion, versioning suspended, ransom notes | [IRP-Ransomware](https://github.com/aws-samples/aws-incident-response-playbooks/blob/main/playbooks/IRP-Ransomware.md) |

        | Bulk S3 reads, public buckets, cross-account copies | [IRP-DataAccess](https://github.com/aws-samples/aws-incident-response-playbooks/blob/main/playbooks/IRP-DataAccess.md) · [IRP-PersonalDataBreach](https://github.com/aws-samples/aws-incident-response-playbooks/blob/main/playbooks/IRP-PersonalDataBreach.md) |

        | Off-hours bulk access, self-granted privileges | [IRP-InsiderThreat](https://github.com/aws-samples/aws-incident-response-playbooks/blob/main/playbooks/IRP-InsiderThreat.md) |

        | WAF/Shield weakened, traffic spikes | [IRP-DoS](https://github.com/aws-samples/aws-incident-response-playbooks/blob/main/playbooks/IRP-DoS.md) |


        Start from [TRIAGE_GUIDE](https://github.com/aws-samples/aws-incident-response-playbooks/blob/main/TRIAGE_GUIDE.md) for the P1–P4 severity matrix and escalation triggers.

        '
  ROW-pb-playbooks:
    type: ROW
    id: ROW-pb-playbooks
    children:
    - MARKDOWN-pb-playbooks
