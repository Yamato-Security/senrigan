# CloudTrail Threat Hunting — Dashboard Definition (v2)
# 8-tab layout: Identity & Access | Threat Detection |
# API Activity | Computing | S3 & RDS | GeoIP Intelligence |
# Temporal Analysis | High-Risk API Monitor.
# 65 charts total:
#   Phase-1  DSH-01 to DSH-43   (43 charts — baseline, identity, data, network, compute)
#   Phase-2  DSH-44 to DSH-46   ( 3 charts — SSO, S3 policy, NACL/route)
#   Phase-3  DSH-47 to DSH-48   ( 2 charts — EventBridge/CW tampering, EKS/ECR events)
#   Phase-4  DSH-49 to DSH-51   ( 3 charts — ECS task definition, Glue/SageMaker privesc, EBS Direct API)
#   Phase-5  DSH-52 to DSH-57   ( 6 charts — S3 & RDS DFIR: bulk download, bulk deletion,
#                                             versioning/logging disabled, cross-account replication,
#                                             RDS deleted without snapshot, AWS Backup tampering)
#   Phase-6  DSH-58 to DSH-63   ( 6 charts — EC2 DFIR: instance launches, key pair creation,
#                                             instance profile changes, user data modification,
#                                             mass stop/terminate, spot fleet abuse)
# Import via: superset import-dashboards -p cloudtrail_default.zip -u admin
uuid: c3d4e5f6-a7b8-9012-cdef-123456789012
version: 1.0.0
dashboard_title: CloudTrail Threat Hunting
description: >
  Pre-built threat hunting dashboard for AWS CloudTrail logs stored in DuckDB.
  5-tab layout: Identity & Access | Threat Detection | Data & Infrastructure |
  GeoIP Intelligence | Temporal Analysis.  Covers event volume trends, Read/Write
  ratio, top API calls, IAM entity activity, error patterns, defense evasion,
  privilege escalation timelines, secrets access anomalies, SSRF/IMDS detection,
  DNS exfiltration, geographic source analysis, and first/last seen temporal
  hunting for DFIR.
published: true
css: ""
slug: cloudtrail-threat-hunting

