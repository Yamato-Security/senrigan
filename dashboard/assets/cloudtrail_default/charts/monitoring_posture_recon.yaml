# DSH-116: Security Monitoring Posture Recon
# Detects read-only probing of the account's own monitoring stack before an
# actor disables or evades those controls.
# MITRE ATT&CK: TA0007 Discovery / TA0005 Defense Evasion
uuid: 7f44f701-4dfb-4d75-bef4-87264473f7f4
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Security Monitoring Posture Recon
viz_type: table
description: >
  Read-only monitoring-service reconnaissance over time (DSH-116). This catches
  callers checking whether CloudTrail, GuardDuty, Config, Security Hub, Access
  Analyzer, Flow Logs, or CloudWatch alarms are active before a follow-on
  defense-evasion step.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: posture_probe_count
      hasCustomLabel: true
      optionName: metric_monitoring_posture_count
  groupby:
    - event_time
    - event_name
    - event_source
    - user_identity_arn
    - aws_region
    - source_ip_address
    - geo_country_code
    - geo_city
    - error_code
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: >-
        event_name IN (
          'DescribeTrails', 'GetTrailStatus',
          'GetEventSelectors', 'GetInsightSelectors',
          'ListTrails', 'ListDetectors', 'GetDetector',
          'GetFindingsStatistics', 'ListFindings',
          'ListIPSets', 'ListThreatIntelSets',
          'DescribeConfigurationRecorders',
          'DescribeConfigurationRecorderStatus',
          'DescribeDeliveryChannels', 'DescribeConfigRules',
          'ListAnalyzers', 'DescribeHub',
          'GetEnabledStandards', 'DescribeFlowLogs',
          'DescribeAlarms', 'DescribeLogGroups'
        )
      filterOptionName: filter_monitoring_posture
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 200
  order_desc: true
  page_size: 25
  include_time: false
cache_timeout: null
