# DSH-79: GeoIP × Event Name — API Calls by Country
# Table showing which event names are most frequently called from each country.
# Reveals unusual API operations originating from unexpected geographic regions —
# a strong indicator of credential compromise when write events appear from foreign
# countries not normally associated with the organisation's operations.
#
# Note: All geo_* columns are NULL when the ingester was run without a GeoLite2
# database. In that case this chart will show "No data" until GeoIP enrichment
# is performed (run: ingester enrich --geoip-city <path> --geoip-asn <path>).
uuid: 79a0b1c2-d3e4-5678-9012-345678901234
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: API Calls by Country (Event Name × GeoIP)
viz_type: table
description: >
  Top 50 (event_name, country) pairs by API call volume (DSH-79). Reveals which
  API operations are being called from each geographic region. Write operations
  from unexpected countries are a strong indicator of credential compromise.
  Requires GeoLite2 enrichment — private/internal IPs and NULL rows are excluded.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: event_count
      hasCustomLabel: true
      optionName: metric_event_count_name_country
    - expressionType: SQL
      sqlExpression: "COUNT(*) FILTER (WHERE read_only IS NOT TRUE)"
      label: write_count
      hasCustomLabel: true
      optionName: metric_write_count_name_country
    - expressionType: SQL
      sqlExpression: "COUNT(DISTINCT user_identity_arn)"
      label: unique_callers
      hasCustomLabel: true
      optionName: metric_unique_callers_name_country
  groupby:
    - event_name
    - geo_country_name
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: "geo_country_code IS NOT NULL AND geo_country_code NOT IN ('PRIVATE', 'LOOPBACK', 'LINK-LOCAL', 'SPECIAL')"
      filterOptionName: filter_geo_external_event_name
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 50
  order_desc: true
  page_size: 25
cache_timeout: null

# SQL used to power this chart:
# SELECT
#     event_name,
#     geo_country_name,
#     COUNT(*)                                             AS event_count,
#     COUNT(*) FILTER (WHERE read_only IS NOT TRUE)        AS write_count,
#     COUNT(DISTINCT user_identity_arn)                    AS unique_callers
# FROM cloudtrail_events
# WHERE geo_country_code IS NOT NULL
#   AND geo_country_code NOT IN ('PRIVATE', 'LOOPBACK', 'LINK-LOCAL', 'SPECIAL')
# GROUP BY event_name, geo_country_name
# ORDER BY event_count DESC
# LIMIT 50
