# DSH-23: Secrets Manager / Parameter Store Access Anomaly
# Table listing identities that accessed 10+ secrets/parameters within a single
# hour.  After initial compromise, attackers bulk-read credentials from
# Secrets Manager and SSM Parameter Store to harvest service account keys,
# RDS passwords, and API tokens.
# MITRE ATT&CK: TA0006 Credential Access / TA0010 Exfiltration
uuid: 23e5f6a7-b8c9-0123-ef01-234567890123
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Secrets Access Anomaly
viz_type: table
description: >
  Identities accessing Secrets Manager or SSM Parameter Store ≥10 times in
  one hour (DSH-23).  Bulk credential reads are a post-exploitation indicator:
  attackers harvest stored secrets to pivot to other services or accounts.
  MITRE ATT&CK: TA0006 Credential Access / TA0010 Exfiltration.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: access_count
      hasCustomLabel: true
      optionName: metric_secrets_access
    - expressionType: SQL
      sqlExpression: >-
        COUNT(DISTINCT COALESCE(
          json_extract_string(request_parameters, '$.secretId'),
          json_extract_string(request_parameters, '$.name')
        ))
      label: distinct_secrets
      hasCustomLabel: true
      optionName: metric_distinct_secrets
  groupby:
    - user_identity_arn
    - event_source
    - event_name
    - source_ip_address
    - geo_country_code
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: >-
        event_source IN ('secretsmanager.amazonaws.com', 'ssm.amazonaws.com')
        AND event_name IN (
          'GetSecretValue',  'DescribeSecret',   'ListSecrets',
          'GetParameter',    'GetParameters',    'GetParametersByPath',
          'DescribeParameters'
        )
      filterOptionName: filter_secrets_service
  granularity_sqla: event_time
  time_grain_sqla: PT1H
  include_time: true
  time_range: "No filter"
  row_limit: 100
  order_desc: true
  page_size: 25
cache_timeout: null

# SQL used to power this chart:
# SELECT
#     user_identity_arn,
#     event_source,
#     event_name,
#     DATE_TRUNC('hour', event_time)                               AS hour_bucket,
#     COUNT(*)                                                     AS access_count,
#     COUNT(DISTINCT COALESCE(
#       json_extract_string(request_parameters, '$.secretId'),
#       json_extract_string(request_parameters, '$.name')
#     ))                                                           AS distinct_secrets,
#     source_ip_address,
#     geo_country_code
# FROM cloudtrail_events
# WHERE event_source IN ('secretsmanager.amazonaws.com', 'ssm.amazonaws.com')
#   AND event_name IN (
#       'GetSecretValue', 'DescribeSecret', 'ListSecrets',
#       'GetParameter', 'GetParameters', 'GetParametersByPath', 'DescribeParameters'
#   )
# GROUP BY 1, 2, 3, 4, 7, 8
# HAVING COUNT(*) >= 10
# ORDER BY access_count DESC
# LIMIT 100

