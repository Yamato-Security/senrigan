# PB-04: Federated Console Logins
# Reads additionalEventData.federatedProvider, which is present only when the
# login arrived through an external IdP rather than through IAM.
# Playbook: IRP-FederatedAccessAbuse
uuid: c1a10004-0000-4000-8000-0000000c1a04
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Federated Console Logins by Provider & Origin
viz_type: table
description: >
  Console logins brokered by an external identity provider, with the provider
  name, country and ASN (IRP-FederatedAccessAbuse). When the IdP is the
  compromised component AWS sees only a valid login, so origin and provider are
  the only signals. MITRE ATT&CK: TA0001 Initial Access / T1078.004.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: logins
      hasCustomLabel: true
      optionName: metric_fedlogin_count
    - expressionType: SQL
      sqlExpression: "COUNT(DISTINCT source_ip_address)"
      label: distinct_source_ips
      hasCustomLabel: true
      optionName: metric_fedlogin_ips
    - expressionType: SQL
      sqlExpression: "MIN(event_time)"
      label: first_seen
      hasCustomLabel: true
      optionName: metric_fedlogin_first
    - expressionType: SQL
      sqlExpression: "MAX(event_time)"
      label: last_seen
      hasCustomLabel: true
      optionName: metric_fedlogin_last
  groupby:
    - expressionType: SQL
      sqlExpression: "json_extract_string(additional_event_data, '$.federatedProvider')"
      label: federated_provider
      hasCustomLabel: true
    - user_identity_arn
    - geo_country_code
    - geo_org
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: >-
        event_name = 'ConsoleLogin'
        AND json_extract_string(additional_event_data, '$.federatedProvider') IS NOT NULL
      filterOptionName: filter_fedlogin
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 200
  order_desc: true
  page_size: 25
  include_time: false
cache_timeout: null
