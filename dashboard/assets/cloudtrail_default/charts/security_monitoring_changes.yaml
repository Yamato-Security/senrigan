# DSH-22: Security Monitoring & Control Changes
# Table of all CloudTrail events covering security monitoring control changes:
# CloudTrail configuration changes, GuardDuty disabling, Config disabling, VPC Flow Log
# deletion, CloudWatch log deletion, and security service disabling.
# MITRE ATT&CK: TA0005 Defense Evasion
uuid: 22d4e5f6-a7b8-9012-def0-123456789012
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Security Monitoring & Control Changes
viz_type: table
description: >
  Comprehensive catch-all for all defense-evasion events (DSH-22).
  Covers CloudTrail tampering (StopLogging, DeleteTrail), GuardDuty disabling,
  AWS Config disabling, VPC Flow Log deletion, CloudWatch log deletion, and
  security service disabling (SecurityHub, IAM Access Analyzer).
  Any event here warrants immediate investigation.
  For deeper analysis use dedicated charts: VPC Flow Log Changes (DSH-42),
  AWS Config Tampering (DSH-43), EventBridge/CW Tampering (DSH-47).
  MITRE ATT&CK: TA0005 Defense Evasion.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: event_count
      hasCustomLabel: true
      optionName: metric_event_count_de
  groupby:
    - event_time
    - event_name
    - event_source
    - user_identity_arn
    - aws_region
    - source_ip_address
    - geo_country_code
    - geo_city
    - error_code
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: >-
        event_name IN (
          'StopLogging', 'DeleteTrail', 'UpdateTrail', 'PutEventSelectors',
          'DisableDetector', 'DeleteDetector', 'DeletePublishingDestination',
          'DeleteConfigRule', 'StopConfigurationRecorder', 'DeleteDeliveryChannel',
          'DeleteFlowLogs',
          'DeleteLogGroup', 'DeleteLogStream',
          'DisableSecurityHub', 'DeleteAnalyzer'
        )
      filterOptionName: filter_defense_evasion
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 200
  order_desc: true
  page_size: 25
  include_time: false
  # R1-3: flag every defense-evasion row red — any occurrence is critical.
  conditional_formatting:
    - column: event_count
      operator: ">"
      targetValue: 0
      colorScheme: "#E04355"
cache_timeout: null

