# HRM-42: Top Actors Calling High-Risk APIs
# Ranks IAM principals by number of high-risk API calls.
# An unfamiliar ARN at the top of this chart is a strong investigation trigger.
# MITRE ATT&CK: multiple tactics
uuid: 42d4e5f6-a7b8-9012-def0-123456789042
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Top Actors — High-Risk APIs
viz_type: bar
description: >
  IAM principals ranked by total calls to high-risk watchlist APIs (HRM-42).
  Cross-reference with the attack-category chart to see what actions each principal
  is performing.  Service roles making frequent AssumeRole calls are expected;
  human users calling GetSecretValue or DeleteTrail in bulk are not.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: event_count
      hasCustomLabel: true
      optionName: metric_hrm_actor_count
  groupby:
    - user_identity_arn
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      subject: event_name
      operator: IN
      comparator:
        - AssumeRole
        - AssumeRoleWithWebIdentity
        - AttachUserPolicy
        - CreateAccessKey
        - CreateFunction
        - CreateInstanceProfile
        - CreateLoginProfile
        - CreatePolicy
        - CreateRole
        - CreateUser
        - DeletePolicy
        - DeleteTrail
        - DescribeInstances
        - DescribeVpcs
        - DetachPolicy
        - GetAccessKeyLastUsed
        - GetBucketAcl
        - GetBucketPolicy
        - GetCallerIdentity
        - GetParameter
        - GetParameterHistory
        - GetSecretValue
        - InvokeFunction
        - ListAccessKeys
        - ListBuckets
        - ListGroups
        - ListParameters
        - ListRoles
        - ListSecrets
        - ListUsers
        - PassRole
        - PutBucketPolicy
        - PutEventSelectors
        - PutRolePolicy
        - PutUserPolicy
        - RunInstances
        - SendCommand
        - StartInstances
        - StartSession
        - StopLogging
        - UpdateAssumeRolePolicy
        - UpdateTrail
      filterOptionName: filter_hrm_actor
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 20
  order_desc: true
  x_axis_title: IAM Principal ARN
  y_axis_title: Event Count
  color_scheme: supersetColors
cache_timeout: null

# SQL used to power this chart:
# SELECT user_identity_arn, COUNT(*) AS event_count
# FROM cloudtrail_events
# WHERE event_name IN ( ... 42 APIs ... )
# GROUP BY user_identity_arn
# ORDER BY event_count DESC
# LIMIT 20

