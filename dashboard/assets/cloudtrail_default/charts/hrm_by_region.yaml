# HRM-46: High-Risk API Calls by AWS Region
# Ranks AWS regions by number of high-risk API calls.
# Activity in regions not normally used by the organization is suspicious.
# MITRE ATT&CK: multiple tactics
uuid: 46b8c9d0-e1f2-3456-1234-567890123446
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: High-Risk API Calls by Region
viz_type: bar
description: >
  High-risk watchlist API calls distributed by AWS region (HRM-46).
  Activity in regions outside the organization's normal operating footprint —
  e.g. a normally ap-northeast-1 shop seeing activity in eu-west-1 —
  is a strong lateral movement or unauthorized-resource signal.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: event_count
      hasCustomLabel: true
      optionName: metric_hrm_region_count
  groupby:
    - aws_region
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      subject: event_name
      operator: IN
      comparator:
        - AssumeRole
        - AssumeRoleWithWebIdentity
        - AttachUserPolicy
        - CreateAccessKey
        - CreateFunction
        - CreateInstanceProfile
        - CreateLoginProfile
        - CreatePolicy
        - CreateRole
        - CreateUser
        - DeletePolicy
        - DeleteTrail
        - DescribeInstances
        - DescribeVpcs
        - DetachPolicy
        - GetAccessKeyLastUsed
        - GetBucketAcl
        - GetBucketPolicy
        - GetCallerIdentity
        - GetParameter
        - GetParameterHistory
        - GetSecretValue
        - InvokeFunction
        - ListAccessKeys
        - ListBuckets
        - ListGroups
        - ListParameters
        - ListRoles
        - ListSecrets
        - ListUsers
        - PassRole
        - PutBucketPolicy
        - PutEventSelectors
        - PutRolePolicy
        - PutUserPolicy
        - RunInstances
        - SendCommand
        - StartInstances
        - StartSession
        - StopLogging
        - UpdateAssumeRolePolicy
        - UpdateTrail
      filterOptionName: filter_hrm_region
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 30
  order_desc: true
  x_axis_title: AWS Region
  y_axis_title: Event Count
  color_scheme: supersetColors
cache_timeout: null

# SQL used to power this chart:
# SELECT aws_region, COUNT(*) AS event_count
# FROM cloudtrail_events
# WHERE event_name IN ( ... 42 APIs ... )
# GROUP BY aws_region
# ORDER BY event_count DESC
# LIMIT 30

