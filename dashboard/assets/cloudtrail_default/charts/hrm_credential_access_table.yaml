# HRM-45: Credential Access API Event Table
# Detailed table of calls to APIs that retrieve secrets, parameters, or credentials.
# Bulk reads (many rows in a short window) are the primary attacker signal.
# MITRE ATT&CK: TA0006 Credential Access
uuid: 45a7b8c9-d0e1-2345-0123-456789012345
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Credential Access API Events
viz_type: table
description: >
  Detailed event log for APIs used to retrieve secrets and credentials (HRM-45).
  Covers: GetSecretValue (Secrets Manager), GetParameter / GetParameterHistory (SSM).
  A single call may be legitimate; dozens of unique secrets accessed in rapid succession
  is a strong attacker signal.
  MITRE ATT&CK: TA0006 Credential Access.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: event_count
      hasCustomLabel: true
      optionName: metric_hrm_ca_count
  groupby:
    - event_time
    - event_name
    - event_source
    - user_identity_arn
    - aws_region
    - source_ip_address
    - error_code
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      subject: event_name
      operator: IN
      comparator:
        - GetSecretValue
        - GetParameter
        - GetParameterHistory
      filterOptionName: filter_hrm_ca
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 500
  order_desc: true
  page_size: 25
  include_time: false
cache_timeout: null

# SQL used to power this chart:
# SELECT
#     event_time, event_name, event_source, user_identity_arn,
#     aws_region, source_ip_address, error_code,
#     COUNT(*) AS event_count
# FROM cloudtrail_events
# WHERE event_name IN ('GetSecretValue', 'GetParameter', 'GetParameterHistory')
# GROUP BY 1,2,3,4,5,6,7
# ORDER BY event_time DESC
# LIMIT 500

