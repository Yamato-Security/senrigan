# HRM-40: Top High-Risk API Calls (Bar Chart)
# Ranks the 42 abuse-prone API actions by total call count.
# Identifies which high-risk APIs are most frequently invoked in the environment.
# MITRE ATT&CK: multiple tactics
uuid: 40b2c3d4-e5f6-7890-bcde-f01234567840
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Top High-Risk API Calls
viz_type: bar
description: >
  API actions from the high-risk watchlist ranked by total call count (HRM-40).
  Frequent presence of reconnaissance APIs (ListUsers, GetCallerIdentity) is expected
  in many environments; focus investigation on credential-access and defense-evasion
  APIs that appear with unusual volume or from unexpected principals.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: event_count
      hasCustomLabel: true
      optionName: metric_hrm_top_count
  groupby:
    - event_name
  adhoc_filters:
    - clause: WHERE
      expressionType: SIMPLE
      subject: event_name
      operator: IN
      comparator:
        - AssumeRole
        - AssumeRoleWithWebIdentity
        - AttachUserPolicy
        - CreateAccessKey
        - CreateFunction
        - CreateInstanceProfile
        - CreateLoginProfile
        - CreatePolicy
        - CreateRole
        - CreateUser
        - DeletePolicy
        - DeleteTrail
        - DescribeInstances
        - DescribeVpcs
        - DetachPolicy
        - GetAccessKeyLastUsed
        - GetBucketAcl
        - GetBucketPolicy
        - GetCallerIdentity
        - GetParameter
        - GetParameterHistory
        - GetSecretValue
        - InvokeFunction
        - ListAccessKeys
        - ListBuckets
        - ListGroups
        - ListParameters
        - ListRoles
        - ListSecrets
        - ListUsers
        - PassRole
        - PutBucketPolicy
        - PutEventSelectors
        - PutRolePolicy
        - PutUserPolicy
        - RunInstances
        - SendCommand
        - StartInstances
        - StartSession
        - StopLogging
        - UpdateAssumeRolePolicy
        - UpdateTrail
      filterOptionName: filter_hrm_top
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 42
  order_desc: true
  x_axis_title: API Action
  y_axis_title: Event Count
  color_scheme: supersetColors
cache_timeout: null

# SQL used to power this chart:
# SELECT event_name, COUNT(*) AS event_count
# FROM cloudtrail_events
# WHERE event_name IN ( ... 42 APIs ... )
# GROUP BY event_name
# ORDER BY event_count DESC
# LIMIT 42

