# DSH-64: IAM Entity Deletion
# Table of CloudTrail events for Threat Technique Catalog for AWS technique(s) T1070.A001.
# Catalog: https://aws-samples.github.io/threat-technique-catalog-for-aws/Techniques/T1070.A001.html
uuid: e7ea758f-efbb-478f-a557-da8a58e58135
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: IAM Entity Deletion
viz_type: table
description: >
  Deletion of IAM users, roles, policies, and MFA devices used to erase traces of attacker-created identities or lock defenders out.
  Threat Technique Catalog for AWS: T1070.A001.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: event_count
      hasCustomLabel: true
      optionName: metric_iam_entity_deletion_event_count
  groupby:
    - event_time
    - event_name
    - user_identity_arn
    - source_ip_address
    - geo_country_code
    - geo_city
    - aws_region
    - error_code
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: >-
        event_source = 'iam.amazonaws.com'
        AND event_name IN (
          'DeleteUser', 'DeleteRole', 'DeleteAccessKey',
          'DeleteLoginProfile', 'DeletePolicy', 'DeleteRolePolicy',
          'DeleteUserPolicy', 'DeleteGroup', 'DeleteGroupPolicy',
          'DeleteVirtualMFADevice', 'DeactivateMFADevice',
          'DeleteInstanceProfile'
        )
      filterOptionName: filter_iam_entity_deletion
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 100
  order_desc: true
  page_size: 25
  include_time: false
cache_timeout: null
