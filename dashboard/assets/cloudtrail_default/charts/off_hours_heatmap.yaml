# PB-08: Off-Hours Write Activity Heatmap
# Legitimate automation is steady across every night; a person is not, so the
# bright cells in the late-night columns are the ones to read.
# Playbook: IRP-InsiderThreat
uuid: c1a10008-0000-4000-8000-0000000c1a08
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Off-Hours Write Activity (Hour x Day)
viz_type: heatmap
description: >
  Write-event counts as a heatmap of hour-of-day by day-of-week in JST
  (IRP-InsiderThreat). The existing login heatmap covers ConsoleLogin only;
  this one covers every mutating call, which is where bulk off-hours access
  actually shows up. MITRE ATT&CK: TA0009 Collection.
query_context: ""
params:
  x_axis:
    expressionType: SQL
    sqlExpression: >-
      LPAD(
        CAST(EXTRACT(HOUR FROM event_time AT TIME ZONE 'Asia/Tokyo') AS VARCHAR),
        2, '0'
      )
    label: hour_jst
    hasCustomLabel: true
  groupby:
    - expressionType: SQL
      sqlExpression: >-
        CASE EXTRACT(DOW FROM (event_time AT TIME ZONE 'Asia/Tokyo'))
          WHEN 0 THEN '0_Sun'
          WHEN 1 THEN '1_Mon'
          WHEN 2 THEN '2_Tue'
          WHEN 3 THEN '3_Wed'
          WHEN 4 THEN '4_Thu'
          WHEN 5 THEN '5_Fri'
          WHEN 6 THEN '6_Sat'
        END
      label: day_of_week
      hasCustomLabel: true
  metric:
    expressionType: SQL
    sqlExpression: "COUNT(*)"
    label: write_events
    hasCustomLabel: true
    optionName: metric_offhours_writes
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: "read_only IS NOT TRUE"
      filterOptionName: filter_offhours_writes
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 10000
  normalize_across: heatmap
  legend_type: continuous
  linear_color_scheme: fire
  xscale_interval: 1
  yscale_interval: 1
  left_margin: auto
  bottom_margin: auto
  sort_x_axis: alpha_asc
  sort_y_axis: alpha_asc
  show_legend: true
  show_values: false
  show_percentage: false
cache_timeout: null
