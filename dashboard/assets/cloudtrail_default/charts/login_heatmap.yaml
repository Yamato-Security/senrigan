# DSH-19: Console Login Activity Heatmap (Hour-of-Day × Day-of-Week, JST)
# ECharts heatmap of console login counts: hour-of-day (X) × day-of-week (Y), JST.
# Bright cells in off-hours columns (22:00-06:00 JST) or weekend rows surface
# anomalous login time slots pre-attention — far faster than scanning a table.
# MITRE ATT&CK: TA0001 Initial Access
uuid: 19a1b2c3-d4e5-6789-abcd-ef0123456789
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Login Activity Heatmap (Hour x Day)
viz_type: heatmap
description: >
  Console login counts as a heatmap of hour-of-day (X) by day-of-week (Y) in JST
  (DSH-19).  Bright cells in late-night (22:00-06:00 JST) columns or weekend rows
  are a strong indicator of account compromise or credential misuse.
  MITRE ATT&CK: TA0001 Initial Access.
query_context: ""
params:
  x_axis:
    expressionType: SQL
    sqlExpression: >-
      LPAD(
        CAST(EXTRACT(HOUR FROM event_time AT TIME ZONE 'Asia/Tokyo') AS VARCHAR),
        2, '0'
      )
    label: hour_jst
    hasCustomLabel: true
  groupby:
    - expressionType: SQL
      sqlExpression: >-
        CASE EXTRACT(DOW FROM (event_time AT TIME ZONE 'Asia/Tokyo'))
          WHEN 0 THEN '0_Sun'
          WHEN 1 THEN '1_Mon'
          WHEN 2 THEN '2_Tue'
          WHEN 3 THEN '3_Wed'
          WHEN 4 THEN '4_Thu'
          WHEN 5 THEN '5_Fri'
          WHEN 6 THEN '6_Sat'
        END
      label: day_of_week
      hasCustomLabel: true
  metric:
    expressionType: SQL
    sqlExpression: "COUNT(*)"
    label: login_count
    hasCustomLabel: true
    optionName: metric_heatmap_logins
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: "event_source = 'signin.amazonaws.com' AND event_name = 'ConsoleLogin'"
      filterOptionName: filter_heatmap_login
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 10000
  normalize_across: heatmap
  legend_type: continuous
  linear_color_scheme: fire
  xscale_interval: 1
  yscale_interval: 1
  left_margin: auto
  bottom_margin: auto
  sort_x_axis: alpha_asc
  sort_y_axis: alpha_asc
  show_legend: true
  show_values: false
  show_percentage: false
cache_timeout: null

# SQL used to power this chart:
# SELECT
#     LPAD(CAST(
#       EXTRACT(HOUR FROM event_time AT TIME ZONE 'Asia/Tokyo') AS VARCHAR
#     ), 2, '0')                                                  AS hour_jst,
#     CASE EXTRACT(DOW FROM (event_time AT TIME ZONE 'Asia/Tokyo'))
#       WHEN 0 THEN '0_Sun' WHEN 1 THEN '1_Mon' WHEN 2 THEN '2_Tue'
#       WHEN 3 THEN '3_Wed' WHEN 4 THEN '4_Thu' WHEN 5 THEN '5_Fri'
#       WHEN 6 THEN '6_Sat'
#     END                                                        AS day_of_week,
#     COUNT(*)                                                    AS login_count
# FROM cloudtrail_events
# WHERE event_source = 'signin.amazonaws.com'
#   AND event_name   = 'ConsoleLogin'
# GROUP BY 1, 2
