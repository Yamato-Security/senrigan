# PB-11: Cross-Account Object Copy
# Staging data into an account you do not control leaves this trace and no
# other.
# Playbook: IRP-PersonalDataBreach
uuid: c1a1000b-0000-4000-8000-0000000c1a0b
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Cross-Account Object Copy
viz_type: table
description: >
  S3 CopyObject calls and PutObject calls carrying an x-amz-copy-source header,
  with source and destination (IRP-PersonalDataBreach). The replication charts
  cover configuration; this covers the individual copies, which need no
  configuration change. MITRE ATT&CK: TA0010 Exfiltration / T1537.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: copies
      hasCustomLabel: true
      optionName: metric_caoc_count
    - expressionType: SQL
      sqlExpression: "MIN(event_time)"
      label: first_seen
      hasCustomLabel: true
      optionName: metric_caoc_first
    - expressionType: SQL
      sqlExpression: "MAX(event_time)"
      label: last_seen
      hasCustomLabel: true
      optionName: metric_caoc_last
  groupby:
    - user_identity_arn
    - expressionType: SQL
      sqlExpression: "json_extract_string(request_parameters, '$.bucketName')"
      label: destination_bucket
      hasCustomLabel: true
    - expressionType: SQL
      sqlExpression: >-
        COALESCE(
          json_extract_string(request_parameters, '$."x-amz-copy-source"'),
          json_extract_string(request_parameters, '$.copySource')
        )
      label: copy_source
      hasCustomLabel: true
    - recipient_account_id
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: >-
        event_source = 's3.amazonaws.com'
        AND (
          event_name = 'CopyObject'
          OR (event_name = 'PutObject' AND request_parameters LIKE '%x-amz-copy-source%')
        )
      filterOptionName: filter_caoc
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 200
  order_desc: true
  page_size: 25
  include_time: false
cache_timeout: null
