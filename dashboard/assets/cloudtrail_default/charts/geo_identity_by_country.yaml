# DSH-80: GeoIP × Identity — IAM Identities by Country
# Table showing which IAM identities are making API calls from each country.
# Identifies identities that are active from unexpected geographic regions,
# which may indicate compromised credentials or unauthorised access.
#
# Note: All geo_* columns are NULL when the ingester was run without a GeoLite2
# database. In that case this chart will show "No data" until GeoIP enrichment
# is performed (run: ingester enrich --geoip-city <path> --geoip-asn <path>).
uuid: 80b1c2d3-e4f5-6789-0123-456789012345
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Identities by Country (user_identity_arn × GeoIP)
viz_type: table
description: >
  Top 50 (user_identity_arn, country) pairs by API call volume (DSH-80). Surfaces
  IAM identities that are active from unexpected geographic regions. An identity
  appearing from a new or foreign country — especially with write events — is a
  high-confidence indicator of credential compromise.
  Requires GeoLite2 enrichment — private/internal IPs and NULL rows are excluded.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: event_count
      hasCustomLabel: true
      optionName: metric_event_count_identity_country
    - expressionType: SQL
      sqlExpression: "COUNT(CASE WHEN read_only = false THEN 1 END)"
      label: write_count
      hasCustomLabel: true
      optionName: metric_write_count_identity_country
    - expressionType: SQL
      sqlExpression: "COUNT(DISTINCT event_name)"
      label: distinct_apis
      hasCustomLabel: true
      optionName: metric_distinct_apis_identity_country
  groupby:
    - user_identity_arn
    - geo_country_name
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: "geo_country_code IS NOT NULL AND geo_country_code NOT IN ('PRIVATE', 'LOOPBACK', 'LINK-LOCAL', 'SPECIAL')"
      filterOptionName: filter_geo_external_identity
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 50
  order_desc: true
  page_size: 25
cache_timeout: null

# SQL used to power this chart:
# SELECT
#     user_identity_arn,
#     geo_country_name,
#     COUNT(*)                                             AS event_count,
#     COUNT(CASE WHEN read_only = false THEN 1 END)        AS write_count,
#     COUNT(DISTINCT event_name)                           AS distinct_apis
# FROM cloudtrail_events
# WHERE geo_country_code IS NOT NULL
#   AND geo_country_code NOT IN ('PRIVATE', 'LOOPBACK', 'LINK-LOCAL', 'SPECIAL')
# GROUP BY user_identity_arn, geo_country_name
# ORDER BY event_count DESC
# LIMIT 50
