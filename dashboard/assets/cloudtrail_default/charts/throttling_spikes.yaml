# DSH-21: Throttling Exception Spikes (Hourly, per Service)
# Stacked bar chart of ThrottlingException and related rate-limit errors
# per AWS service per hour.  Attack tools (Pacu, Prowler, Trivy) issue
# hundreds of API calls per minute and reliably trigger throttling.
# MITRE ATT&CK: TA0007 Discovery
uuid: 21c3d4e5-f6a7-8901-cdef-012345678901
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Throttling Exception Spikes
viz_type: echarts_timeseries_bar
description: >
  Hourly throttling / rate-limit errors broken down by AWS service (DSH-21).
  ThrottlingException spikes indicate that an identity (or tool) is issuing
  API calls far faster than expected, which is a hallmark of automated attack
  tooling performing reconnaissance or enumeration.
  MITRE ATT&CK: TA0007 Discovery.
query_context: ""
params:
  x_axis: event_time
  time_grain_sqla: PT1H
  time_range: "No filter"
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: throttle_count
      hasCustomLabel: true
      optionName: metric_throttle_count
    - expressionType: SQL
      sqlExpression: "COUNT(DISTINCT user_identity_arn)"
      label: affected_principals
      hasCustomLabel: true
      optionName: metric_affected_principals
  groupby:
    - event_source
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: >-
        error_code IN (
          'ThrottlingException', 'Throttling',
          'RequestLimitExceeded', 'TooManyRequestsException',
          'ServiceUnavailableException'
        )
      filterOptionName: filter_throttling
  row_limit: 10000
  order_desc: true
  stack: true
  x_axis_title: Time
  y_axis_title: Throttling Errors
  color_scheme: supersetColors
  rich_tooltip: true
  zoomable: true
cache_timeout: null

# SQL used to power this chart:
# SELECT
#     DATE_TRUNC('hour', event_time)                  AS hour_bucket,
#     event_source,
#     COUNT(*)                                         AS throttle_count,
#     COUNT(DISTINCT user_identity_arn)                AS affected_principals
# FROM cloudtrail_events
# WHERE error_code IN (
#     'ThrottlingException', 'Throttling',
#     'RequestLimitExceeded', 'TooManyRequestsException',
#     'ServiceUnavailableException'
# )
# GROUP BY 1, 2
# ORDER BY event_time DESC, throttle_count DESC
# LIMIT 500

