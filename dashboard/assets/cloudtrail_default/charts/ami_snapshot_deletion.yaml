uuid: 8e8a1c97-0b1b-4c8b-bcf4-f68dbfdd7d2a
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: AMI & Snapshot Deletion
viz_type: table
description: >
  Deregistration of AMIs and deletion of EBS snapshots that destroy the recovery baseline during a destructive attack.
  Threat Technique Catalog for AWS: T1485.A002.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: event_count
      hasCustomLabel: true
      optionName: metric_ami_snapshot_del_event_count
  groupby:
    - event_time
    - event_name
    - user_identity_arn
    - source_ip_address
    - geo_country_code
    - geo_city
    - aws_region
    - error_code
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: >-
        event_source = 'ec2.amazonaws.com'
        AND event_name IN ('DeregisterImage', 'DeleteSnapshot')
      filterOptionName: filter_ami_snapshot_del
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 100
  order_desc: true
  page_size: 25
  include_time: false
cache_timeout: null
