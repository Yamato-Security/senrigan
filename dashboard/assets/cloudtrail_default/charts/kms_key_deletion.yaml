# DSH-66: KMS Key Deletion & Disable Events
# Table of KMS key deletion scheduling, disabling, and rotation disabling events.
# AWS KMS keys protect virtually all encrypted data in an account:
# S3 server-side encryption, RDS storage encryption, EBS volume encryption,
# Secrets Manager secrets, and SSM Parameter Store SecureString values.
# Disabling or scheduling deletion of KMS keys makes all data encrypted
# under those keys permanently inaccessible — a sophisticated form of data
# destruction that leaves no obvious evidence of file deletion.
# ScheduleKeyDeletion has a minimum waiting period (7-30 days); monitoring
# for this event provides a window to cancel before data loss occurs.
# MITRE ATT&CK: TA0040 Impact / T1485 Data Destruction
uuid: 73c3d4e5-f6a7-8901-cdef-730000000073
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: KMS Key Deletion & Disable Events
viz_type: table
description: >
  KMS key deletion, disabling, and rotation management events (DSH-66).
  ScheduleKeyDeletion — schedules key deletion (7-30 day window to cancel).
  DisableKey — immediately stops encryption/decryption with the key.
  DeleteImportedKeyMaterial — destroys the key material for imported keys instantly.
  DisableKeyRotation — prevents automatic annual key rotation.
  Any of these events renders all data encrypted under the key permanently
  inaccessible.  Use CancelKeyDeletion to reverse ScheduleKeyDeletion before
  the deletion date.
  MITRE ATT&CK: TA0040 Impact / T1485 Data Destruction.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: event_count
      hasCustomLabel: true
      optionName: metric_kms_destruction_count
  groupby:
    - event_time
    - event_name
    - user_identity_arn
    - aws_region
    - source_ip_address
    - geo_country_code
    - geo_city
    - error_code
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: >-
        event_source = 'kms.amazonaws.com'
        AND event_name IN (
          'ScheduleKeyDeletion',      'CancelKeyDeletion',
          'DisableKey',               'EnableKey',
          'DeleteImportedKeyMaterial','DisableKeyRotation',
          'DeleteCustomKeyStore',     'DisconnectCustomKeyStore'
        )
      filterOptionName: filter_kms_destruction
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 200
  order_desc: true
  page_size: 25
  include_time: false
cache_timeout: null

# SQL used to power this chart:
# SELECT
#     event_time,
#     event_name,
#     user_identity_arn,
#     aws_region,
#     json_extract_string(request_parameters, '$.keyId')              AS key_id,
#     json_extract_string(request_parameters, '$.pendingWindowInDays') AS pending_days,
#     source_ip_address,
#     error_code
# FROM cloudtrail_events
# WHERE event_source = 'kms.amazonaws.com'
#   AND event_name IN (
#       'ScheduleKeyDeletion',    'CancelKeyDeletion',
#       'DisableKey',             'EnableKey',
#       'DeleteImportedKeyMaterial', 'DisableKeyRotation',
#       'DeleteCustomKeyStore',   'DisconnectCustomKeyStore'
#   )
# ORDER BY event_time DESC
# LIMIT 200
