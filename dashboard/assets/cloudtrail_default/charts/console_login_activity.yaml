# DSH-08: Console Login Activity
# Table showing AWS Management Console sign-in attempts with success/failure
# and MFA-less count breakdown.  Failed sign-ins may indicate brute-force
# attacks or credential stuffing.  MFA-less logins are a high-priority alert.
uuid: c1d2e3f4-a5b6-7890-abcd-ef0123456789
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Console Login Activity
viz_type: table
description: >
  AWS Management Console sign-in events grouped by IAM identity (DSH-08).
  Tracks successful, failed, and MFA-less login attempts.  A high
  failure-to-success ratio may indicate brute-force or credential stuffing.
  mfa_less_count (MFAUsed = 'No') is a direct account-compromise indicator,
  though it only applies to classic ConsoleLogin events -- the newer OAuth2
  sign-in flow (CreateOAuth2Token / AuthorizeOAuth2Access) does not report
  MFA status.
  Events are filtered to event_type = 'AwsConsoleSignIn'.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: total_logins
      hasCustomLabel: true
      optionName: metric_total_logins
    - expressionType: SQL
      sqlExpression: >-
        COUNT(*) FILTER (
          WHERE json_extract_string(response_elements, '$.ConsoleLogin') = 'Failure'
             OR json_extract_string(additional_event_data, '$.success') = 'false'
        )
      label: failed_logins
      hasCustomLabel: true
      optionName: metric_failed_logins
    - expressionType: SQL
      sqlExpression: >-
        COUNT(*) FILTER (
          WHERE json_extract_string(response_elements, '$.ConsoleLogin') = 'Success'
             OR json_extract_string(additional_event_data, '$.success') = 'true'
        )
      label: success_logins
      hasCustomLabel: true
      optionName: metric_success_logins
    - expressionType: SQL
      sqlExpression: >-
        COUNT(*) FILTER (
          WHERE json_extract_string(additional_event_data, '$.MFAUsed') = 'No'
        )
      label: mfa_less_count
      hasCustomLabel: true
      optionName: metric_mfa_less_count
  groupby:
    - user_identity_arn
    - source_ip_address
    - geo_country_code
  granularity_sqla: event_time
  time_range: "No filter"
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: >-
        event_source = 'signin.amazonaws.com'
        AND event_name IN ('ConsoleLogin', 'CreateOAuth2Token', 'AuthorizeOAuth2Access')
      filterOptionName: filter_event_type
  row_limit: 50
  order_desc: true
  page_size: 25
cache_timeout: null

