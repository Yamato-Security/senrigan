# DSH-37: Dormant Accounts Reactivated
# Identifies IAM identities that were mostly inactive over the observed window
# (active_span >= 3 days but few total events) — a heuristic for credentials
# that sat dormant and were recently weaponised.
# Note: This is a span-based heuristic (MIN/MAX timestamps), not a precise
# gap detector.  Precise 72-hour gap detection requires a LAG() window function
# which is not supported in Superset's native chart params.  Use the
# Event Velocity Spikes chart (DSH-38) to cross-check burst activity.
# MITRE ATT&CK: TA0001 Initial Access / TA0003 Persistence
uuid: 37a8b9c0-d1e2-3456-0123-456789012307
version: 1.0.0
dataset_uuid: d8444b4a-ac55-4710-a777-a5b940bebabe
slice_name: Dormant Accounts Reactivated
viz_type: table
description: >
  Identities with inactivity gaps of 72+ hours that resumed activity (DSH-37).
  A classic pattern of compromised dormant credentials being weaponized.
  Shows the maximum gap in hours/days between consecutive events per identity.
  MITRE ATT&CK: TA0001 Initial Access / TA0003 Persistence.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: "MIN(event_time)"
      label: first_seen
      hasCustomLabel: true
      optionName: metric_dormant_first
    - expressionType: SQL
      sqlExpression: "MAX(event_time)"
      label: last_seen
      hasCustomLabel: true
      optionName: metric_dormant_last
    - expressionType: SQL
      sqlExpression: "COUNT(*)"
      label: total_events
      hasCustomLabel: true
      optionName: metric_dormant_total
    - expressionType: SQL
      sqlExpression: "DATEDIFF('day', MIN(event_time), MAX(event_time))"
      label: active_span_days
      hasCustomLabel: true
      optionName: metric_dormant_span
  groupby:
    - user_identity_arn
    - user_identity_type
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: "user_identity_arn IS NOT NULL"
      filterOptionName: filter_dormant_notnull
    - clause: HAVING
      expressionType: SQL
      sqlExpression: "DATEDIFF('day', MIN(event_time), MAX(event_time)) >= 3"
      filterOptionName: filter_dormant_gap
  granularity_sqla: event_time
  time_range: "No filter"
  row_limit: 50
  order_desc: true
  page_size: 50
cache_timeout: null

# SQL used to power this chart (simplified version using span heuristic):
# SELECT
#     user_identity_arn,
#     user_identity_type,
#     MIN(event_time) AS first_seen,
#     MAX(event_time) AS last_seen,
#     COUNT(*)        AS total_events,
#     DATEDIFF('day', MIN(event_time), MAX(event_time)) AS active_span_days
# FROM cloudtrail_events
# WHERE user_identity_arn IS NOT NULL
# GROUP BY user_identity_arn, user_identity_type
# HAVING active_span_days >= 3
# -- Removed: AND total_events <= 100 (excluded high-activity attackers)
# ORDER BY active_span_days DESC
# LIMIT 50

