# SZK-55: Suzaku Run Info (provenance)
# Which Suzaku run this dashboard is reading, straight from the file's own
# suzaku_meta row. The first thing to check when a number looks wrong: it shows
# the command line, the rule set and how much log data was actually scanned.
#
# Senrigan never imports Suzaku output — the dashboard queries the .duckdb file
# in place — so provenance is per-file, not per-import. `generated_at` is when
# Suzaku ran, which is why the dashboard's Date Range filter excludes this tab.
uuid: 5a021006-0000-4000-8000-000000000055
version: 1.0.0
dataset_uuid: 5a021002-0000-4000-8000-000000000007
slice_name: Suzaku Run Info
viz_type: table
description: >
  Provenance of the Suzaku aws-ct-timeline file behind this dashboard (SZK-55):
  the command line, Suzaku and rule-set versions, how many files and events were
  scanned, how many detections were written and how many duplicates were
  dropped. Confirm this is the run you think it is before drawing conclusions.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: MAX(scanned_files)
      label: files_scanned
      hasCustomLabel: true
      optionName: metric_szk55_files
    - expressionType: SQL
      sqlExpression: MAX(scanned_events)
      label: events_scanned
      hasCustomLabel: true
      optionName: metric_szk55_events
    - expressionType: SQL
      sqlExpression: MAX(rules_count)
      label: rules_loaded
      hasCustomLabel: true
      optionName: metric_szk55_rules
    - expressionType: SQL
      sqlExpression: MAX(output_rows)
      label: detections_written
      hasCustomLabel: true
      optionName: metric_szk55_rows
    - expressionType: SQL
      sqlExpression: MAX(duplicate_rows_removed)
      label: duplicates_removed
      hasCustomLabel: true
      optionName: metric_szk55_dupes
  groupby:
    - command
    - command_line
    - suzaku_version
    - rules_version
    - timestamp_tz
  adhoc_filters: []
  granularity_sqla: generated_at
  time_range: No filter
  row_limit: 10
  order_desc: true
  page_size: 10
cache_timeout: null

# SQL used to power this chart:
# SELECT command, command_line, suzaku_version, rules_version, timestamp_tz,
#        MAX(scanned_files) AS files_scanned, MAX(scanned_events) AS events_scanned,
#        MAX(rules_count) AS rules_loaded, MAX(output_rows) AS detections_written,
#        MAX(duplicate_rows_removed) AS duplicates_removed
# FROM suzaku_timeline_meta GROUP BY 1, 2, 3, 4, 5
