# SZK-12: Detection Timeline (event level)
# One row per rule hit, newest first — the 'what happened, when, and to
# whom' listing the rest of the dashboard drills into.
# No geo columns: Suzaku's `timeline` table has none,
# so the region takes their place as the 'where' of a detection.
# Sorted by event_time DESC; use the dashboard filters to narrow it.
uuid: 5a021006-0000-4000-8000-000000000012
version: 1.0.0
dataset_uuid: 5a021002-0000-4000-8000-000000000001
slice_name: Detection Timeline
viz_type: table
description: >
  Event-level listing of every Suzaku detection: timestamp, severity, rule,
  principal, source, and outcome (SZK-12). This is the master timeline — every
  other chart on this dashboard is a different way of slicing it. Cross-filter
  from any chart to scope it.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: MAX(level_rank)
      label: severity_rank
      hasCustomLabel: true
      optionName: metric_szk12_severity_rank
  groupby:
    - event_time
    - level
    - rule_title
    - event_name
    - user_name
    - src_ip
    - aws_region
    - outcome
  adhoc_filters: []
  granularity_sqla: event_time
  time_range: No filter
  row_limit: 1000
  order_desc: true
  page_size: 100
cache_timeout: null

# SQL used to power this chart:
# SELECT event_time, level, rule_title, event_name, user_name,
#        src_ip, aws_region, outcome
# FROM suzaku_timeline ORDER BY event_time DESC LIMIT 1000
