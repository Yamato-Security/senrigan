# SZK-46: Daily Severity Trend
# The day-level view of SZK-09. Best chart for a report: it shows the
# whole engagement window and the day severity escalated.
uuid: 5a021006-0000-4000-8000-000000000046
version: 1.0.0
dataset_uuid: 5a021002-0000-4000-8000-000000000001
slice_name: Daily Severity Trend
viz_type: echarts_timeseries_bar
description: >
  Daily detection volume stacked by severity (SZK-46). The report-ready
  companion to the hourly SZK-09: it fits a long engagement window on one
  screen and makes the day severity escalated obvious.
query_context: ""
params:
  x_axis: event_time
  time_grain_sqla: P1D
  granularity_sqla: event_time
  time_range: No filter
  metrics:
    - expressionType: SQL
      sqlExpression: COUNT(*)
      label: detections
      hasCustomLabel: true
      optionName: metric_szk46_detections
  groupby:
    - level
  adhoc_filters: []
  row_limit: 10000
  stack: true
  x_axis_title: Date (UTC)
  y_axis_title: Detections
  color_scheme: supersetColors
  rich_tooltip: true
  zoomable: true
cache_timeout: null

# SQL used to power this chart:
# SELECT DATE_TRUNC('day', event_time) AS day_bucket, level, COUNT(*)
# FROM suzaku_timeline GROUP BY 1, 2 ORDER BY 1
