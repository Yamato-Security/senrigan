# SZK-34: Rare User Agents — least frequent first
# Attacker tooling is by definition rare in a victim environment, so the
# bottom of the user-agent distribution is where it shows up.
# order_desc: false makes this the ascending mirror of SZK-33.
uuid: 5a021006-0000-4000-8000-000000000034
version: 1.0.0
dataset_uuid: 5a021002-0000-4000-8000-000000000001
slice_name: Rare User Agents
viz_type: table
description: >
  User agents with the fewest detections, rarest first (SZK-34). Offensive
  tooling appears once or twice in an environment where everything else runs
  the same SDK version, so the tail of this distribution is where it surfaces.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: COUNT(*)
      label: detections
      hasCustomLabel: true
      optionName: metric_szk34_detections
    - expressionType: SQL
      sqlExpression: MIN(event_time)
      label: first_seen
      hasCustomLabel: true
      optionName: metric_szk34_first
    - expressionType: SQL
      sqlExpression: MAX(event_time)
      label: last_seen
      hasCustomLabel: true
      optionName: metric_szk34_last
  groupby:
    - user_agent
    - user_name
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: user_agent IS NOT NULL
      filterOptionName: filter_szk34_ua_notnull
  granularity_sqla: event_time
  time_range: No filter
  row_limit: 25
  order_desc: false
  page_size: 25
cache_timeout: null

# SQL used to power this chart:
# SELECT user_agent, user_name, COUNT(*) AS detections,
#        MIN(event_time) AS first_seen, MAX(event_time) AS last_seen
# FROM suzaku_timeline WHERE user_agent IS NOT NULL
# GROUP BY 1, 2 ORDER BY detections ASC LIMIT 25
