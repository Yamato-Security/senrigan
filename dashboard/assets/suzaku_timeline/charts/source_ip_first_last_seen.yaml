# SZK-48: First / Last Seen per Source IP
# The network counterpart of SZK-47. `timeline` has no geo columns
# (PLAN_SUZAKU_SCHEMA P8), so an address is characterised by its span.
uuid: 5a021006-0000-4000-8000-000000000048
version: 1.0.0
dataset_uuid: 5a021002-0000-4000-8000-000000000001
slice_name: First / Last Seen per Source IP
viz_type: table
description: >
  Each source IP's first and last detection and its active span (SZK-48). An address that appears for the first time part way through
  the timeline, and is never seen again, is an excellent indicator of
  compromise to hand to network defence.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: MIN(event_time)
      label: first_seen
      hasCustomLabel: true
      optionName: metric_szk48_first
    - expressionType: SQL
      sqlExpression: MAX(event_time)
      label: last_seen
      hasCustomLabel: true
      optionName: metric_szk48_last
    - expressionType: SQL
      sqlExpression: DATEDIFF('minute', MIN(event_time), MAX(event_time))
      label: active_span_minutes
      hasCustomLabel: true
      optionName: metric_szk48_span
    - expressionType: SQL
      sqlExpression: COUNT(*)
      label: detections
      hasCustomLabel: true
      optionName: metric_szk48_detections
  groupby:
    - src_ip
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: src_ip IS NOT NULL
      filterOptionName: filter_szk48_ip_notnull
  granularity_sqla: event_time
  time_range: No filter
  row_limit: 250
  order_desc: true
  page_size: 50
cache_timeout: null

# SQL used to power this chart:
# SELECT src_ip,
#        MIN(event_time) AS first_seen, MAX(event_time) AS last_seen,
#        DATEDIFF('minute', MIN(event_time), MAX(event_time)) AS active_span_minutes,
#        COUNT(*) AS detections
# FROM suzaku_timeline WHERE src_ip IS NOT NULL
# GROUP BY 1 ORDER BY first_seen DESC
