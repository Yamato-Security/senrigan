# SZK-43: Detection Heatmap — hour-of-day × day-of-week (UTC)
# Bright cells outside business hours, or on weekend rows, surface
# anomalous activity windows before any table is read.
# Hours are UTC: Suzaku writes UTC by default and the importer converts
# --localtime output back to UTC, so the whole database is one timeline.
uuid: 5a021006-0000-4000-8000-000000000043
version: 1.0.0
dataset_uuid: 5a021002-0000-4000-8000-000000000001
slice_name: Detection Heatmap (Hour x Day)
viz_type: heatmap
description: >
  Detections as a heatmap of hour-of-day against day-of-week, in UTC (SZK-43).
  Bright cells in off-hours columns or weekend rows are the fastest way to
  spot activity that does not match how the environment is normally used. All
  timestamps are normalised to UTC on import.
query_context: ""
params:
  x_axis:
    expressionType: SQL
    sqlExpression: LPAD(CAST(EXTRACT(HOUR FROM event_time) AS VARCHAR), 2, '0')
    label: hour_utc
    hasCustomLabel: true
  groupby:
    - expressionType: SQL
      sqlExpression: CASE EXTRACT(DOW FROM event_time) WHEN 0 THEN '0_Sun' WHEN 1 THEN '1_Mon' WHEN 2 THEN
        '2_Tue' WHEN 3 THEN '3_Wed' WHEN 4 THEN '4_Thu' WHEN 5 THEN '5_Fri' WHEN 6 THEN '6_Sat' END
      label: day_of_week
      hasCustomLabel: true
  metric:
    expressionType: SQL
    sqlExpression: COUNT(*)
    label: detections
    hasCustomLabel: true
    optionName: metric_szk43_detections
  adhoc_filters: []
  granularity_sqla: event_time
  time_range: No filter
  row_limit: 10000
  normalize_across: heatmap
  legend_type: continuous
  linear_color_scheme: fire
  xscale_interval: 1
  yscale_interval: 1
  left_margin: auto
  bottom_margin: auto
  sort_x_axis: alpha_asc
  sort_y_axis: alpha_asc
  show_legend: true
  show_values: false
  show_percentage: false
cache_timeout: null

# SQL used to power this chart:
# SELECT LPAD(CAST(EXTRACT(HOUR FROM event_time) AS VARCHAR), 2, '0') AS hour_utc,
#        CASE EXTRACT(DOW FROM event_time) WHEN 0 THEN '0_Sun' ... END AS day_of_week,
#        COUNT(*) AS detections
# FROM suzaku_timeline GROUP BY 1, 2
