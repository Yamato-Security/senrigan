# SZK-35: Detections by Account
# Per-account rollup for multi-account organisations: which account is
# carrying the findings, and how bad they get.
uuid: 5a021006-0000-4000-8000-000000000035
version: 1.0.0
dataset_uuid: 5a021002-0000-4000-8000-000000000001
slice_name: Detections by Account
viz_type: table
description: >
  Detections rolled up per AWS account, with the worst severity reached and
  the distinct principals and rules involved (SZK-35). For a Suzaku run over
  an organisation trail this is the first cut: it tells you which account the
  incident lives in.
query_context: ""
params:
  metrics:
    - expressionType: SQL
      sqlExpression: COUNT(*)
      label: detections
      hasCustomLabel: true
      optionName: metric_szk35_detections
    - expressionType: SQL
      sqlExpression: MAX(level_rank)
      label: max_severity_rank
      hasCustomLabel: true
      optionName: metric_szk35_sev
    - expressionType: SQL
      sqlExpression: COUNT(DISTINCT COALESCE(user_arn, user_name))
      label: distinct_principals
      hasCustomLabel: true
      optionName: metric_szk35_users
    - expressionType: SQL
      sqlExpression: COUNT(DISTINCT rule_title)
      label: distinct_rules
      hasCustomLabel: true
      optionName: metric_szk35_rules
    - expressionType: SQL
      sqlExpression: MIN(event_time)
      label: first_seen
      hasCustomLabel: true
      optionName: metric_szk35_first
    - expressionType: SQL
      sqlExpression: MAX(event_time)
      label: last_seen
      hasCustomLabel: true
      optionName: metric_szk35_last
  groupby:
    - user_account_id
  adhoc_filters:
    - clause: WHERE
      expressionType: SQL
      sqlExpression: user_account_id IS NOT NULL
      filterOptionName: filter_szk35_account_notnull
  granularity_sqla: event_time
  time_range: No filter
  row_limit: 100
  order_desc: true
  page_size: 50
cache_timeout: null

# SQL used to power this chart:
# SELECT user_account_id, COUNT(*) AS detections,
#        MAX(level_rank) AS max_severity_rank,
#        COUNT(DISTINCT COALESCE(user_arn, user_name)) AS distinct_principals,
#        COUNT(DISTINCT rule_title) AS distinct_rules,
#        MIN(event_time) AS first_seen, MAX(event_time) AS last_seen
# FROM suzaku_timeline WHERE user_account_id IS NOT NULL
# GROUP BY 1 ORDER BY detections DESC
