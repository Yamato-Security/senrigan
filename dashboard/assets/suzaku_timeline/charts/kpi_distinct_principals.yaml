    hasCustomLabel: true
    optionName: metric_szk04_distinct_principals
  adhoc_filters: []
  subheader: Identities seen
  granularity_sqla: event_time
  time_range: No filter
  header_font_size: 0.4
  subheader_font_size: 0.125
  y_axis_format: SMART_NUMBER
