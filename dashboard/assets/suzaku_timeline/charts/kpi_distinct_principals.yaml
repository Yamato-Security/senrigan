# SZK-04: Principals Involved (KPI)
# Distinct identities behind the detections (ARN where available,
# otherwise the user name — Azure/M365 timelines have no ARN).
uuid: 5a021006-0000-4000-8000-000000000004
version: 1.0.0
dataset_uuid: 5a021002-0000-4000-8000-000000000001
slice_name: Principals Involved
viz_type: big_number_total
description: >
  Distinct identities responsible for the detections (SZK-04). Uses the IAM
  ARN when the timeline carries one and falls back to the user name, so AWS
  and Azure/M365 detections are counted the same way.
query_context: ""
params:
  metric:
    expressionType: SQL
    sqlExpression: COUNT(DISTINCT COALESCE(user_arn, user_name))
