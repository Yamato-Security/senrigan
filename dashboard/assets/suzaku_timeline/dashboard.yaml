    defaultDataMask:
      filterState:
        value: No filter
    controlValues:
      enableEmptyFilter: false
    cascadeParentIds: []
    scope:
      rootPath:
      - ROOT_ID
      excluded:
      - 50
    type: NATIVE_FILTER
    description: 'Filter every chart by detection time. Suzaku Run Info is excluded: its timestamp is when Suzaku ran, not when anything was detected.'
    chartsInScope: []
    tabsInScope: []
  - id: NATIVE_FILTER-level
    name: Severity
    filterType: filter_select
    targets:
    - column:
        name: level
      datasetUuid: 5a021002-0000-4000-8000-000000000001
    defaultDataMask:
      filterState:
        value: null
    controlValues:
      enableEmptyFilter: false
      defaultToFirstItem: false
      multiSelect: true
      searchAllOptions: false
      inverseSelection: false
    cascadeParentIds: []
    scope:
      rootPath:
      - ROOT_ID
      excluded: []
    type: NATIVE_FILTER
    description: Restrict the detection charts to one or more Suzaku severity levels
    chartsInScope: []
    tabsInScope: []
  - id: NATIVE_FILTER-level-attack
    name: Severity (ATT&CK)
    filterType: filter_select
