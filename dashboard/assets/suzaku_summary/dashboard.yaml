  charts:
  - slice_name: Profiled Identities
    viz_type: big_number_total
    description: How many identities Suzaku profiled (SZS-01). The denominator for every per-identity
      ratio on this dashboard.
  - slice_name: Total Events
    viz_type: big_number_total
    description: CloudTrail events across the profiled identities (SZS-02). Establishes the size of the
      dataset the profiles were built from.
  - slice_name: Distinct Abused APIs
    viz_type: big_number_total
    description: Number of distinct APIs Suzaku classifies as abusable that were actually called (SZS-03).
      A rising count means broader adversary capability.
  - slice_name: Failed Abuse Attempts
    viz_type: big_number_total
    description: Calls to abusable APIs that were denied (SZS-04). The clearest permission-probing signal
      in the summary output.
  - slice_name: Distinct Source IPs
    viz_type: big_number_total
    description: 'Distinct source IP addresses across all identities (SZS-05). Compare with the identity
      count: many IPs per identity suggests shared or roaming credentials.'
  - slice_name: Distinct Access Keys
    viz_type: big_number_total
    description: Distinct access key IDs observed (SZS-06). Long-lived keys are the most commonly leaked
      AWS credential.
  - slice_name: Identity Triage Table
    viz_type: table
    description: 'Every profiled identity with its event volume, abusable-API usage and activity window
      (SZS-10). Sort by Abused (Failed) to find probing, by Abused (Success) to '
  - slice_name: Top Identities by Event Volume
    viz_type: dist_bar
    description: The busiest identities (SZS-11). Volume alone is not suspicious, but an unexpected identity
      at the top of this chart usually is.
  - slice_name: Identity Type Composition
    viz_type: pie
    description: Split of profiled identities by type (SZS-13). Root appearing at all is worth a look;
      a large AssumedRole share is normal in an automated account.
  - slice_name: Abused vs Other API Calls per Identity
    viz_type: dist_bar
    description: For each identity, how much of its API activity Suzaku classifies as abusable (SZS-12).
      A high abused share on a service account is a strong lead.
  - slice_name: Identity Activity Span
    viz_type: table
    description: How long each identity was active and how widely it operated (SZS-14). Many source IPs
      or regions for one identity suggests shared or stolen credentials.
  - slice_name: Top Abused APIs
    viz_type: dist_bar
    description: The abusable APIs called most often (SZS-20). Read alongside the API catalogue table,
      which carries Suzaku's explanation of why each one matters.
  - slice_name: Top Failed API Calls
    viz_type: dist_bar
    description: APIs whose calls were denied most often (SZS-21). Repeated denials on sensitive APIs
      are permission probing, not misconfiguration.
  - slice_name: Abused APIs by AWS Service
    viz_type: dist_bar
    description: Abusable API calls grouped by AWS service (SZS-22). Concentration in IAM or STS points
      at privilege escalation; in EC2 or S3, at resource abuse or exfiltration.
  - slice_name: Abused API Catalogue
    viz_type: table
    description: Each abusable API that was called, with Suzaku's description of how it is abused (SZS-23)
      — the highest-value column in the aws-ct-summary output.
  - slice_name: Top Attribute Values
    viz_type: dist_bar
    description: The most frequently observed values for whichever attribute is selected in the Attribute
      filter (SZS-30) — source IPs by default.
  - slice_name: Rare Attribute Values
    viz_type: table
    description: 'Values seen only a handful of times (SZS-31). The same reasoning as the Rare Events
      dashboard: in a large dataset, rarity is the cheapest anomaly signal.'
  - slice_name: Attribute First / Last Seen
    viz_type: table
    description: First and last observation of every attribute value (SZS-32). A value that appears only
      at the end of the timeline is a new — and therefore interesting — one.
