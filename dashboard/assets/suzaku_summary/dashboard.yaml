# Suzaku Identity Summary — Dashboard Definition
#
# Layout follows cloudtrail_default: an Overview tab of KPI cards first, then
# themed tabs. The tabs are shaped by what aws-ct-summary actually contains —
# identities, their API calls split into abusable/other, and their attributes —
# rather than by the CloudTrail categories used in the main dashboard.
#
# Charts SZS-01..SZS-06 (KPI cards), SZS-10..SZS-14 (Identities),
# SZS-20..SZS-23 (API Abuse), SZS-30..SZS-32 (Attributes).
#
# Generated layout: edit charts/*.yaml and this file, then rebuild the ZIP:
#   python3 assets/rebuild_suzaku_summary_zip.py
#   cd docker && docker compose run --rm superset-init
