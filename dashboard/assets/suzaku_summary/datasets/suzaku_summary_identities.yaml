metrics:
  - metric_name: count
    verbose_name: "COUNT(*)"
    metric_type: count
    expression: "COUNT(*)"
    description: Number of identities

  - metric_name: identity_count
    verbose_name: Identities
    metric_type: count
    expression: "COUNT(*)"
    description: Number of identities (alias for count)

  - metric_name: total_events
    verbose_name: Total Events
    metric_type: sum
    expression: "SUM(num_of_events)"
    description: CloudTrail events across the selected identities

  - metric_name: abused_success_total
    verbose_name: Abused (Success)
    metric_type: sum
    expression: "SUM(abused_success)"
    description: Successful abusable-API calls

  - metric_name: abused_failed_total
    verbose_name: Abused (Failed)
    metric_type: sum
    expression: "SUM(abused_failed)"
    description: Failed abusable-API calls — permission probing

  - metric_name: other_total
    verbose_name: Other API Calls
    metric_type: sum
    expression: "SUM(other_success) + SUM(other_failed)"
    description: Calls to APIs not classified as abusable

  - metric_name: max_active_days
    verbose_name: Longest Activity Span (days)
    metric_type: max
    expression: "MAX(active_days)"
    description: Longest first-to-last activity window
