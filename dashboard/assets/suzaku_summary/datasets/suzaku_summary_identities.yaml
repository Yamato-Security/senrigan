    description: First activity timestamp (CAST from Suzaku's VARCHAR)

  - column_name: last_seen
    verbose_name: Last Seen
    is_dttm: true
    is_active: true
    type: TIMESTAMP
    groupby: true
    filterable: true
    description: Last activity timestamp (CAST from Suzaku's VARCHAR)

  - column_name: active_days
    verbose_name: Active Days
    is_dttm: false
    is_active: true
    type: BIGINT
    groupby: false
    filterable: true
    description: Days between first and last activity

