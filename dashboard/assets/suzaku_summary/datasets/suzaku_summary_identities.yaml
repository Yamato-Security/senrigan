# Superset dataset: one row per identity in Suzaku's `aws-ct-summary` output.
#
# VIRTUAL (sql:) because the file needs three fixes before a BI tool can use it
# (see doc/PLAN_SUZAKU_SCHEMA.md):
#   * P3 — FirstTimestamp / LastTimestamp are VARCHAR; Superset needs a real
#     temporal column, so they are CAST here once instead of in every chart.
#   * P5 — Category packs two orthogonal axes (abused/other x success/failed)
#     into one string, so the four counts are pivoted out to columns.
#   * P6 — PascalCase identifiers become snake_case, matching every other dataset.
#
# The per-identity attribute counts are joined in so the triage table can show
# "how many IPs / keys / regions did this identity use" without a second chart.
uuid: 5a021002-0000-4000-8000-000000000002
version: 1.0.0
database_uuid: 5a021001-0000-4000-8000-000000000002
table_name: suzaku_summary_identities
main_dttm_col: first_seen
description: >
  Per-identity CloudTrail threat profile from Suzaku aws-ct-summary, with abused
  and other API call counts and distinct attribute counts joined in.
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
sql: |
  SELECT
      s."UserARN"                                   AS user_arn,
      s."UserTypes"                                 AS user_types,
      s."NumOfEvents"                               AS num_of_events,
      CAST(s."FirstTimestamp" AS TIMESTAMP)         AS first_seen,
      CAST(s."LastTimestamp" AS TIMESTAMP)          AS last_seen,
      date_diff('day', CAST(s."FirstTimestamp" AS TIMESTAMP),
                       CAST(s."LastTimestamp" AS TIMESTAMP)) AS active_days,
      coalesce(a.abused_success, 0)                 AS abused_success,
      coalesce(a.abused_failed, 0)                  AS abused_failed,
      coalesce(a.other_success, 0)                  AS other_success,
      coalesce(a.other_failed, 0)                   AS other_failed,
      coalesce(a.abused_apis, 0)                    AS abused_apis,
      coalesce(t.src_ips, 0)                        AS distinct_src_ips,
      coalesce(t.user_agents, 0)                    AS distinct_user_agents,
      coalesce(t.access_keys, 0)                    AS distinct_access_keys,
      coalesce(t.regions, 0)                        AS distinct_regions
  FROM summary s
  LEFT JOIN (
      SELECT "UserARN",
             sum(CASE WHEN "Category" = 'abused_success' THEN "Count" ELSE 0 END) AS abused_success,
             sum(CASE WHEN "Category" = 'abused_failed'  THEN "Count" ELSE 0 END) AS abused_failed,
             sum(CASE WHEN "Category" = 'other_success'  THEN "Count" ELSE 0 END) AS other_success,
             sum(CASE WHEN "Category" = 'other_failed'   THEN "Count" ELSE 0 END) AS other_failed,
             count(DISTINCT CASE WHEN "Category" LIKE 'abused%' THEN "API" END)   AS abused_apis
      FROM summary_api_calls
      GROUP BY "UserARN"
  ) a ON a."UserARN" = s."UserARN"
  LEFT JOIN (
      SELECT "UserARN",
             count(DISTINCT CASE WHEN "Attribute" = 'src_ip'        THEN "Value" END) AS src_ips,
             count(DISTINCT CASE WHEN "Attribute" = 'user_agent'    THEN "Value" END) AS user_agents,
             count(DISTINCT CASE WHEN "Attribute" = 'access_key_id' THEN "Value" END) AS access_keys,
             count(DISTINCT CASE WHEN "Attribute" = 'aws_region'    THEN "Value" END) AS regions
      FROM summary_attributes
      GROUP BY "UserARN"
  ) t ON t."UserARN" = s."UserARN"
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null

columns:
  - column_name: user_arn
