    is_dttm: false
    is_active: true
    type: VARCHAR
    groupby: true
    filterable: true
    description: ARN of the IAM identity Suzaku profiled

  - column_name: user_types
    verbose_name: Identity Type
    is_dttm: false
    is_active: true
    type: VARCHAR
    groupby: true
    filterable: true
    description: Identity type seen for this ARN (Root, IAMUser, AssumedRole)

  - column_name: num_of_events
    verbose_name: Events
    is_dttm: false
    is_active: true
    type: BIGINT
    groupby: false
    filterable: true
    description: Total CloudTrail events attributed to this identity

  - column_name: first_seen
    verbose_name: First Seen
    is_dttm: true
    is_active: true
    type: TIMESTAMP
    groupby: true
