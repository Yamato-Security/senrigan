    verbose_name: Other API Calls (Success)
    is_dttm: false
    is_active: true
    type: BIGINT
    groupby: false
    filterable: true
    description: Successful calls to APIs not classified as abusable

  - column_name: other_failed
    verbose_name: Other API Calls (Failed)
    is_dttm: false
    is_active: true
    type: BIGINT
    groupby: false
    filterable: true
    description: Failed calls to APIs not classified as abusable

  - column_name: abused_apis
    verbose_name: Distinct Abused APIs
    is_dttm: false
    is_active: true
    type: BIGINT
    groupby: false
    filterable: true
    description: Number of distinct abusable APIs this identity called

  - column_name: distinct_src_ips
    verbose_name: Source IPs
    is_dttm: false
    is_active: true
    type: BIGINT
    groupby: false
    filterable: true
    description: Distinct source IP addresses used by this identity

