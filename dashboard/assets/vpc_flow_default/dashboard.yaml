# VPC Flow Logs Threat Hunting — Dashboard Definition
#
# Coverage first: a chart is only meaningful for the subscriptions, fields and
# windows the Coverage tab shows. Charts VFL-01..VFL-50.
#
# Edit charts/*.yaml and this file, then rebuild and re-import:
#   python3 assets/rebuild_vpc_flow_zip.py
#   cd docker && docker compose run --rm superset-init
