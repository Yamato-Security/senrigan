  charts:
  - slice_name: Flow Log Sources
    viz_type: table
    description: Every flow log subscription found in the ingested files, with parse health and logging
      gaps. Rows with issues kept a NULL in a malformed field; rejected rows had the wrong token count
      (raw text in vpc_flow_parse_issues). More than one header variant for one subscription is itself
      suspicious — AWS cannot change a subscription's format.
  - slice_name: Capture Scope from CloudTrail
    viz_type: table
    description: What each subscription captures (resource, ALL / ACCEPT / REJECT) according to CreateFlowLogs
      and DeleteFlowLogs in CloudTrail. A subscription missing here was created before the CloudTrail
      coverage began — its scope is unknown, and a REJECT-only subscription can never show an accepted
      flow.
  - slice_name: NODATA / SKIPDATA Windows
    viz_type: echarts_timeseries_bar
    description: 'Aggregation windows with no traffic (NODATA) or dropped records (SKIPDATA). A SKIPDATA
      window is a gap in the evidence: no chart can show what happened inside it.'
  - slice_name: Records by Direction Source
    viz_type: pie
    description: 'How local and remote endpoints were determined: from the record''s own flow-direction
      (record), from address class alone (heuristic), or not at all (unknown). Direction-based charts
      use recorded rows only, so a large heuristic or unknown share means they see less.'
  - slice_name: Field Availability by Source
    viz_type: table
    description: Share of records carrying each optional field, per subscription. A hunt that depends
      on a field this source does not log cannot find anything there — that is insufficient coverage,
      not a clean result.
  - slice_name: Flow Records
    viz_type: big_number_total
    description: Flow log records with traffic. Each is one observation of a flow on one interface in
      one aggregation window — not a connection count.
  - slice_name: Bytes Observed
    viz_type: big_number_total
    description: Bytes across all observations. Intra-VPC traffic is observed on both interfaces, so this
      over-counts internal volume; BPA records carry no bytes and are excluded.
  - slice_name: REJECT Ratio
    viz_type: big_number_total
    description: 'Share of observations rejected by a security group, network ACL, BPA or encryption controls.
      Read alongside Capture Scope: a REJECT-only subscription is 100%.'
  - slice_name: Distinct External Peers
    viz_type: big_number_total
    description: Distinct public addresses seen as the remote endpoint of a flow with a recorded direction.
  - slice_name: Interfaces Observed
    viz_type: big_number_total
    description: Distinct network interfaces with at least one record, NODATA and SKIPDATA included.
  - slice_name: SKIPDATA Windows
    viz_type: big_number_total
    description: Aggregation windows in which AWS dropped records. Anything inside them is unobserved.
  - slice_name: Flow Records by Action
    viz_type: echarts_timeseries_bar
    description: Hourly observations split by ACCEPT and REJECT. A REJECT spike is usually scanning; an
      ACCEPT spike needs the Egress and Inbound tabs.
  - slice_name: Bytes by Direction
    viz_type: echarts_timeseries_bar
    description: Hourly bytes by ingress and egress, recorded direction only. Sustained egress growth
      on a quiet host is the classic exfiltration shape.
  - slice_name: Top Rejected External Sources
    viz_type: dist_bar
    description: 'External sources with the most rejected inbound observations — scanners and blocked
      brute force. A triage signal, not a finding: confirm with CloudTrail, host evidence and the owner
      of the workload before concluding.'
  - slice_name: Vertical Scan Candidates
    viz_type: table
    description: 'One external source probing many ports on one host. Sorted by distinct destination ports.
      A triage signal, not a finding: confirm with CloudTrail, host evidence and the owner of the workload
      before concluding.'
  - slice_name: Horizontal Scan Candidates
    viz_type: table
    description: 'One external source probing one port across many hosts — sweeps for SSH, RDP or a freshly
      published exploit. A triage signal, not a finding: confirm with CloudTrail, host evidence and the
      owner of the workload before concluding.'
  - slice_name: Internet to Admin / DB Ports — Accepted
    viz_type: table
    description: 'Accepted inbound traffic from the internet to administration and database ports (SSH,
      RDP, WinRM, MySQL, Postgres, MSSQL, Redis, Elasticsearch, MongoDB, Docker, kubelet). ACCEPT means
      the security group allowed it, not that a session was established — check tcp_flags and bytes. A
      triage signal, not a finding: confirm with CloudTrail, host evidence and the owner of the workload
      before concluding.'
  - slice_name: SYN-Only Records from External Sources
    viz_type: dist_bar
    description: 'Inbound observations whose only TCP flag was SYN: handshakes that never completed in
      the window, typical of SYN scans. Flags are OR-ed per window, so a completed short session shows
      3 or 19 instead.'
  - slice_name: REJECT then ACCEPT — Same Peer, Target and Port
    viz_type: table
    description: 'An external peer that was rejected and later accepted on the same target and port —
      the network trace of an opened security group or NACL. Correlate with AuthorizeSecurityGroupIngress
      in CloudTrail. A triage signal, not a finding: confirm with CloudTrail, host evidence and the owner
      of the workload before concluding.'
  - slice_name: Top External Destinations by Bytes
    viz_type: dist_bar
    description: 'External destinations receiving the most accepted egress bytes. A triage signal, not
      a finding: confirm with CloudTrail, host evidence and the owner of the workload before concluding.'
  - slice_name: Egress Volume vs Host Baseline
    viz_type: table
    description: 'Each host''s daily accepted egress to the internet divided by the median of its earlier
      days. Hosts without history have no ratio and are not listed. A triage signal, not a finding: confirm
      with CloudTrail, host evidence and the owner of the workload before concluding.'
  - slice_name: Egress Bytes by Traffic Path
    viz_type: dist_bar
    description: Where egress leaves the VPC. Path 2 means internet gateway OR gateway endpoint and is
      shown as ambiguous rather than counted as either.
  - slice_name: Unusual Destination Ports
    viz_type: table
    description: 'Egress to ports associated with reverse shells (4444, 1337, 31337), IRC (6667), Tor
      (9001, 9030) and mining pools (3333, 5555, 7777, 14444). A triage signal, not a finding: confirm
      with CloudTrail, host evidence and the owner of the workload before concluding.'
  - slice_name: DNS to Non-Amazon Resolvers
    viz_type: table
    description: Port-53 flows. Traffic to the Amazon-provided resolver is never logged, so every row
      here went to another resolver — legitimate internal DNS servers become the baseline, anything else
      is DNS bypass or tunnelling worth a look.
  - slice_name: Outbound SMTP
    viz_type: table
    description: 'Hosts sending mail directly to the internet — compromised hosts used as spam relays
      show up here. A triage signal, not a finding: confirm with CloudTrail, host evidence and the owner
      of the workload before concluding.'
  - slice_name: Long-Running and Low-and-Slow Flows
    viz_type: table
    description: 'The same flow seen across many aggregation windows, with its average rate. A long span
      at a low rate is the low-and-slow pattern. A triage signal, not a finding: confirm with CloudTrail,
      host evidence and the owner of the workload before concluding.'
  - slice_name: Periodic Flow-Log Observations
    viz_type: table
    description: 'Flows to external peers observed at a regular interval over at least 12 hours and 20
      active one-minute buckets. Jitter is the median absolute deviation of the gaps divided by the period;
      confidence drops when SKIPDATA overlaps the interval. Periods at or below the aggregation window
      are excluded because they only reproduce the logging cadence. Updaters, health checks and NTP are
      periodic too. A triage signal, not a finding: confirm with CloudTrail, host evidence and the owner
      of the workload before concluding.'
  - slice_name: Internal Admin-Port Traffic
    viz_type: table
    description: 'Private-to-private SSH, RPC, SMB, RDP and WinRM. Uses packet-level addresses, so it
      includes records without a recorded direction; a flow seen on both ENIs counts twice (observing_interfaces
      = 2). A triage signal, not a finding: confirm with CloudTrail, host evidence and the owner of the
      workload before concluding.'
  - slice_name: First-Seen Internal Pairs
    viz_type: table
    description: 'Internal source → destination → port combinations that first appear at least a day after
      the data begins. New admin-port pairs are the clearest lateral-movement lead. A triage signal, not
      a finding: confirm with CloudTrail, host evidence and the owner of the workload before concluding.'
  - slice_name: Internal Fan-Out by Source
    viz_type: dist_bar
    description: Internal hosts talking to the most internal destinations — discovery and spreading look
      like a fan-out spike.
  - slice_name: Internal Inbound Followed by External Egress
    viz_type: table
    description: 'Hosts that received internal traffic and afterwards sent accepted traffic to the internet:
      the staging-then-exfiltration shape. A triage signal, not a finding: confirm with CloudTrail, host
      evidence and the owner of the workload before concluding.'
  - slice_name: ICMP / ICMPv6 Peers
    viz_type: table
    description: ICMP and ICMPv6 observations. Flow logs record ports as 0 for ICMP, so type and code
      are not available; large byte counts suggest tunnelling.
  - slice_name: UDP Fan-Out to External Hosts
    viz_type: dist_bar
    description: Sources sending UDP to many external hosts — reflection, amplification or C2 over UDP.
  - slice_name: Unusual IP Protocols
    viz_type: dist_bar
    description: Anything other than TCP, UDP, ICMP and ICMPv6 — GRE, IP-in-IP and ESP are tunnels.
  - slice_name: IPv6 Flows
    viz_type: table
    description: All IPv6 observations. IPv4-centric views miss these; an unexpected IPv6 path to the
      internet bypasses IPv4 egress controls.
  - slice_name: Inbound Countries
    viz_type: big_number_total
    description: Countries of external sources with a recorded direction. Needs GeoLite2.
  - slice_name: Outbound Countries
    viz_type: big_number_total
    description: Countries of external destinations with a recorded direction. Needs GeoLite2.
  - slice_name: External ASNs
    viz_type: big_number_total
    description: Distinct ASNs of external peers. Needs GeoLite2-ASN.
  - slice_name: Inbound Accepted — Origin Map
    viz_type: world_map
    description: 'Where accepted inbound traffic comes from. A triage signal, not a finding: confirm with
      CloudTrail, host evidence and the owner of the workload before concluding.'
  - slice_name: Inbound Rejected — Origin Map
    viz_type: world_map
    description: Where rejected inbound traffic comes from — mostly internet background scanning.
  - slice_name: Outbound Bytes — Destination Map
    viz_type: world_map
    description: 'Where accepted egress bytes go. A triage signal, not a finding: confirm with CloudTrail,
      host evidence and the owner of the workload before concluding.'
  - slice_name: Inbound Records by Country and Action
    viz_type: table
    description: Inbound observations per country, split by action. A country with an unusually high accept
      share is reaching exposed services.
  - slice_name: Inbound Accepted Ports by Country
    viz_type: table
    description: 'Which ports each country reaches. Admin ports from unexpected countries come first to
      mind. A triage signal, not a finding: confirm with CloudTrail, host evidence and the owner of the
      workload before concluding.'
  - slice_name: Top Outbound ASNs by Bytes
    viz_type: table
    description: 'Egress volume per autonomous system. Hosting and VPS providers (DigitalOcean, OVH, Linode,
      Hetzner, Choopa …) are where attacker infrastructure usually lives; check the organisation column.
      A triage signal, not a finding: confirm with CloudTrail, host evidence and the owner of the workload
      before concluding.'
  - slice_name: Rare Outbound Countries
    viz_type: table
    description: 'Destination countries with the fewest egress observations, rarest first. A triage signal,
      not a finding: confirm with CloudTrail, host evidence and the owner of the workload before concluding.'
  - slice_name: REJECT Reasons (BPA / Encryption Controls)
    viz_type: pie
    description: Rejections attributed to VPC Block Public Access (BPA) or VPC Encryption Controls (EC).
      Other rejections carry no reason.
  - slice_name: Encryption Status
    viz_type: pie
    description: Encryption in transit as reported with VPC Encryption Controls. Application-encrypted
      is inferred from the port for endpoints, not from the payload.
  - slice_name: Egress to AWS Services by Path
    viz_type: dist_bar
    description: Egress bytes to AWS service ranges, split by path. S3 through the internet gateway instead
      of a gateway endpoint costs money and leaves the VPC; the ambiguous path is shown separately.
  - slice_name: Middlebox Interfaces
    viz_type: table
    description: Records captured on NAT gateways, load balancers, transit gateways and endpoints. Their
      addresses are the middlebox's, not a victim host's — use the packet-level addresses.
  - slice_name: Egress Heatmap (UTC Hour × Weekday)
    viz_type: heatmap
    description: 'Accepted egress bytes to the internet by UTC hour and weekday. Volume outside working
      hours on hosts that are busy only by day deserves a look. A triage signal, not a finding: confirm
      with CloudTrail, host evidence and the owner of the workload before concluding.'
