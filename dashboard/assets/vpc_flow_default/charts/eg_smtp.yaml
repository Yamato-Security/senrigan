# VFL-25: Outbound SMTP
uuid: f10f1004-0000-4000-8000-000000000025
version: 1.0.0
dataset_uuid: f10f1002-0000-4000-8000-000000000001
slice_name: Outbound SMTP
viz_type: table
description: 'Hosts sending mail directly to the internet — compromised hosts used as spam relays show
  up here. A triage signal, not a finding: confirm with CloudTrail, host evidence and the owner of the
  workload before concluding. (VFL-25)'
query_context: ''
params:
  metrics:
  - expressionType: SQL
    sqlExpression: COUNT(*)
    label: records
    hasCustomLabel: true
    optionName: metric_records
  - expressionType: SQL
    sqlExpression: SUM(bytes_measured)
    label: bytes_measured
    hasCustomLabel: true
    optionName: metric_bytes_measured
  - expressionType: SQL
    sqlExpression: MIN(start_time)
    label: first_seen
    hasCustomLabel: true
    optionName: metric_first_seen
  groupby:
  - local_addr
  - remote_addr
  - dstport
  - remote_geo_country_code
  adhoc_filters:
  - clause: WHERE
    expressionType: SQL
    sqlExpression: direction_source = 'record' AND flow_direction = 'egress' AND remote_scope = 'public'
      AND dstport IN (25, 465, 587)
    filterOptionName: filter_480921
  granularity_sqla: start_time
  time_range: No filter
  row_limit: 100
  order_desc: true
  page_size: 25
  include_time: false
cache_timeout: null
