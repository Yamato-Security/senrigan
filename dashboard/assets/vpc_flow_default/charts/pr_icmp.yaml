# VFL-32: ICMP / ICMPv6 Peers
uuid: f10f1004-0000-4000-8000-000000000032
version: 1.0.0
dataset_uuid: f10f1002-0000-4000-8000-000000000001
slice_name: ICMP / ICMPv6 Peers
viz_type: table
description: ICMP and ICMPv6 observations. Flow logs record ports as 0 for ICMP, so type and code are
  not available; large byte counts suggest tunnelling. (VFL-32)
query_context: ''
params:
  metrics:
  - expressionType: SQL
    sqlExpression: COUNT(*)
    label: records
    hasCustomLabel: true
    optionName: metric_records
  - expressionType: SQL
    sqlExpression: SUM(bytes_measured)
    label: bytes_measured
    hasCustomLabel: true
    optionName: metric_bytes_measured
  - expressionType: SQL
    sqlExpression: MIN(start_time)
    label: first_seen
    hasCustomLabel: true
    optionName: metric_first_seen
  groupby:
  - flow_src
  - flow_dst
  - protocol_name
  adhoc_filters:
  - clause: WHERE
    expressionType: SQL
    sqlExpression: log_status = 'OK' AND protocol_name IN ('ICMP', 'ICMPv6')
    filterOptionName: filter_86332668
  granularity_sqla: start_time
  time_range: No filter
  row_limit: 100
  order_desc: true
  page_size: 25
  include_time: false
cache_timeout: null
