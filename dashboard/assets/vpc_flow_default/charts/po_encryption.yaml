version: 1.0.0
dataset_uuid: f10f1002-0000-4000-8000-000000000001
slice_name: Encryption Status
viz_type: pie
description: Encryption in transit as reported with VPC Encryption Controls. Application-encrypted is
  inferred from the port for endpoints, not from the payload. (VFL-47)
query_context: ''
params:
  metric:
    expressionType: SQL
    sqlExpression: COUNT(*)
    label: records
    hasCustomLabel: true
    optionName: metric_records
  groupby:
