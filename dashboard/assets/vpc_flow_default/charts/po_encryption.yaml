    sqlExpression: CASE encryption_status WHEN 0 THEN 'Not encrypted' WHEN 1 THEN 'Nitro-encrypted' WHEN
      2 THEN 'Application-encrypted' WHEN 3 THEN 'Nitro + application' END
    label: encryption
    hasCustomLabel: true
  adhoc_filters:
  - clause: WHERE
    expressionType: SQL
    sqlExpression: encryption_status IS NOT NULL
    filterOptionName: filter_71352614
  granularity_sqla: start_time
  time_range: No filter
  row_limit: 20
  color_scheme: supersetColors
  donut: true
  show_labels: true
  label_type: key_percent
  rich_tooltip: true
cache_timeout: null
