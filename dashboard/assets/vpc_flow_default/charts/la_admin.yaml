# VFL-28: Internal Admin-Port Traffic
uuid: f10f1004-0000-4000-8000-000000000028
version: 1.0.0
dataset_uuid: f10f1002-0000-4000-8000-000000000001
slice_name: Internal Admin-Port Traffic
viz_type: table
description: 'Private-to-private SSH, RPC, SMB, RDP and WinRM. Uses packet-level addresses, so it includes
  records without a recorded direction; a flow seen on both ENIs counts twice (observing_interfaces =
  2). A triage signal, not a finding: confirm with CloudTrail, host evidence and the owner of the workload
  before concluding. (VFL-28)'
query_context: ''
params:
  metrics:
  - expressionType: SQL
    sqlExpression: COUNT(*)
    label: observations
    hasCustomLabel: true
    optionName: metric_observations
  - expressionType: SQL
    sqlExpression: SUM(bytes_measured)
    label: bytes_measured
    hasCustomLabel: true
    optionName: metric_bytes_measured
  - expressionType: SQL
    sqlExpression: MIN(start_time)
    label: first_seen
    hasCustomLabel: true
    optionName: metric_first_seen
  - expressionType: SQL
    sqlExpression: MAX(start_time)
    label: last_seen
    hasCustomLabel: true
    optionName: metric_last_seen
  - expressionType: SQL
    sqlExpression: COUNT(DISTINCT interface_id)
    label: observing_interfaces
    hasCustomLabel: true
    optionName: metric_observing_interfaces
  groupby:
  - flow_src
  - flow_dst
  - dstport
  adhoc_filters:
  - clause: WHERE
    expressionType: SQL
    sqlExpression: log_status = 'OK' AND src_scope = 'private' AND dst_scope = 'private' AND dstport IN
      (22, 135, 139, 445, 3389, 5985, 5986)
    filterOptionName: filter_38336529
  granularity_sqla: start_time
  time_range: No filter
  row_limit: 200
  order_desc: true
  page_size: 25
  include_time: false
cache_timeout: null
