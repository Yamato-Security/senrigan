  before concluding. (VFL-43)'
query_context: ''
params:
  metrics:
  - expressionType: SQL
    sqlExpression: COUNT(*)
    label: records
    hasCustomLabel: true
    optionName: metric_records
  - expressionType: SQL
    sqlExpression: SUM(bytes_measured)
    label: bytes_measured
    hasCustomLabel: true
    optionName: metric_bytes_measured
  groupby:
  - remote_geo_country_code
  - dstport
  adhoc_filters:
