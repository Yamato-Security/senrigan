  - expressionType: SQL
    sqlExpression: SUM(bytes_measured)
    label: bytes_measured
    hasCustomLabel: true
    optionName: metric_bytes_measured
  - expressionType: SQL
    sqlExpression: COUNT(DISTINCT remote_addr)
    label: destinations
    hasCustomLabel: true
    optionName: metric_destinations
  groupby:
  - remote_geo_asn
  - remote_geo_org
  adhoc_filters:
