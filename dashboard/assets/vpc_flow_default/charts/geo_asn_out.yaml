description: 'Egress volume per autonomous system. Hosting and VPS providers (DigitalOcean, OVH, Linode,
  Hetzner, Choopa …) are where attacker infrastructure usually lives; check the organisation column. A
  triage signal, not a finding: confirm with CloudTrail, host evidence and the owner of the workload before
  concluding. (VFL-44)'
query_context: ''
params:
