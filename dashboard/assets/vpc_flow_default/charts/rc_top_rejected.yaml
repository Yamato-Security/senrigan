  before concluding. (VFL-14)'
query_context: ''
params:
  metrics:
  - expressionType: SQL
    sqlExpression: COUNT(*)
    label: rejected_records
    hasCustomLabel: true
    optionName: metric_rejected_records
  groupby:
  - remote_addr
  columns: []
  adhoc_filters:
  - clause: WHERE
    expressionType: SQL
    sqlExpression: direction_source = 'record' AND flow_direction = 'ingress' AND remote_scope = 'public'
      AND action = 'REJECT'
