  granularity_sqla: start_time
  time_range: No filter
  row_limit: 20
  order_desc: true
  orientation: horizontal
  x_axis_label: Rejected records
  y_axis_label: Source
  color_scheme: supersetColors
  rich_tooltip: true
  show_legend: false
